name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src scripts

      - name: Import boundaries
        run: uv run lint-imports

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

      # The billing modules must stay at 100% line coverage; the rest of the
      # codebase is reported above but not gated. Reads the data the Test
      # step just wrote.
      - name: Billing coverage
        run: >-
          uv run coverage report --fail-under=100
          --include="src/volleyflow/pricing.py,src/volleyflow/settlement.py,src/volleyflow/ledger.py"

      # The frontend has no build step, so its tests run on the Node already
      # on the runner, with no dependencies.
      - name: Frontend tests
        run: node --test tests/frontend/*.test.js

      # A workflow file that does not parse silently never runs.
      - name: Workflow files parse
        run: uv run python scripts/check_workflows.py

      # The Postgres tests run against the Neon dev branch, so its schema is
      # brought up to date first. The in-memory tests build their schema
      # from the models and would not notice a missing migration.
      - name: Migrate dev
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL (the Neon dev branch) is not set — the Postgres tests cannot run" >&2
            exit 1
          fi
          uv run alembic current
          uv run alembic upgrade head
          uv run alembic current
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Postgres tests
        run: uv run pytest -m postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Production is migrated here, after every test passes and before the
      # deploy that needs the new schema. A no-op when nothing is pending.
      # Refuses to continue without the secret rather than deploying anyway.
      - name: Migrate production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "PRODUCTION_DATABASE_URL is not set — refusing to deploy" >&2
            exit 1
          fi
          uv run alembic current
          uv run alembic upgrade head
          uv run alembic current
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      # Deploys are triggered explicitly with Render's deploy hook, only
      # after everything above has passed.
      - name: Deploy to Render
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
