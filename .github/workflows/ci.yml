name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Import boundaries
        run: uv run lint-imports

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

      - name: Postgres tests
        run: uv run pytest -m postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # GitHub's push webhook to Render's auto-deploy stopped firing
      # after the repo got deleted and recreated (see docs/dev-log.md,
      # 2026-09-05) — several attempts to fix the GitHub App connection
      # itself didn't hold, so deploys are triggered explicitly here
      # instead of depending on that integration.
      - name: Deploy to Render
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
