name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Import boundaries
        run: uv run lint-imports

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

      # The frontend has no build step and no framework, so its checks
      # run on the Node that's already on the runner — no dependencies to
      # install. They guard the parts that would be expensive to get
      # wrong: the billing preview the wizard shows, who the game sheet
      # says is playing, and what the cache is allowed to overrule.
      - name: Frontend tests
        run: node --test tests/frontend/*.test.js

      # A workflow file that doesn't parse doesn't run, and GitHub reports
      # it under its filename instead of its name — which is easy to miss
      # next to a green CI. That is how a broken deploy-pages.yml shipped:
      # CI passed, the deploy never happened, and the site quietly stayed
      # on the previous build.
      - name: Workflow files parse
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for f in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  if not yaml.safe_load(f.read_text(encoding="utf-8")).get("name"):
                      bad.append(f"{f}: no name")
              except Exception as e:
                  bad.append(f"{f}: {e}")
          print("
".join(bad) or "all workflow files parse")
          sys.exit(1 if bad else 0)
          PY

      - name: Postgres tests
        run: uv run pytest -m postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # GitHub's push webhook to Render's auto-deploy stopped firing
      # after the repo got deleted and recreated (see docs/dev-log.md,
      # 2026-09-05) — several attempts to fix the GitHub App connection
      # itself didn't hold, so deploys are triggered explicitly here
      # instead of depending on that integration.
      - name: Deploy to Render
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
