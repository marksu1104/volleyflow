name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src scripts

      - name: Import boundaries
        run: uv run lint-imports

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

      # The frontend has no build step and no framework, so its checks
      # run on the Node that's already on the runner — no dependencies to
      # install. They guard the parts that would be expensive to get
      # wrong: the billing preview the wizard shows, who the game sheet
      # says is playing, and what the cache is allowed to overrule.
      - name: Frontend tests
        run: node --test tests/frontend/*.test.js

      # A workflow file that doesn't parse doesn't run, and GitHub
      # reports it under its filename rather than its name — easy to miss
      # beside a green CI. That is how a broken deploy-pages.yml shipped:
      # CI passed, the deploy never ran, and the site quietly stayed on
      # the previous build while the app looked fine.
      - name: Workflow files parse
        run: uv run python scripts/check_workflows.py

      - name: Postgres tests
        run: uv run pytest -m postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Migrations run here, against production, *before* the deploy that
      # needs them. They were applied by hand until now because Render's
      # pre-deploy command is a paid feature — which took production down
      # once already (deploy first, SQL second, see docs/dev-log.md), and
      # since then every schema change has needed a human to paste SQL at
      # exactly the right moment. Nothing about that was ever going to
      # get more reliable with practice.
      #
      # Alembic is idempotent: a run with nothing to do is a no-op, so
      # this is harmless on the majority of pushes that change no schema.
      # Skipped entirely when the secret isn't set, so a fork or a
      # misconfigured repo fails loudly on the deploy rather than
      # silently running migrations somewhere unexpected.
      - name: Migrate production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "PRODUCTION_DATABASE_URL is not set — refusing to deploy" >&2
            exit 1
          fi
          uv run alembic current
          uv run alembic upgrade head
          uv run alembic current
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      # GitHub's push webhook to Render's auto-deploy stopped firing
      # after the repo got deleted and recreated (see docs/dev-log.md,
      # 2026-09-05) — several attempts to fix the GitHub App connection
      # itself didn't hold, so deploys are triggered explicitly here
      # instead of depending on that integration.
      - name: Deploy to Render
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
