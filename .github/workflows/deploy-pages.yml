name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The scripts and the stylesheet are referenced at URLs that never
      # change, so a browser that already has them has no reason to ask
      # again, and LINE's in-app webview holds onto them hard enough that
      # deployed fixes kept appearing not to have shipped. Stamping the
      # commit onto every js/ and css/ URL makes each deploy a new file to
      # fetch. Done here rather than in the source so the checked-in HTML
      # stays readable.
      - name: Version the scripts and stylesheet
        run: |
          cd frontend
          sha="${GITHUB_SHA::8}"
          sed -i -E 's#(src="js/[^"?]+\.js)"#\1?v='"$sha"'"#g; s#(href="css/[^"?]+\.css)"#\1?v='"$sha"'"#g' *.html
          # Stamp the build onto the page itself too: a cached HTML file
          # served with fresh scripts would otherwise never show a change
          # that lives in the markup. assertFreshBuild (js/common/api.js)
          # compares the two and reloads once when they disagree.
          sed -i '/<head>/a <meta name="vf-build" content="'"$sha"'">' *.html
          grep -o '\(js\|css\)/[^"]*?v=[0-9a-f]*' member.html | sort -u

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - id: deployment
        uses: actions/deploy-pages@v4
