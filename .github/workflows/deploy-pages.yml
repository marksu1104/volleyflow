name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # shared.js and shared.css are referenced at a URL that never
      # changes, so a browser that already has them has no reason to ask
      # again — and LINE's in-app webview holds onto them hard enough
      # that deployed fixes kept appearing not to have shipped. Stamping
      # the commit onto the URL makes every deploy a new file to fetch.
      # Done here rather than in the source so the checked-in HTML stays
      # readable and nothing has to be remembered by hand.
      - name: Version the shared assets
        run: |
          cd frontend
          sha="${GITHUB_SHA::8}"
          sed -i "s|src=\"shared.js\"|src=\"shared.js?v=$sha\"|g" *.html
          sed -i "s|href=\"shared.css\"|href=\"shared.css?v=$sha\"|g" *.html
          # Stamp the build onto the page itself. Only shared.js and
          # shared.css carried a version, so a cached HTML file served
          # with a fresh shared.js was a normal outcome — and any change
          # living in the markup (a new form field, a new section) simply
          # never appeared. shared.js compares these two and reloads once
          # when they disagree; see assertFreshBuild.
          sed -i "s|<head>|<head>
<meta name=\"vf-build\" content=\"$sha\">|" *.html
          grep -o 'shared\.\(js\|css\)?v=[0-9a-f]*' member.html | sort -u

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - id: deployment
        uses: actions/deploy-pages@v4
