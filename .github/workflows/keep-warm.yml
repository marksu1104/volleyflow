name: Keep the API warm

on:
  schedule:
    # Render's free tier sleeps after about 15 quiet minutes, and waking takes
    # about 30 seconds. Pinging every 10 minutes from 06:00 to 24:00 Taiwan
    # time (22:00-16:00 UTC) keeps it awake when anyone uses the app, within
    # the free 750 instance-hours a month (about 550 used).
    - cron: "*/10 22-23,0-16 * * *"
  workflow_dispatch: {}

# A slow ping should never pile up behind an earlier one.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # /health touches no database, so this does not wake Neon too.
      - name: Ping /health
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
              https://volleyflow.onrender.com/health) && [ "$code" = "200" ] && {
              echo "awake (HTTP $code) on attempt $attempt"; exit 0; }
            echo "attempt $attempt got '${code:-no response}', retrying"
            sleep 20
          done
          echo "could not reach the API after 3 attempts"
          exit 1
