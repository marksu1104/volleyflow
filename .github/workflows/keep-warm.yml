name: Keep the API warm

on:
  schedule:
    # Render's free tier stops the instance after about 15 minutes of
    # quiet, and waking it takes roughly 30 seconds — two hundred times
    # the ~0.15s a warm request costs, and by far the largest delay
    # anyone actually feels. Pinging every 10 minutes keeps it up.
    #
    # 22:00–16:00 UTC is 06:00–24:00 Taiwan time: the hours anyone opens
    # this. Sleeping through the small hours is deliberate — the free
    # tier allows 750 instance-hours a month and staying awake around
    # the clock would spend ~730 of them, leaving no margin. This uses
    # about 550, and the first visitor of the morning waits once.
    - cron: "*/10 22-23,0-16 * * *"
  workflow_dispatch: {}

# A slow ping should never pile up behind an earlier one.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # /health deliberately touches no database, so this keeps the web
      # instance awake without waking Neon or burning its compute too.
      - name: Ping /health
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
              https://volleyflow.onrender.com/health) && [ "$code" = "200" ] && {
              echo "awake (HTTP $code) on attempt $attempt"; exit 0; }
            echo "attempt $attempt got '${code:-no response}', retrying"
            sleep 20
          done
          echo "could not reach the API after 3 attempts"
          exit 1
