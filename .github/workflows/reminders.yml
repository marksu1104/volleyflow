name: Send game reminders

on:
  schedule:
    # 01:00 UTC = 09:00 Taiwan time. Runs daily; the script itself finds
    # whether any game is scheduled for tomorrow and no-ops otherwise, so
    # it doesn't need to know the group's actual game day.
    - cron: "0 1 * * *"
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Send reminders
        # PRODUCTION_DATABASE_URL, not DATABASE_URL — that secret is the
        # Neon dev branch (see ci.yml's Postgres-tests step). Pointed at
        # dev since this workflow was created, so every run "succeeded"
        # against seed data and no reminder had ever reached a real game.
        run: uv run python -m volleyflow.notify.reminders
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          # No LINE_GROUP_ID: there is no group message. The only thing
          # this sends is the short-roster alert, to the organizer alone.
          LINE_ORGANIZER_USER_ID: ${{ secrets.LINE_ORGANIZER_USER_ID }}
