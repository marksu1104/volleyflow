name: Send join request digests

on:
  schedule:
    # 01:00 UTC = 09:00 Taiwan time, once a day: one message per club with
    # people waiting to join. Deadline notices are in deadline-notices.yml.
    - cron: "0 1 * * *"
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Send join request digests
        # PRODUCTION_DATABASE_URL: the DATABASE_URL secret is the Neon dev branch.
        run: uv run python -m volleyflow.notify.reminders
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          # Nothing is sent to a group, and each notice goes to the organizers of
          # the club concerned, looked up in the database.
