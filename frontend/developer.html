<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolleyFlow 後台總覽</title>
<link rel="preconnect" href="https://volleyflow.onrender.com" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap">
<link rel="stylesheet" href="css/shared.css">
<style>
  /* Four figures first, then what went wrong and what was done, then the
     clubs, so a long list of empty test clubs never pushes the numbers
     that matter out of sight. The other counts are under 其他統計. */
  .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
  .kpi { display: flex; flex-direction: column; gap: 2px; min-height: 84px; box-sizing: border-box; padding: 14px 16px; background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; }
  .kpi-num { font-family: var(--font-num); font-size: 2rem; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; color: var(--ink); }
  .kpi-num .spinner { margin: 8px 0 4px; }
  .kpi-label { font-size: .88rem; font-weight: 700; color: var(--ink-soft); }
  /* Only state earns a colour: unread reports waiting to be read. */
  .kpi.attention { background: var(--warn-soft); border-color: transparent; }
  .kpi.attention .kpi-num, .kpi.attention .kpi-label { color: var(--warn); }

  .lgroup .lgroup-note { margin-left: 6px; font-weight: 500; color: var(--ink-faint); }
  .lcard .block-state { padding: 16px; }
  .lcard .state-pill { flex: none; }

  .err-row { display: grid; gap: 4px; padding: 12px 16px; }
  .err-row + .err-row { border-top: 1px solid var(--rule); }
  .err-head { display: flex; justify-content: space-between; gap: 10px; font-size: .85rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .err-page { font-weight: 700; color: var(--ink); }
  .err-what { font-weight: 700; color: var(--bad); overflow-wrap: anywhere; }
  .err-kv { display: flex; gap: 10px; font-size: .85rem; }
  .err-kv .k { flex: none; width: 2.6em; color: var(--ink-soft); }
  .err-kv code { min-width: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .8rem; overflow-wrap: anywhere; }

  .act-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; }
  .act-row + .act-row { border-top: 1px solid var(--rule); }
  .act-dot { flex: none; width: 8px; height: 8px; margin-top: 8px; border-radius: 50%; background: var(--ink-faint); }
  .act-dot.money { background: var(--accent); }
  .act-dot.remove { background: var(--bad); }
  .act-main { flex: 1; min-width: 0; }
  .act-text { font-size: .95rem; line-height: 1.5; overflow-wrap: anywhere; }
  .act-meta { margin-top: 2px; font-size: .8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .club-search { margin-bottom: 10px; }
  .dclub .lrow-k { flex-direction: column; align-items: flex-start; gap: 2px; }
  .dclub .lrow-name { max-width: 100%; font-weight: 700; }
  .dclub-meta { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .8rem; font-weight: 400; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  #stats-toggle .lrow-go svg { transition: transform .15s; }
  #stats-toggle[aria-expanded="true"] .lrow-go svg { transform: rotate(180deg); }
  .lrow .lrow-v.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-bar">
    <span class="app-bar-left">
      <button type="button" class="back-btn" onclick="location.href='profile.html'">‹ 返回</button>
    </span>
    <button type="button" class="brand" onclick="location.href='member.html'">VolleyFlow</button>
    <span class="app-bar-right"></span>
  </div>

  <h1>後台總覽</h1>
  <p class="hint" id="overview-sub"></p>
  <div id="overview">
    <div class="kpis" id="kpis"></div>

    <div class="lgroup">錯誤紀錄<span class="lgroup-note">最近 7 天</span></div>
    <div class="lcard" id="errors"></div>

    <div class="lgroup">最近操作</div>
    <div class="lcard" id="activity"></div>
    <button type="button" class="fold" id="activity-more" hidden></button>

    <div class="lgroup">球隊<span class="lgroup-note" id="club-count"></span></div>
    <input id="club-search" class="control club-search" type="search" placeholder="搜尋球隊名稱或管理員" aria-label="搜尋球隊" autocomplete="off">
    <div class="lcard" id="clubs"></div>
    <button type="button" class="fold" id="clubs-empty-toggle" hidden></button>

    <div class="lgroup">其他</div>
    <div class="lcard">
      <a class="lrow" href="reports.html"><span class="lrow-k">問題回報</span><span class="lrow-v" id="reports-unread"></span><span class="lrow-go" aria-hidden="true"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>
      <button type="button" class="lrow" id="stats-toggle" aria-expanded="false" aria-controls="stats"><span class="lrow-k">其他統計</span><span class="lrow-go" aria-hidden="true"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
    </div>
    <div id="stats" hidden></div>
  </div>
</div>

<script src="js/common/format.js"></script>
<script src="js/common/api.js"></script>
<script src="js/common/errors.js"></script>
<script src="js/common/feedback.js"></script>
<script src="js/common/clubs.js"></script>
<script src="js/common/season.js"></script>
<script src="js/common/game-sheet.js"></script>
<script src="js/pages/developer.js"></script>
</body>
</html>
