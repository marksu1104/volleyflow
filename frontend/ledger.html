<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolleyFlow 我的帳務</title>
<link rel="preconnect" href="https://volleyflow.onrender.com" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap">
<link rel="stylesheet" href="css/shared.css">
</head>
<body>
<div class="wrap">
  <div class="app-bar">
    <span class="app-bar-left">
      <button type="button" class="back-btn" onclick="goBack()">‹ 返回</button>
    </span>
    <button type="button" class="brand" onclick="location.href='member.html'">VolleyFlow</button>
    <span class="app-bar-right"></span>
  </div>

  <h1>我的帳務</h1>

  <div id="page-state"></div>

  <div id="content" hidden>
    <div id="owed-total" hidden></div>
    <p class="section-label" id="clubs-label">我的球隊</p>
    <div id="clubs-list"></div>
    <p class="hint">每一隊的帳各自計算，不會互相流用。選擇球隊可查看明細。</p>
  </div>
</div>

<!-- One club's breakdown, opened from a row. Same sheet pattern as the
     member page's 我的帳務 and the organizer's screens. -->
<div id="detail-backdrop" class="gsheet-backdrop" hidden onclick="if (event.target === this) closeDetail()">
  <div class="gsheet">
    <button type="button" class="gsheet-close" onclick="closeDetail()">✕</button>
    <h3 id="dt-club"></h3>
    <div id="dt-total" class="lg-total"></div>
    <div id="dt-rows"></div>
    <!-- In the sheet rather than on the row: the row is already a
         button, and a button cannot contain another one. Putting it here
         also keeps every row identical, instead of one row carrying an
         extra control its neighbours do not have. -->
    <button type="button" class="btn btn-quiet" id="dt-goto" style="width:100%;margin-top:14px" hidden>前往這個球隊</button>
  </div>
</div>

<script src="js/common/format.js"></script>
<script src="js/common/api.js"></script>
<script src="js/common/errors.js"></script>
<script src="js/common/feedback.js"></script>
<script src="js/common/clubs.js"></script>
<script src="js/common/season.js"></script>
<script src="js/common/game-sheet.js"></script>
<script src="js/pages/ledger.js"></script>
</body>
</html>
