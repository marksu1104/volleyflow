<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolleyFlow 會員頁</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="shared.css">
<style>
  .identity { font-size: .82rem; color: var(--ink-soft); margin-bottom: 14px; min-height: 1.2em; }
  .name-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .name-row input {
    flex: 1; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px;
    font-size: .95rem; background: var(--surface);
  }
  .balance-card {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 12px;
    padding: 14px 16px; margin: 10px 0; display: none;
  }
  .balance-card.show { display: flex; justify-content: space-between; align-items: center; }
  .balance-label { font-size: .82rem; color: var(--ink-soft); }
  .balance-value { font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .balance-value.owe { color: var(--bad); }
  .balance-value.owed { color: var(--good); }
  .balance-value.even { color: var(--ink-soft); }

  .empty { color: var(--ink-soft); font-size: .85rem; padding: 20px 0; text-align: center; }

  button.action {
    margin-top: 10px; padding: 7px 14px; border: none; border-radius: 7px;
    background: var(--accent-soft); color: var(--accent); font-size: .84rem;
    font-weight: 600; cursor: pointer;
  }
  button.action.cancel { background: var(--bad-soft); color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <h1>本季場次</h1>
  <div id="identity" class="identity"></div>

  <div class="name-row">
    <input id="player-name" type="text" placeholder="你的名字">
  </div>
  <div id="gender-row" class="gender-row" hidden>
    <span class="gender-label">性別</span>
    <button type="button" class="gender-btn" data-set-gender="male">男</button>
    <button type="button" class="gender-btn" data-set-gender="female">女</button>
  </div>
  <select id="season-picker" class="season-picker"></select>
  <div id="error"></div>

  <div id="glance" class="glance" style="display:none">
    <div class="glance-label">下一場</div>
    <div id="glance-main" class="glance-main"></div>
    <div id="glance-sub" class="glance-sub"></div>
  </div>

  <div id="balance-card" class="balance-card">
    <span class="balance-label">目前餘額</span>
    <span id="balance-value" class="balance-value"></span>
  </div>

  <div id="month-cal" class="mcal"></div>
</div>

<div id="game-sheet-backdrop" class="gsheet-backdrop" hidden>
  <div class="gsheet">
    <button class="gsheet-close" aria-label="關閉">✕</button>
    <div id="game-detail"></div>
  </div>
</div>

<script src="shared.js"></script>
<script>
  const API_BASE = "https://volleyflow.onrender.com";
  const LIFF_ID = "2011156233-6CouG6VI";
  let currentSeasonId = null;
  let currentSeason = null;
  let selectedGameId = null;

  // Try to get the player's real LINE identity via LIFF. If this page
  // wasn't opened through LIFF (e.g. testing directly in a desktop
  // browser), fall back to the manual name input — the API identifies
  // players by name either way, so nothing else changes.
  (async function initLiff() {
    const identityEl = document.getElementById("identity");
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return; // page reloads after LINE login redirects back
      }
      const profile = await liff.getProfile();
      const nameInput = document.getElementById("player-name");
      nameInput.value = profile.displayName;
      nameInput.disabled = true;
      identityEl.textContent = `已用 LINE 身分登入：${profile.displayName}`;
      // liff.getProfile() and the season picker's own /seasons fetch race
      // each other on load. Setting .value here doesn't fire "change", so
      // if the season already rendered while the name was still blank,
      // nothing would ever show this person as a member. Re-render now
      // that the real name is known, whichever order they resolved in.
      if (currentSeasonId) loadSeason(currentSeasonId);
    } catch (e) {
      console.warn("LIFF unavailable, falling back to manual name entry:", e);
      identityEl.textContent = "（非 LINE 環境，手動輸入名字測試）";
    }
  })();

  document.getElementById("player-name").addEventListener("change", () => {
    if (currentSeasonId) loadSeason(currentSeasonId);
  });

  initSeasonPicker(API_BASE, document.getElementById("season-picker"), "vf_season", (id) => {
    if (id) loadSeason(id);
  });

  async function loadSeason(seasonId) {
    currentSeasonId = seasonId;
    const errorEl = document.getElementById("error");
    errorEl.textContent = "";
    try {
      const res = await fetch(`${API_BASE}/seasons/${seasonId}`);
      if (!res.ok) { errorEl.textContent = "找不到這一季"; return; }
      const season = await res.json();
      const isNewSeason = !currentSeason || currentSeason.id !== season.id;
      currentSeason = season;
      // Keep whatever game was selected across a reload (e.g. after
      // taking an action) — only reset to the next upcoming game when
      // switching to a different season, or on first load.
      if (isNewSeason || !season.games.some((g) => g.id === selectedGameId)) {
        const upcoming = season.games.find((g) => !describeDate(g.date).isPast) || season.games[season.games.length - 1];
        selectedGameId = upcoming ? upcoming.id : null;
      }
      renderGlance(season);
      renderGenderPicker(season);
      renderMonthCalendar(document.getElementById("month-cal"), season.games, selectGame);
      renderSelectedGameDetail();
      await renderBalance(season);
    } catch (e) {
      errorEl.textContent = "連不上伺服器：" + e.message;
    }
  }

  function selectGame(gameId) {
    selectedGameId = gameId;
    renderSelectedGameDetail();
    openGameSheet();
  }

  function renderSelectedGameDetail() {
    const el = document.getElementById("game-detail");
    const game = currentSeason && currentSeason.games.find((g) => g.id === selectedGameId);
    if (!currentSeason || !game) {
      el.innerHTML = '<div class="empty">這一季還沒有場次</div>';
      return;
    }
    const playerName = document.getElementById("player-name").value.trim();
    renderGameDetail(el, currentSeason, game, {
      extraHtml: buildMyActionHtml(currentSeason, game),
      onAssignSubstitute: (absenceId, name, gender) =>
        assignSubstitute(absenceId, name, gender),
      canAssignSubstitute: (absence) => absence.player_name === playerName,
    });
  }

  function openGameSheet() {
    document.getElementById("game-sheet-backdrop").hidden = false;
  }

  function closeGameSheet() {
    document.getElementById("game-sheet-backdrop").hidden = true;
  }

  const gameSheetBackdrop = document.getElementById("game-sheet-backdrop");
  gameSheetBackdrop.addEventListener("click", (e) => {
    if (e.target === gameSheetBackdrop) closeGameSheet();
  });
  document.querySelector(".gsheet-close").addEventListener("click", closeGameSheet);

  // Gender is self-reported once, from the member's own name match —
  // same known gap as the balance card: a drop-in's player id isn't
  // exposed by the season detail endpoint, only fixed members have one.
  function renderGenderPicker(season) {
    const playerName = document.getElementById("player-name").value.trim();
    const member = season.members.find((m) => m.name === playerName);
    const row = document.getElementById("gender-row");
    if (!member) {
      row.hidden = true;
      return;
    }
    row.hidden = false;
    row.dataset.playerId = member.id;
    for (const btn of row.querySelectorAll("[data-set-gender]")) {
      btn.classList.toggle("selected", member.gender === btn.dataset.setGender);
    }
  }

  document.getElementById("gender-row").addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-set-gender]");
    if (!btn) return;
    const playerId = document.getElementById("gender-row").dataset.playerId;
    try {
      await postJson(
        API_BASE,
        `/players/${playerId}/gender`,
        { gender: btn.dataset.setGender },
        "PUT"
      );
      loadSeason(currentSeasonId);
    } catch (err) {
      alert("設定性別失敗：" + err.message);
    }
  });

  async function assignSubstitute(absenceId, name, gender) {
    try {
      await postJson(API_BASE, `/absences/${absenceId}/substitute`, {
        player_name: name,
        gender,
      });
      loadSeason(currentSeasonId);
    } catch (e) {
      alert("設定代打失敗：" + e.message);
    }
  }

  async function cancelAbsence(absenceId, btn) {
    try {
      await withButtonFeedback(btn, "處理中...", async () => {
        await postJson(API_BASE, `/absences/${absenceId}/cancel`, {});
      });
      loadSeason(currentSeasonId);
    } catch (e) {
      alert("取消請假失敗：" + e.message);
    }
  }

  function buildMyActionHtml(season, game) {
    const playerName = document.getElementById("player-name").value.trim();
    if (game.locked) {
      return '<div class="gdetail-mystatus">已過更動期限，這一場無法再變更</div>';
    }
    const isMember = season.members.some((m) => m.name === playerName);
    const myAbsence = game.absences.find((a) => a.player_name === playerName);
    const myDropIn = game.confirmed_drop_ins.find((d) => d.player_name === playerName);
    const myWaitlist = game.waitlist_entries.find((d) => d.player_name === playerName);

    if (isMember) {
      if (myAbsence) {
        if (myAbsence.covered_by) {
          return `<div class="gdetail-mystatus absent">你已請假這一場，已由 ${myAbsence.covered_by} 遞補</div>`;
        }
        return (
          '<div class="gdetail-mystatus absent">你已請假這一場</div>' +
          `<button class="action cancel" onclick="cancelAbsence(${myAbsence.id}, this)">取消請假</button>`
        );
      }
      return `<button class="action" onclick="recordAbsence(${game.id}, this)">請假</button>`;
    }
    if (myDropIn) {
      return (
        '<div class="gdetail-mystatus confirmed">你已確認報名這一場</div>' +
        `<button class="action cancel" onclick="cancelDropIn(${myDropIn.id}, this)">取消</button>`
      );
    }
    if (myWaitlist) {
      return (
        '<div class="gdetail-mystatus waitlisted">你目前候補中</div>' +
        `<button class="action cancel" onclick="cancelDropIn(${myWaitlist.id}, this)">取消候補</button>`
      );
    }
    if (playerName) {
      return `<button class="action" onclick="signUp(${game.id}, this)">+1 報名</button>`;
    }
    return "";
  }

  function renderGlance(season) {
    const box = document.getElementById("glance");
    const upcoming = season.games.find((g) => !describeDate(g.date).isPast) || season.games[season.games.length - 1];
    if (!upcoming) { box.style.display = "none"; return; }
    const info = describeDate(upcoming.date);
    document.getElementById("glance-main").textContent = `${info.label}${info.relative ? "・" + info.relative : ""}`;
    const total = upcoming.confirmed_drop_ins.length;
    document.getElementById("glance-sub").textContent =
      `臨打確認 ${total} 人${upcoming.waitlist_entries.length ? `・候補 ${upcoming.waitlist_entries.length} 人` : ""}`;
    box.style.display = "block";
  }

  async function renderBalance(season) {
    const playerName = document.getElementById("player-name").value.trim();
    const card = document.getElementById("balance-card");
    const member = season.members.find((m) => m.name === playerName);
    // Balance is only resolvable for fixed members right now — a
    // drop-in's player id isn't exposed by the season detail endpoint,
    // only their name inside each game's roster.
    if (!member) {
      card.classList.remove("show");
      return;
    }
    const ledger = await fetch(`${API_BASE}/players/${member.id}/ledger`).then((r) => r.json());
    const value = document.getElementById("balance-value");
    const n = Number(ledger.balance);
    value.textContent = n === 0 ? "$0（結清）" : n > 0 ? `你可以領回 $${ledger.balance}` : `你還欠 $${Math.abs(n)}`;
    value.className = "balance-value " + (n === 0 ? "even" : n > 0 ? "owed" : "owe");
    card.classList.add("show");
  }

  async function recordAbsence(gameId, btn) {
    const playerName = document.getElementById("player-name").value.trim();
    try {
      await withButtonFeedback(btn, "處理中...", async () => {
        await postJson(API_BASE, "/absences", { player_name: playerName, game_id: gameId });
      });
      loadSeason(currentSeasonId);
    } catch (e) {
      alert("請假失敗：" + e.message);
    }
  }

  async function signUp(gameId, btn) {
    const playerName = document.getElementById("player-name").value.trim();
    try {
      let status;
      await withButtonFeedback(btn, "處理中...", async () => {
        const data = await postJson(API_BASE, "/drop-ins", { player_name: playerName, game_id: gameId });
        status = data.status;
      });
      alert(status === "confirmed" ? "報名成功！" : "已加入候補名單");
      loadSeason(currentSeasonId);
    } catch (e) {
      alert("報名失敗：" + e.message);
    }
  }

  async function cancelDropIn(dropInId, btn) {
    try {
      await withButtonFeedback(btn, "處理中...", async () => {
        await postJson(API_BASE, `/drop-ins/${dropInId}/cancel`, {});
      });
      loadSeason(currentSeasonId);
    } catch (e) {
      alert("取消失敗：" + e.message);
    }
  }
</script>
</body>
</html>
