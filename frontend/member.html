<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolleyFlow</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  body { font-family: var(--font-cjk); }
  .hero-date, .count-big, .balance-value, .m-net { font-family: var(--font-num); }
  .name-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .name-row input {
    flex: 1; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 9px;
    font-size: .95rem; background: var(--surface); color: var(--ink); font-family: var(--font-cjk);
  }
  .name-row[hidden] { display: none; }
  .join-prompt { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .join-prompt[hidden] { display: none; }
  .club-sheet-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .club-row-manage { border: none; background: none; color: var(--accent); font-size: .74rem; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-bar">
    <span class="app-bar-left">
      <button type="button" id="club-chip" class="club-chip">
        <i class="club-dot" id="club-dot">-</i><span id="club-chip-name">選擇球隊</span><span class="caret">▾</span>
      </button>
    </span>
    <button type="button" class="brand" onclick="location.href='member.html'">VolleyFlow</button>
    <span class="app-bar-right">
      <button type="button" class="avatar" id="avatar-btn" title="個人資料">?</button>
    </span>
  </div>

  <nav class="context-switch" id="context-switch" hidden>
    <a href="member.html" class="on">會員</a>
    <a href="organizer.html">管理</a>
  </nav>
  <div id="identity" class="identity"></div>

  <div id="name-row" class="name-row">
    <input id="player-name" type="text" placeholder="你的名字（測試用，非 LINE 環境）">
  </div>

  <select id="season-picker" class="season-picker" style="margin-bottom: 14px" hidden></select>
  <div id="error"></div>

  <div id="join-prompt" class="balance join-prompt" hidden>
    <span id="join-prompt-text" class="balance-label"></span>
    <button type="button" class="action" onclick="joinFromPrompt()">加入</button>
  </div>

  <div id="intent-ask" hidden></div>

  <div id="hero-wrap"></div>

  <div class="section-label" id="balance-label" hidden>帳務</div>
  <div id="balance-card" class="balance" hidden>
    <span class="balance-label">本季餘額</span>
    <span id="balance-value" class="balance-value"></span>
  </div>

  <div class="section-label" id="cal-label" hidden>本季場次</div>
  <div id="month-cal" class="mcal" hidden></div>
</div>

<div id="club-sheet-backdrop" class="gsheet-backdrop" hidden>
  <div class="gsheet">
    <button class="gsheet-close" aria-label="關閉" data-close-sheet="club">✕</button>
    <h3>球隊</h3>
    <div id="club-rows"></div>
    <div class="club-sheet-actions">
      <button type="button" class="btn btn-quiet" onclick="promptJoinClub()">用連結加入球隊</button>
      <button type="button" class="btn btn-primary" onclick="createClub()">建立球隊</button>
    </div>
  </div>
</div>

<div id="game-sheet-backdrop" class="gsheet-backdrop" hidden>
  <div class="gsheet">
    <button class="gsheet-close" aria-label="關閉" data-close-sheet="game">✕</button>
    <div id="game-detail"></div>
  </div>
</div>

<script src="shared.js"></script>
<script>
  const API_BASE = "https://volleyflow.onrender.com";
  const LIFF_ID = "2011156233-6CouG6VI";
  let currentSeasonId = null;
  let currentSeason = null;
  let selectedGameId = null;
  let myPlayerId = null;
  let allClubs = [];
  let myClubs = [];
  let clubMembers = [];

  // A club's "用連結加入球隊" link carries ?club=<id> — LIFF forwards
  // query params from the liff.line.me URL through to this page, so
  // opening a shared link picks the right club without the visitor
  // having to find it in a list themselves. Applied synchronously,
  // before initClubAndSeasonPickers reads localStorage below — LIFF
  // identity resolution is slow enough (a round trip to LINE) that
  // doing this inside initIdentity instead would race the pickers and
  // sometimes lose. Stripped from the URL right away so a later reload
  // or club switch (which also reloads) doesn't keep snapping back here.
  // Said before any request goes out, so the very first paint is "載入中"
  // rather than a bare page that looks like it failed.
  showPageLoading(document.getElementById("hero-wrap"));

  const requestedClubId = new URLSearchParams(location.search).get("club");
  if (requestedClubId) {
    localStorage.setItem(CLUB_STORAGE_KEY, requestedClubId);
    history.replaceState(null, "", location.pathname);
  }

  const identityReady = (async function initIdentity() {
    const identityEl = document.getElementById("identity");
    const identified = await initLiffIdentity(API_BASE, LIFF_ID);
    if (!identified) {
      // Nothing on this page is readable without a verified identity any
      // more — the roster and the games belong to a club, and a club is
      // only visible to its members.
      identityEl.textContent = "";
      document.getElementById("name-row").hidden = true;
      return null;
    }
    myPlayerId = identified.id;
    document.getElementById("name-row").hidden = true;
    document.getElementById("player-name").value = identified.name;
    document.getElementById("avatar-btn").textContent = identified.name.slice(0, 1);
    identityEl.textContent = "";
    await refreshMyClubs();
    renderClubChip();
    renderManageButton();
    renderJoinPrompt();
    renderIntentAsk();
    return identified;
  })();

  document.getElementById("player-name").addEventListener("change", () => {
    if (currentSeasonId) loadSeason(currentSeasonId);
    else renderNoSeason(); // now that allClubs/myClubs are known, name the club
  });

  identityReady.then((identified) => {
    if (!identified) {
      stopLoadingEscalation();
      document.getElementById("hero-wrap").innerHTML = emptyStateHtml(
        "請用 LINE 開啟",
        "球隊的名單和場次只有成員看得到，所以需要先用 LINE 登入。請從 LINE 裡的連結開啟這一頁。"
      );
      return;
    }
    startPickers();
  });

  function startPickers() {
  initClubAndSeasonPickers(
    API_BASE,
    (function () {
      // initClubAndSeasonPickers wants real <select> elements — a hidden
      // one here still drives its remembered-choice/localStorage logic,
      // while the visible UI is the club-chip button and its sheet below.
      const el = document.createElement("select");
      el.hidden = true;
      document.body.appendChild(el);
      return el;
    })(),
    document.getElementById("season-picker"),
    "vf_season",
    (id) => {
      stopLoadingEscalation();
      renderClubChip();
      renderManageButton();
      renderJoinPrompt();
      if (id) loadSeason(id);
      else renderNoSeason();
    },
    (e) => showPageError(document.getElementById("hero-wrap"), e.message)
  );
  }

  /** No season to show — either this player is in no club at all, or the
   * club they're looking at hasn't started one. Both are normal states on
   * a fresh install, and both need to say what happens next rather than
   * leaving empty cards on screen. */
  function renderNoSeason() {
    currentSeason = null;
    document.getElementById("cal-label").hidden = true;
    document.getElementById("month-cal").hidden = true;
    document.getElementById("month-cal").innerHTML = "";
    document.getElementById("balance-label").hidden = true;
    document.getElementById("balance-card").hidden = true;
    document.getElementById("season-picker").hidden = true;

    const clubId = currentClubId();
    const club = allClubs.find((c) => String(c.id) === String(clubId));
    const mine = myClubs.find((c) => String(c.id) === String(clubId));

    let html;
    if (!club) {
      html = emptyStateHtml(
        "還沒有球隊",
        "點左上角的球隊按鈕，可以建立一個新的球隊，或用主揪給你的連結加入。"
      );
    } else if (mine && mine.role === "organizer") {
      html = emptyStateHtml(
        `「${club.name}」還沒有開季`,
        "先建立第一季：輸入場地費、場次日期和固定成員，系統會自動算出每個人的季費。",
        { label: "建立第一季", href: "organizer-settings.html" }
      );
    } else {
      html = emptyStateHtml(
        `「${club.name}」還沒有開季`,
        "主揪開季之後，這裡就會出現本季的場次、你的請假狀態和帳務。"
      );
    }
    document.getElementById("hero-wrap").innerHTML = html;
    document.getElementById("hero-wrap").onclick = null;
  }

  /** GET /clubs is scoped to the caller now, so "every club" and "my
   * clubs" are the same list — it just also carries my role in each.
   * The one club that can be relevant without being mine is the target
   * of an invite link, fetched by id below purely so the join prompt has
   * a name to show. */
  async function refreshMyClubs() {
    if (!myPlayerId) {
      myClubs = [];
      allClubs = [];
      return;
    }
    const mine = await fetch(`${API_BASE}/players/${myPlayerId}/clubs`, {
      headers: authHeader(),
    });
    myClubs = mine.ok ? await mine.json() : [];
    allClubs = myClubs.slice();

    const pending = currentClubId();
    if (pending && !myClubs.some((c) => String(c.id) === String(pending))) {
      const res = await fetch(`${API_BASE}/clubs/${pending}`, { headers: authHeader() });
      if (res.ok) allClubs.push(await res.json());
    }
  }

  /** The way into 球隊管理. It lives in the top bar rather than in the
   * club sheet because an organizer needs it constantly and shouldn't
   * have to remember it's two taps deep — and it's simply absent for
   * everyone else, which is also how they learn the app has nothing
   * hidden from them. */
  function renderManageButton() {
    const clubId = currentClubId();
    const mine = myClubs.find((c) => String(c.id) === String(clubId));
    document.getElementById("context-switch").hidden = !(mine && mine.role === "organizer");
  }

  function renderClubChip() {
    const clubId = currentClubId();
    const club = allClubs.find((c) => String(c.id) === String(clubId));
    document.getElementById("club-chip-name").textContent = club ? club.name : "選擇球隊";
    document.getElementById("club-dot").textContent = club ? club.name.slice(0, 1) : "-";
  }

  function renderJoinPrompt() {
    const prompt = document.getElementById("join-prompt");
    const clubId = currentClubId();
    const club = allClubs.find((c) => String(c.id) === String(clubId));
    const alreadyIn = myClubs.some((c) => String(c.id) === String(clubId));
    if (!myPlayerId || !club || alreadyIn) {
      prompt.hidden = true;
      return;
    }
    document.getElementById("join-prompt-text").textContent = `尚未加入「${club.name}」`;
    prompt.hidden = false;
  }

  /** Asked once, right after joining. A fixed member's season fee is a
   * real obligation, so saying you are one queues you for the organizer
   * rather than signing you up; saying you aren't opens drop-in signups
   * straight away. Until they answer, they get neither — an unanswered
   * question is not a reason to let someone commit to money. */
  function renderIntentAsk() {
    const el = document.getElementById("intent-ask");
    const mine = myClubs.find((c) => String(c.id) === String(currentClubId()));
    const onRoster =
      currentSeason &&
      currentSeason.members.some((m) => m.name === playerName());

    if (!mine || onRoster || mine.wants_fixed_membership !== null) {
      el.hidden = true;
      return;
    }
    el.hidden = false;
    el.innerHTML = `
      <div class="empty-state" style="text-align:left">
        <h3>已加入「${escapeHtml(mine.name)}」</h3>
        <p>請問你是這一季的固定成員嗎？主揪確認後才會加入名單。</p>
        <div class="btn-row" style="margin-top:12px">
          <button type="button" class="btn btn-primary" onclick="answerIntent(true)">我是固定成員</button>
          <button type="button" class="btn btn-quiet" onclick="answerIntent(false)">我只是臨打</button>
        </div>
      </div>
    `;
  }

  async function answerIntent(wantsFixed) {
    try {
      const updated = await postJson(
        API_BASE,
        `/clubs/${currentClubId()}/members/me/intent`,
        { wants_fixed_membership: wantsFixed },
        "PUT"
      );
      const mine = myClubs.find((c) => String(c.id) === String(currentClubId()));
      if (mine) mine.wants_fixed_membership = updated.wants_fixed_membership;
      renderIntentAsk();
      if (currentSeasonId) loadSeason(currentSeasonId);
      else renderNoSeason();
    } catch (e) {
      alert("送出失敗：" + e.message);
    }
  }

  /** Whether this viewer may act on a game at all. Someone waiting to be
   * approved as a fixed member can look but not touch: signing up as a
   * drop-in would contradict what they just said they are, and taking
   * leave from a roster they're not on means nothing. */
  function viewingOnly() {
    const mine = myClubs.find((c) => String(c.id) === String(currentClubId()));
    if (!mine) return false;
    const onRoster =
      currentSeason && currentSeason.members.some((m) => m.name === playerName());
    return mine.wants_fixed_membership === true && !onRoster;
  }

  async function joinFromPrompt() {
    try {
      await postJson(API_BASE, `/clubs/${currentClubId()}/join`, {});
      await refreshMyClubs();
      renderJoinPrompt();
      renderManageButton();
      renderIntentAsk();
      renderIntentAsk();
    } catch (e) {
      alert("加入失敗：" + e.message);
    }
  }

  function openClubSheet() {
    renderClubRows();
    document.getElementById("club-sheet-backdrop").hidden = false;
  }
  function closeClubSheet() {
    document.getElementById("club-sheet-backdrop").hidden = true;
  }
  document.getElementById("club-chip").addEventListener("click", openClubSheet);

  function renderClubRows() {
    const clubId = currentClubId();
    const rows = allClubs.map((c) => {
      const mine = myClubs.find((m) => String(m.id) === String(c.id));
      const roleTag = mine && mine.role === "organizer" ? '<span class="role-tag">主揪</span>' : "";
      const manageLink = mine && mine.role === "organizer"
        ? `<button type="button" class="club-row-manage" data-manage="${c.id}">管理 →</button>`
        : "";
      return `
        <button type="button" class="club-row${String(c.id) === String(clubId) ? " on" : ""}" data-pick-club="${c.id}">
          <i class="club-dot">${escapeHtml(c.name.slice(0, 1))}</i>
          <span class="cr-name">${escapeHtml(c.name)}${mine ? "" : '<span class="cr-sub">邀請連結・尚未加入</span>'}</span>
          ${roleTag}${manageLink}
        </button>
      `;
    });
    document.getElementById("club-rows").innerHTML =
      rows.join("") || '<div class="empty">還沒有任何球隊</div>';
  }

  document.getElementById("club-rows").addEventListener("click", (e) => {
    const manage = e.target.closest("[data-manage]");
    if (manage) {
      localStorage.setItem(CLUB_STORAGE_KEY, manage.dataset.manage);
      location.href = "organizer.html";
      return;
    }
    const row = e.target.closest("[data-pick-club]");
    if (row) {
      localStorage.setItem(CLUB_STORAGE_KEY, row.dataset.pickClub);
      closeClubSheet();
      location.reload();
    }
  });

  function promptJoinClub() {
    alert(
      "請向主揪索取「用連結加入球隊」的網址，用 LINE 打開即可自動加入該球隊。"
    );
  }

  async function createClub() {
    const name = prompt("球隊名稱？");
    if (!name || !name.trim()) return;
    try {
      const club = await postJson(API_BASE, "/clubs", { name: name.trim() });
      localStorage.setItem(CLUB_STORAGE_KEY, String(club.id));
      location.reload();
    } catch (e) {
      alert("建立失敗：" + e.message);
    }
  }

  document.getElementById("avatar-btn").addEventListener("click", () => {
    location.href = "profile.html";
  });

  [
    ["club-sheet-backdrop", closeClubSheet],
    ["game-sheet-backdrop", closeGameSheet],
  ].forEach(([id, close]) => {
    const backdrop = document.getElementById(id);
    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) close();
    });
  });
  document.querySelectorAll("[data-close-sheet]").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (btn.dataset.closeSheet === "club") closeClubSheet();
      else closeGameSheet();
    });
  });

  async function loadSeason(seasonId) {
    currentSeasonId = seasonId;
    const errorEl = document.getElementById("error");
    errorEl.textContent = "";
    try {
      // Paints from the last-seen copy first, then corrects itself — see
      // getJsonSWR. render() runs once or twice; it rebuilds everything
      // it touches, so running twice is just a redraw.
      await getJsonSWR(`${API_BASE}/seasons/${seasonId}`, (season) => render(season), {
        headers: authHeader(),
      });
    } catch (e) {
      errorEl.textContent = "連不上伺服器：" + e.message;
    }

    function render(season) {
      const isNewSeason = !currentSeason || currentSeason.id !== season.id;
      currentSeason = season;
      if (isNewSeason || !season.games.some((g) => g.id === selectedGameId)) {
        const upcoming = season.games.find((g) => !describeDate(g.date).isPast) || season.games[season.games.length - 1];
        selectedGameId = upcoming ? upcoming.id : null;
      }
      document.getElementById("season-picker").hidden = false;
      document.getElementById("cal-label").hidden = false;
      document.getElementById("month-cal").hidden = false;
      renderIntentAsk();
      renderHero(season);
      renderMonthCalendar(document.getElementById("month-cal"), season.games, selectGame);
      renderSelectedGameDetail();
      // These two are independent of the season document and each other,
      // so they run in parallel rather than blocking the paint above.
      fetchClubMembers(API_BASE, currentClubId()).then((m) => {
        clubMembers = m;
        renderSelectedGameDetail();
      });
      renderBalance(season);
    }
  }

  function playerName() {
    return document.getElementById("player-name").value.trim();
  }

  function selectGame(gameId) {
    selectedGameId = gameId;
    renderSelectedGameDetail();
    openGameSheet();
  }

  function renderHero(season) {
    const wrap = document.getElementById("hero-wrap");
    const upcoming = season.games.find((g) => !describeDate(g.date).isPast) || season.games[season.games.length - 1];
    if (!upcoming) {
      wrap.innerHTML = '<div class="empty">這一季還沒有場次</div>';
      return;
    }
    const deadlinePill = season.change_deadline_days !== null
      ? `<span class="meta-pill">請假期限 <strong>賽前 ${season.change_deadline_days} 天</strong></span>`
      : "";
    wrap.innerHTML =
      renderGameHero(season, upcoming, { metaPills: [deadlinePill] }) +
      buildMyActionHtml(season, upcoming);
    wrap.dataset.heroGameId = upcoming.id;
    wrap.onclick = (e) => {
      if (e.target.closest("button")) return;
      selectGame(upcoming.id);
    };
  }

  function renderSelectedGameDetail() {
    const el = document.getElementById("game-detail");
    const game = currentSeason && currentSeason.games.find((g) => g.id === selectedGameId);
    if (!currentSeason || !game) {
      el.innerHTML = '<div class="empty">這一季還沒有場次</div>';
      return;
    }
    const deadlinePill = currentSeason.change_deadline_days !== null
      ? `<span class="meta-pill">請假期限 <strong>賽前 ${currentSeason.change_deadline_days} 天</strong></span>`
      : "";
    renderGameDetail(el, currentSeason, game, {
      heroMetaPills: [deadlinePill],
      clubMembers,
      viewerName: playerName(),
      extraHtml: buildMyActionHtml(currentSeason, game),
      onAssignSubstitute: (absenceId, name, gender) => assignSubstitute(absenceId, name, gender),
      onCancelSubstitute: (dropInId, btn) => cancelDropIn(dropInId, btn),
      canAssignSubstitute: (absence) => absence.player_name === playerName(),
    });
  }

  function openGameSheet() { document.getElementById("game-sheet-backdrop").hidden = false; }
  function closeGameSheet() { document.getElementById("game-sheet-backdrop").hidden = true; }

  async function assignSubstitute(absenceId, name, gender) {
    try {
      await postJson(API_BASE, `/absences/${absenceId}/substitute`, { player_name: name, gender }, "PUT");
      loadSeason(currentSeasonId);
    } catch (e) {
      alert("指定代打失敗：" + e.message);
    }
  }

  async function cancelAbsence(absenceId, btn) {
    if (absenceId < 0) return;  // still saving; the real id isn't known yet
    await optimistically(
      (season) => {
        for (const game of season.games) {
          game.absences = game.absences.filter((a) => a.id !== absenceId);
        }
      },
      () => postJson(API_BASE, `/absences/${absenceId}/cancel`, {}),
      "取消請假失敗："
    );
  }

  function buildMyActionHtml(season, game) {
    const name = playerName();
    if (viewingOnly()) {
      return '<div class="gdetail-mystatus waitlisted">等待主揪把你加入本季名單，在那之前只能查看</div>';
    }
    if (game.locked) {
      return '<div class="gdetail-mystatus absent">已過更動期限，這一場無法再變更</div>';
    }
    const isMember = season.members.some((m) => m.name === name);
    const myAbsence = game.absences.find((a) => a.player_name === name);
    const myDropIn = game.confirmed_drop_ins.find((d) => d.player_name === name);
    const myWaitlistIndex = game.waitlist_entries.findIndex((d) => d.player_name === name);

    if (isMember) {
      if (myAbsence) {
        if (myAbsence.covered_by) {
          return `<div class="gdetail-mystatus absent">已請假，由 ${escapeHtml(myAbsence.covered_by)} 代打</div>`;
        }
        return (
          '<div class="gdetail-mystatus absent">已請假這一場</div>' +
          `<button class="action cancel" onclick="cancelAbsence(${myAbsence.id}, this)">取消請假</button>`
        );
      }
      return `<button class="btn btn-danger" onclick="recordAbsence(${game.id}, this)">請假</button>`;
    }
    if (myDropIn) {
      return (
        '<div class="gdetail-mystatus confirmed">已報名這一場</div>' +
        `<button class="action cancel" onclick="cancelDropIn(${myDropIn.id}, this)">取消報名</button>`
      );
    }
    if (myWaitlistIndex >= 0) {
      return (
        `<div class="gdetail-mystatus waitlisted">候補中・第 ${myWaitlistIndex + 1} 順位</div>` +
        `<button class="action cancel" onclick="cancelDropIn(${game.waitlist_entries[myWaitlistIndex].id}, this)">取消候補</button>`
      );
    }
    if (name) {
      return `<button class="btn btn-primary" onclick="signUp(${game.id}, this)">＋1 報名</button>`;
    }
    return "";
  }

  async function renderBalance(season) {
    const name = playerName();
    const labelEl = document.getElementById("balance-label");
    const card = document.getElementById("balance-card");
    const member = season.members.find((m) => m.name === name);
    if (!member) {
      labelEl.hidden = true;
      card.hidden = true;
      return;
    }
    const ledger = await fetch(
      `${API_BASE}/clubs/${currentClubId()}/players/${member.id}/ledger`,
      { headers: authHeader() }
    ).then((r) => r.json());
    const value = document.getElementById("balance-value");
    const n = Number(ledger.balance);
    value.textContent = n === 0 ? "已結清" : n > 0 ? `餘額 +$${ledger.balance}` : `應繳 $${Math.abs(n)}`;
    value.className = "balance-value " + (n === 0 ? "even" : n > 0 ? "owed" : "owe");
    labelEl.hidden = false;
    card.hidden = false;
  }

  /**
   * Applies the change to what's on screen straight away, then sends it.
   * A round trip to a sleepy free-tier backend is long enough that a tap
   * with no visible result reads as "nothing happened" and gets tapped
   * again. The server is still the authority: on failure we put the
   * screen back and say why, and every success re-reads it anyway.
   */
  async function optimistically(mutateLocally, request, failureMessage) {
    const snapshot = JSON.parse(JSON.stringify(currentSeason));
    mutateLocally(currentSeason);
    renderHero(currentSeason);
    renderSelectedGameDetail();
    try {
      await request();
      loadSeason(currentSeasonId);
    } catch (e) {
      currentSeason = snapshot;
      renderHero(currentSeason);
      renderSelectedGameDetail();
      alert(failureMessage + e.message);
    }
  }

  async function recordAbsence(gameId, btn) {
    const name = playerName();
    await optimistically(
      (season) => {
        const game = season.games.find((g) => g.id === gameId);
        // A placeholder id: the row it draws is replaced by the real one
        // as soon as loadSeason comes back, and any control keyed off it
        // is disabled in the meantime.
        game.absences.push({ id: -1, player_name: name, covered_by: null });
      },
      () => postJson(API_BASE, "/absences", { player_name: name, game_id: gameId }),
      "請假失敗："
    );
  }

  async function signUp(gameId, btn) {
    const name = playerName();
    await optimistically(
      (season) => {
        const game = season.games.find((g) => g.id === gameId);
        game.confirmed_drop_ins.push({
          id: -1,
          player_id: myPlayerId,
          player_name: name,
          gender: null,
          covering: null,
        });
      },
      () => postJson(API_BASE, "/drop-ins", { player_name: name, game_id: gameId }),
      "報名失敗："
    );
  }

  async function cancelDropIn(dropInId, btn) {
    if (dropInId < 0) return;  // still saving; the real id isn't known yet
    await optimistically(
      (season) => {
        for (const game of season.games) {
          game.confirmed_drop_ins = game.confirmed_drop_ins.filter((d) => d.id !== dropInId);
          game.waitlist_entries = game.waitlist_entries.filter((w) => w.id !== dropInId);
        }
      },
      () => postJson(API_BASE, `/drop-ins/${dropInId}/cancel`, {}),
      "取消失敗："
    );
  }
</script>
