<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolleyFlow</title>
<link rel="preconnect" href="https://volleyflow.onrender.com" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap">
<link rel="stylesheet" href="css/shared.css">
<style>
  body { font-family: var(--font-cjk); }
  .hero-date, .count-big, .bc-value, .m-net { font-family: var(--font-num); }
  .name-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .name-row input {
    flex: 1; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 9px;
    font-size: .95rem; background: var(--surface); color: var(--ink); font-family: var(--font-cjk);
  }
  .name-row[hidden] { display: none; }
  .club-sheet-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .club-row-manage { border: none; background: none; color: var(--accent); font-size: .74rem; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-bar">
    <span class="app-bar-left">
      <button type="button" id="club-chip" class="club-chip">
        <i class="club-dot" id="club-dot">-</i><span id="club-chip-name" class="club-chip-name">選擇球隊</span><span class="caret">▾</span>
      </button>
    </span>
    <button type="button" class="brand" onclick="location.href='member.html'">VolleyFlow</button>
    <span class="app-bar-right">
      <button type="button" class="avatar" id="avatar-btn" title="個人資料">?</button>
    </span>
  </div>

  <nav class="context-switch" id="context-switch" hidden>
    <a href="member.html" class="on">會員</a>
    <a href="organizer.html" id="manage-link">管理<span class="nav-badge" id="manage-badge" hidden></span></a>
  </nav>
  <div id="identity" class="identity"></div>

  <div id="name-row" class="name-row" hidden>
    <input id="player-name" type="text" placeholder="你的名字（測試用，非 LINE 環境）">
  </div>

  <div class="season-row">
    <select id="season-picker" class="season-picker" hidden></select>
    <button type="button" id="balance-chip" class="balance-chip" onclick="openLedger()" hidden></button>
  </div>
  <div id="error"></div>


  <div id="hero-wrap" data-season-content></div>

  <div class="section-label" id="cal-label" hidden>本季場次</div>
  <div id="month-cal" class="mcal" hidden data-season-content></div>

</div>

<div id="club-sheet-backdrop" class="gsheet-backdrop" hidden>
  <div class="gsheet">
    <button class="gsheet-close" aria-label="關閉" data-close-sheet="club">✕</button>
    <h3>球隊</h3>
    <div id="club-rows"></div>
    <div class="club-sheet-actions">
      <button type="button" class="btn btn-quiet" onclick="promptJoinClub()">連結加入</button>
      <button type="button" class="btn btn-primary" onclick="createClub()">建立球隊</button>
    </div>
  </div>
</div>

<div id="game-sheet-backdrop" class="gsheet-backdrop" hidden>
  <div class="gsheet">
    <button class="gsheet-close" aria-label="關閉" data-close-sheet="game">✕</button>
    <div id="game-detail"></div>
  </div>
</div>

<div id="ledger-backdrop" class="gsheet-backdrop" hidden>
  <div class="gsheet">
    <button class="gsheet-close" aria-label="關閉" data-close-sheet="ledger">✕</button>
    <h3 style="margin:0">我的帳務</h3>
    <p class="su-when" id="lg-sub"></p>
    <div id="lg-total" class="lg-total"></div>
    <div id="lg-entries"></div>
    <!-- Below the breakdown and outside it, on purpose: this figure is
         not on the ledger, and summaryRows reconciles its rows against
         the ledger balance. Put through there it would invent an 其他
         row worth exactly the estimate. -->
    <div id="lg-estimate" class="lg-estimate" hidden></div>
  </div>
</div>

<div id="signup-backdrop" class="gsheet-backdrop" hidden>
  <div class="gsheet">
    <button class="gsheet-close" aria-label="關閉" data-close-sheet="signup">✕</button>
    <h3 style="margin:0">報名</h3>
    <div id="su-picker"></div>
    <p id="su-when" class="su-when"></p>

    <div class="su-cap">
      <div class="su-cap-line">
        <span><strong id="su-now"></strong> / <span id="su-cap"></span> 人</span>
        <span id="su-note" class="su-cap-note"></span>
      </div>
      <div class="su-bar"><i class="now" id="su-bar-now"></i><i class="adding" id="su-bar-add"></i><i class="over" id="su-bar-over"></i></div>
    </div>

    <div class="su-q">報名名單</div>
    <div class="su-who" id="su-who"></div>
    <button type="button" class="su-add" id="su-add">＋ 新增報名對象</button>

    <div class="su-total">
      <span class="su-total-text">
        <span id="su-total-label">合計</span>
        <span class="su-breakdown" id="su-breakdown"></span>
      </span>
      <span class="su-amt" id="su-amt"></span>
    </div>

    <button type="button" class="btn btn-primary" style="width:100%" id="su-go">確認報名</button>
  </div>
</div>

<script src="js/common/format.js"></script>
<script src="js/common/api.js"></script>
<script src="js/common/errors.js"></script>
<script src="js/common/feedback.js"></script>
<script src="js/common/clubs.js"></script>
<script src="js/common/season.js"></script>
<script src="js/common/game-sheet.js"></script>
<script src="js/pages/member.js"></script>
</body>
</html>
