<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolleyFlow 球隊管理 · 帳務</title>
<link rel="preconnect" href="https://volleyflow.onrender.com" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap">
<link rel="stylesheet" href="css/shared.css">
<style>
  .tab[hidden] { display: none; }
  .m-act input, .m-act .confirm-partial { display: none; }
  .m-act.partial input, .m-act.partial .confirm-partial { display: block; }
  .m-act.partial .paid, .m-act.partial .later { display: none; }
  .settle-hint { font-size: .78rem; color: var(--ink-soft); margin: 10px 0 0; text-align: center; }
  .fee-notice { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
  .fee-notice-text { font-size: .82rem; color: var(--ink-soft); line-height: 1.5; }
  .fee-notice-text b { color: var(--ink); }
  .fee-notice .btn { width: auto; margin-top: 0; padding: 9px 14px; white-space: nowrap; }
  .notice-list { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; font-size: .84rem; margin-bottom: 12px; }
  .notice-list div { display: flex; justify-content: space-between; gap: 10px; padding: 7px 12px; border-top: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
  .notice-list div:first-child { border-top: none; }
  .notice-bubble { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px 14px 14px 4px; padding: 10px 12px; font-size: .84rem; line-height: 1.65; white-space: pre-line; }
</style>
</head>
<body>
<div class="wrap wide">
  <div class="app-bar">
    <span class="app-bar-left">
      <button type="button" id="club-chip" class="club-chip">
        <i class="club-dot" id="club-dot">-</i><span id="club-chip-name" class="club-chip-name">選擇球隊</span><span class="caret">▾</span>
      </button>
      <select id="club-picker" class="club-picker" hidden aria-hidden="true" tabindex="-1"></select>
    </span>
    <button type="button" class="brand" onclick="location.href='member.html'">VolleyFlow</button>
    <span class="app-bar-right">
      <button type="button" class="avatar" id="avatar-btn" title="個人資料">?</button>
    </span>
  </div>

  <nav class="context-switch">
    <a href="member.html">會員</a>
    <a href="organizer.html" class="on">管理</a>
  </nav>

  <nav class="org-nav">
    <a href="organizer.html" class="org-nav-link">總覽</a>
    <a href="organizer-members.html" class="org-nav-link">名單</a>
    <a href="organizer-ledger.html" class="org-nav-link active">帳務</a>
    <a href="organizer-settings.html" class="org-nav-link">設定</a>
  </nav>

  <div class="picker-row picker-row-labeled">
    <div id="season-picker-field" class="picker-field" hidden>
      <label for="season-picker">季別</label>
      <span class="picker-control">
        <select id="season-picker" class="season-picker" hidden></select>
        <i class="spinner sm picker-spinner" aria-hidden="true"></i>
      </span>
    </div>
  </div>
  <div id="error"></div>

  <div id="no-season"></div>

  <div class="seg" id="ledger-tabs" hidden>
    <span class="on" data-tab="fee">季費</span>
    <span data-tab="dropin">當天臨打</span>
    <span data-tab="closing">季末結算</span>
  </div>

  <div id="tab-fee" class="tab" hidden>
    <div class="balance">
      <span class="balance-label">季費已收</span>
      <span id="fee-collected" class="balance-value"></span>
    </div>
    <div class="progress"><i id="fee-progress" style="width:0%"></i></div>
    <p id="fee-hint" class="hint"></p>
    <div id="fee-notice" class="fee-notice" hidden>
      <span id="fee-notice-text" class="fee-notice-text"></span>
      <button type="button" class="btn btn-primary" id="fee-notice-btn" onclick="openFeeNotice()">繳費通知</button>
    </div>
    <div class="section-label" id="fee-share-label"></div>
    <div id="fee-list" class="money" data-season-content></div>
  </div>

  <div id="tab-dropin" class="tab" hidden>
    <select id="dropin-game-picker" class="season-picker" style="margin-bottom: 12px"></select>
    <div id="dropin-list" class="money" data-season-content></div>
  </div>

  <div id="tab-closing" class="tab" hidden>
    <div id="closing-before">
      <p id="closing-blocked" class="empty" hidden></p>
      <div id="closing-ready">
        <p class="hint">結算後本季名單與場地費鎖定，剩下的場次不能請假或報名臨打。未選擇者，餘額保留至下一季。</p>
        <div class="balance" style="margin-bottom:14px">
          <span class="balance-label">現金結餘</span>
          <span id="closing-cash" class="balance-value even">—</span>
        </div>
        <div class="section-label">本季結算</div>
        <div id="closing-preview" class="money"></div>
        <p id="closing-pending" class="hint"></p>
        <button type="button" class="btn btn-primary" id="settle-btn" onclick="settleSeason()">結算本季</button>
      </div>
    </div>
    <div id="closing-after" hidden>
      <div class="balance" style="margin-bottom: 14px">
        <span class="balance-label">已結算</span>
        <span id="closing-settled-at" class="balance-value even"></span>
      </div>
      <div class="section-label">保留至下一季</div>
      <div id="closing-list" class="money"></div>
      <p id="closing-all-clear" class="empty" hidden>所有成員均已結清</p>
      <p id="closing-kept-hint" class="hint">保留的金額於下一季季費扣除或加收。</p>

      <div class="btn-row" style="margin-top:16px">
        <button type="button" class="btn btn-quiet" id="unsettle-btn" onclick="unsettleSeason()">復原結算</button>
        <a class="btn btn-quiet" href="organizer-settings.html">開新一季</a>
      </div>
      <p class="hint">復原後，退費紀錄以沖銷方式保留。已退現金不會自動收回。</p>
    </div>
  </div>
</div>

<div id="history-backdrop" class="gsheet-backdrop" hidden>
  <div class="gsheet">
    <button class="gsheet-close" aria-label="關閉" onclick="closeHistory()">✕</button>
    <h3 id="history-title">明細</h3>
    <div id="history-list"></div>
    <p class="hint">收款或退款按錯了，按「復原」會補一筆相反的紀錄；原本那筆會留著，標示已復原。</p>
  </div>
</div>

<div id="notice-backdrop" class="gsheet-backdrop" hidden>
  <div class="gsheet" role="dialog" aria-labelledby="notice-title">
    <button class="gsheet-close" aria-label="關閉" onclick="closeFeeNotice()">✕</button>
    <h3 id="notice-title">繳費通知</h3>
    <div id="notice-list" class="notice-list"></div>
    <div class="section-label">訊息內容（<span id="notice-sample-name"></span>）</div>
    <div id="notice-sample" class="notice-bubble"></div>
    <p class="hint">送出後無法收回。每位成員每季僅收到一次。</p>
    <p id="notice-skipped" class="hint" hidden></p>
    <div class="btn-row" style="margin-top:12px">
      <button type="button" class="btn btn-quiet" onclick="closeFeeNotice()">取消</button>
      <button type="button" class="btn btn-primary" id="notice-send" onclick="sendFeeNotice(this)">傳送</button>
    </div>
  </div>
</div>

<script src="js/common/format.js"></script>
<script src="js/common/api.js"></script>
<script src="js/common/errors.js"></script>
<script src="js/common/feedback.js"></script>
<script src="js/common/clubs.js"></script>
<script src="js/common/season.js"></script>
<script src="js/common/game-sheet.js"></script>
<script src="js/pages/organizer-ledger.js"></script>
</body>
</html>
