<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolleyFlow 球隊管理 · 帳務</title>
<link rel="preconnect" href="https://volleyflow.onrender.com" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  .tab[hidden] { display: none; }
  .m-act input, .m-act .confirm-partial { display: none; }
  .m-act.partial input, .m-act.partial .confirm-partial { display: block; }
  .m-act.partial .paid, .m-act.partial .later { display: none; }
  .settle-hint { font-size: .78rem; color: var(--ink-soft); margin: 10px 0 0; text-align: center; }
  .fee-notice { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
  .fee-notice-text { font-size: .82rem; color: var(--ink-soft); line-height: 1.5; }
  .fee-notice-text b { color: var(--ink); }
  .fee-notice .btn { width: auto; margin-top: 0; padding: 9px 14px; white-space: nowrap; }
  .notice-list { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; font-size: .84rem; margin-bottom: 12px; }
  .notice-list div { display: flex; justify-content: space-between; gap: 10px; padding: 7px 12px; border-top: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
  .notice-list div:first-child { border-top: none; }
  .notice-bubble { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px 14px 14px 4px; padding: 10px 12px; font-size: .84rem; line-height: 1.65; white-space: pre-line; }
</style>
</head>
<body>
<div class="wrap wide">
  <div class="app-bar">
    <span class="app-bar-left">
      <button type="button" class="back-btn" onclick="location.href='member.html'">‹ 會員頁</button>
    </span>
    <button type="button" class="brand" onclick="location.href='member.html'">VolleyFlow</button>
    <span class="app-bar-right">
      <button type="button" class="avatar" id="avatar-btn" title="個人資料">?</button>
    </span>
  </div>

  <nav class="context-switch">
    <a href="member.html">會員</a>
    <a href="organizer.html" class="on">管理</a>
  </nav>

  <nav class="org-nav">
    <a href="organizer.html" class="org-nav-link">總覽</a>
    <a href="organizer-members.html" class="org-nav-link">名單</a>
    <a href="organizer-ledger.html" class="org-nav-link active">帳務</a>
    <a href="organizer-settings.html" class="org-nav-link">設定</a>
  </nav>

  <div class="picker-row picker-row-labeled">
    <div id="club-picker-field" class="picker-field" hidden>
      <label for="club-picker">球隊</label>
      <select id="club-picker" class="season-picker club-picker" hidden></select>
    </div>
    <div id="season-picker-field" class="picker-field" hidden>
      <label for="season-picker">季別</label>
      <span class="picker-control">
        <select id="season-picker" class="season-picker" hidden></select>
        <i class="spinner sm picker-spinner" aria-hidden="true"></i>
      </span>
    </div>
  </div>
  <div id="error"></div>

  <div id="no-season"></div>

  <div class="seg" id="ledger-tabs" hidden>
    <span class="on" data-tab="fee">季費</span>
    <span data-tab="dropin">當天臨打</span>
    <span data-tab="closing">季末結算</span>
  </div>

  <div id="tab-fee" class="tab" hidden>
    <div class="balance">
      <span class="balance-label">季費已收</span>
      <span id="fee-collected" class="balance-value"></span>
    </div>
    <div class="progress"><i id="fee-progress" style="width:0%"></i></div>
    <p id="fee-hint" class="hint"></p>
    <div id="fee-notice" class="fee-notice" hidden>
      <span id="fee-notice-text" class="fee-notice-text"></span>
      <button type="button" class="btn btn-primary" id="fee-notice-btn" onclick="openFeeNotice()">繳費通知</button>
    </div>
    <div class="section-label" id="fee-share-label"></div>
    <div id="fee-list" class="money" data-season-content></div>
  </div>

  <div id="tab-dropin" class="tab" hidden>
    <select id="dropin-game-picker" class="season-picker" style="margin-bottom: 12px"></select>
    <div id="dropin-list" class="money" data-season-content></div>
  </div>

  <div id="tab-closing" class="tab" hidden>
    <div id="closing-before">
      <p id="closing-blocked" class="empty" hidden></p>
      <div id="closing-ready">
        <p class="hint">結算後本季名單與場地費鎖定，剩下的場次不能請假或報名臨打。未選擇者，餘額保留至下一季。</p>
        <div class="balance" style="margin-bottom:14px">
          <span class="balance-label">現金結餘</span>
          <span id="closing-cash" class="balance-value even">—</span>
        </div>
        <div class="section-label">本季結算</div>
        <div id="closing-preview" class="money"></div>
        <p id="closing-pending" class="hint"></p>
        <button type="button" class="btn btn-primary" id="settle-btn" onclick="settleSeason()">結算此季</button>
      </div>
    </div>
    <div id="closing-after" hidden>
      <div class="balance" style="margin-bottom: 14px">
        <span class="balance-label">已結算</span>
        <span id="closing-settled-at" class="balance-value even"></span>
      </div>
      <div class="section-label">保留至下一季</div>
      <div id="closing-list" class="money"></div>
      <p id="closing-all-clear" class="empty" hidden>所有成員均已結清</p>
      <p id="closing-kept-hint" class="hint">保留的金額於下一季季費扣除或加收。</p>

      <div class="btn-row" style="margin-top:16px">
        <button type="button" class="btn btn-quiet" id="unsettle-btn" onclick="unsettleSeason()">復原結算</button>
        <a class="btn btn-quiet" href="organizer-settings.html">開新一季</a>
      </div>
      <p class="hint">復原後，退費紀錄以沖銷方式保留。已退現金不會自動收回。</p>
    </div>
  </div>
</div>

<div id="history-backdrop" class="gsheet-backdrop" hidden>
  <div class="gsheet">
    <button class="gsheet-close" aria-label="關閉" onclick="closeHistory()">✕</button>
    <h3 id="history-title">明細</h3>
    <div id="history-list"></div>
    <p class="hint">收款或退款按錯了，按「復原」會補一筆相反的紀錄；原本那筆會留著，標示已復原。</p>
  </div>
</div>

<div id="notice-backdrop" class="gsheet-backdrop" hidden>
  <div class="gsheet" role="dialog" aria-labelledby="notice-title">
    <button class="gsheet-close" aria-label="關閉" onclick="closeFeeNotice()">✕</button>
    <h3 id="notice-title">繳費通知</h3>
    <div id="notice-list" class="notice-list"></div>
    <div class="section-label">訊息內容（<span id="notice-sample-name"></span>）</div>
    <div id="notice-sample" class="notice-bubble"></div>
    <p class="hint">送出後無法收回。每位成員每季僅收到一次。</p>
    <p id="notice-skipped" class="hint" hidden></p>
    <div class="btn-row" style="margin-top:12px">
      <button type="button" class="btn btn-quiet" onclick="closeFeeNotice()">取消</button>
      <button type="button" class="btn btn-primary" id="notice-send" onclick="sendFeeNotice(this)">傳送</button>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
  // localhost -> the local API, anywhere else -> production. See apiBase.
  const API_BASE = apiBase();
  const LIFF_ID = "2011156233-6CouG6VI";
  let currentSeason = null;

  const identityReady = (async function initIdentity() {
    const identified = await initLiffIdentity(API_BASE, LIFF_ID);
    if (identified) {
      document.getElementById("avatar-btn").textContent = identified.name.slice(0, 1);
    }
    return identified;
  })();
  document.getElementById("avatar-btn").addEventListener("click", () => {
    location.href = "profile.html";
  });

  document.getElementById("ledger-tabs").addEventListener("click", (e) => {
    const tab = e.target.closest("[data-tab]");
    if (!tab) return;
    showTab(tab.dataset.tab);
  });

  function showTab(name) {
    document.querySelectorAll("#ledger-tabs [data-tab]").forEach((t) => {
      t.classList.toggle("on", t.dataset.tab === name);
    });
    document.querySelectorAll(".tab").forEach((el) => {
      el.hidden = el.id !== `tab-${name}`;
    });
  }
  if (location.hash === "#settle") showTab("closing");

  showPageLoading(document.getElementById("no-season"));
  document.getElementById("ledger-tabs").hidden = true;

  // Every club-scoped read carries the caller's token now, so nothing may
  // fetch before LIFF identity has resolved — otherwise authHeader() is
  // empty and the server correctly says 401.
  identityReady.then((identified) => {
    if (!identified) {
      stopLoadingEscalation();
      document.getElementById("no-season").innerHTML = signInFailureHtml(identified);
      return;
    }
    initClubAndSeasonPickers(
      API_BASE,
      document.getElementById("club-picker"),
      document.getElementById("season-picker"),
      "vf_org_season",
      (id) => {
        stopLoadingEscalation();
        const hasClub = !!currentClubId();
        document.getElementById("club-picker-field").hidden = !hasClub;
        document.getElementById("club-picker").hidden = !hasClub;
        if (id) {
          // The tabs stay hidden until loadLedger has the numbers.
          // Revealing them here put an empty 季費已收 card on screen for
          // the length of the fetch, which reads as broken, not busy.
          document.getElementById("season-picker-field").hidden = false;
          document.getElementById("season-picker").hidden = false;
          loadLedger(id);
        } else {
          setHasSeason(false);
        }
      },
      (e) => showPageError(document.getElementById("no-season"), e.message),
      // Only the clubs this person actually organizes — see
      // initClubAndSeasonPickers. A club they merely belong to used to
      // appear here and open a management screen they cannot use.
      (c) => c.role === "organizer"
    );
  });

  /** The three tabs are meaningless without a season — there are no fees
   * to collect and nothing to settle — so hide them entirely rather than
   * showing three empty money screens. */
  function setHasSeason(hasSeason) {
    // #tab-fee starts hidden in the markup too, or its 季費已收 heading
    // and its empty white bar sit under the spinner while the numbers
    // are still on their way.
    document.getElementById("ledger-tabs").hidden = !hasSeason;
    document.getElementById("season-picker-field").hidden = !hasSeason;
    document.getElementById("season-picker").hidden = !hasSeason;
    document.querySelectorAll(".tab").forEach((el) => {
      if (!hasSeason) el.hidden = true;
    });
    document.getElementById("no-season").innerHTML = hasSeason
      ? ""
      : currentClubId()
        ? emptyStateHtml(
            "這個球隊尚未開季",
            "季費、當天臨打和季末結算都是跟著一季走的。建立第一季之後，每個人的應收金額就會出現在這裡。",
            { label: "建立第一季", href: "organizer-settings.html" }
          )
        : noClubYetHtml();
    // On a day there is a game, this page's job is collecting cash
    // courtside, so it opens on 當天臨打. Every other day it opens on
    // 季費, which is what you read before a season starts. A #settle
    // link still wins outright — that is somebody arriving from a
    // link that names the tab it wants.
    if (hasSeason) {
      const today = dateKey(new Date());
      const gameToday = currentSeason.games.some(
        (g) => g.date === today && g.status === "scheduled"
      );
      // 季末結算 is worth an equal third of this control on exactly one
      // night a season. Until the last game has been played it steps
      // aside instead — still there, still tappable, just not competing
      // with the two tabs used every week. showTab only toggles `on`
      // and the panels' hidden flag, so this class survives every
      // switch.
      const games = currentSeason.games;
      const last = games[games.length - 1];
      const stillRunning =
        currentSeason.settled_at === null && !!last && last.date >= today;
      const closingTab = document.querySelector('#ledger-tabs [data-tab="closing"]');
      if (closingTab) closingTab.classList.toggle("quiet", stillRunning);
      showTab(
        location.hash === "#settle" ? "closing" : gameToday ? "dropin" : "fee"
      );
    }
  }

  const ledgerLoad = staleGuard();

  async function loadLedger(seasonId) {
    // Two of these run on nearly every page load — see staleGuard — and
    // whichever finishes last wins. Without the ticket the loser can be
    // the older one, repainting money figures from before the last
    // write.
    const ticket = ledgerLoad.take();
    // What the screen knew when this read set off. It matters more now
    // that a cached copy can arrive: an answer from before the last tap
    // would otherwise repaint a payment away. See localRevision.
    const askedAt = localRevision();
    const errorEl = document.getElementById("error");
    errorEl.textContent = "";
    try {
      // Cached copy first, network second — the same conversion
      // organizer-settings.html made, for the same reason: this was the
      // only link in the chain (LIFF, identify, clubs, seasons, then
      // this) still going to the network every time. Measured at 1910ms
      // warm against 508ms for 設定, which reads the same season the
      // same way. A 404 now reports through the catch rather than its
      // own branch, matching that page.
      await getJsonSWR(`${API_BASE}/seasons/${seasonId}`, (season) => {
        paint(season).catch((e) => {
          if (!ledgerLoad.current(ticket)) return;
          errorEl.textContent = "連不上伺服器：" + e.message;
        });
      }, { headers: authHeader() });
    } catch (e) {
      if (!ledgerLoad.current(ticket)) return;
      document.getElementById("no-season").innerHTML = "";
      errorEl.textContent = "連不上伺服器：" + e.message;
    }

    async function paint(season) {
      if (!ledgerLoad.current(ticket)) return;
      // Older than what is on screen — painting it would undo a tap.
      if (currentSeason && currentSeason.id === season.id && localRevision() !== askedAt) return;
      currentSeason = season;
      // Started before the balances rather than after them: the two
      // don't depend on each other, and running them back to back made
      // this page wait out two round trips where one would do.
      const settlementReady = fetchSettlement(season);
      await loadBalances(currentSeason);
      if (!ledgerLoad.current(ticket)) return;
      // The screen goes up here, not after the settlement. That preview
      // feeds 季末結算 and nothing else, so waiting for it held 季費 and
      // 當天臨打 — three quarters of the page — behind a round trip they
      // have no use for. renderClosingTab already copes with an empty
      // preview; it is what it draws before one is fetched at all.
      await Promise.all([renderFeeTab(), renderDropInTab()]);
      if (!ledgerLoad.current(ticket)) return;
      setHasSeason(true);
      settlementPreview = await settlementReady;
      if (!ledgerLoad.current(ticket)) return;
      await renderClosingTab();
    }
  }

  // --- shared helpers -----------------------------------------------

  /** Everyone's balance in one request. This used to be one request per
   * member — around forty on a page load for a normal club, against a
   * browser that opens six connections at a time, which is why this
   * screen crawled. Cached on `balances` so switching tabs doesn't
   * re-ask. */
  let balances = {};

  let settlementPreview = { members: [] };

  /** What settling right now would refund. Fetched alongside the
   * balances, not after them. */
  async function fetchSettlement(season) {
    if (season.settled_at !== null) return { members: [] };
    try {
      const res = await fetch(`${API_BASE}/seasons/${season.id}/settlement`, {
        headers: authHeader(),
      });
      return res.ok ? await res.json() : { members: [] };
    } catch (e) {
      return { members: [] };
    }
  }

  /** `apply` is how the caller says whether this answer is still wanted.
   * It has to be its decision, not a check afterwards: applyBalances
   * replaces the whole map, so an answer older than the screen has
   * already overwritten the payment it was about by the time anyone
   * could notice and skip the repaint. */
  async function loadBalances(season, apply) {
    const use = apply || applyBalances;
    try {
      await getJsonSWR(
        `${API_BASE}/clubs/${currentClubId()}/balances?season_id=${season.id}`,
        (rows) => use(rows),
        { headers: authHeader() }
      );
    } catch (e) {
      use([]);
    }
  }

  /** Kept apart from the fetch above so the rows every money figure is
   * derived from can be set directly, without a network stub. */
  function applyBalances(rows) {
    balances = {};
    for (const row of rows) balances[row.player_id] = row;
  }

  /** Re-reads everyone's balance after a payment, without being able to
   * undo the payment that asked for it.
   *
   * This used to fire a GET the instant one payment's POST came back.
   * Tap 已收 on several rows in a row and that GET overtakes the taps
   * still waiting their turn in the write queue: the answer describes
   * the books as they were before those taps, the tabs are rebuilt from
   * it, and the rows flip back — then the next payment's own refresh
   * puts them forward again. Exactly the 「切回原來的狀態又切回來」
   * reported on 請假, in a second place that had its own copy of the
   * same mistake.
   *
   * Two rules fix it, both borrowed from the member screen:
   * coalescedRefresh puts the read in the same queue as the writes, so
   * it can never ask a question the pending taps haven't been allowed to
   * answer; and the revision check drops an answer that set off before
   * the latest local change. Repainting only on a real difference stays
   * — after a payment the server normally agrees, and rebuilding three
   * tabs of identical markup is itself a visible stutter. */
  const refreshBalancesQuietly = coalescedRefresh(async () => {
    if (!currentSeason) return;
    const askedAt = localRevision();
    const optimistic = JSON.stringify(balances);
    const ticket = ledgerLoad.take();
    let changed = false;
    await loadBalances(currentSeason, (rows) => {
      if (!ledgerLoad.current(ticket) || localRevision() !== askedAt) return;
      applyBalances(rows);
      changed = JSON.stringify(balances) !== optimistic;
    });
    if (changed) renderTabsFromBalances();
  });

  /** The zero row for someone with no ledger entries at all — a member
   * added moments ago, a drop-in who hasn't been charged yet. */
  function balanceOf(playerId) {
    return (
      balances[playerId] || {
        player_id: playerId,
        balance: "0",
        season_total: "0",
        through_season: "0",
        season_fee_charged: "0",
        brought_by: null,
      }
    );
  }

  /** Which part of a player's club ledger a row is about.
   *
   * A club's books span seasons, and a season's fees are charged the
   * moment it is created (CLAUDE.md 2.4), so the ledger can hold a
   * season that hasn't started yet. Summing all of it put a January
   * season's fee into October's 應收 — on 季費 in 2026-09, and on
   * 季末結算 until 2026-10, where 已收 would have booked January's money
   * as October's.
   *
   * "through" — 季費 and 季末結算: this season and every earlier one
   * (the server's `through_season`), so last season's kept balance is
   * deducted or added here and a later season never is. "season" —
   * 當天臨打, which collects this season's money and nothing else. */
  function splitLedger(row, scope = "through") {
    const balance = Number(row.balance);
    const seasonTotal = Number(row.season_total);
    // A cached answer from before the server sent through_season has
    // only the whole ledger to offer.
    const through = row.through_season == null ? balance : Number(row.through_season);
    return {
      scope,
      seasonTotal,
      // Earlier seasons only — what 上季餘額 / 上季未繳 refer to.
      earlierTotal: through - seasonTotal,
      // Every other season, earlier or later — 當天臨打's context line.
      otherTotal: balance - seasonTotal,
      balance,
      due: scope === "season" ? seasonTotal : through,
    };
  }

  function moneyRowHtml(playerId, name, gender, split, extraBreakLabel, extraBreakValue) {
    // The figure this row is about — see splitLedger. Every number and
    // every button below reads from it, so a season-scoped row can
    // never collect another season's money by accident.
    const due = split.due;
    const netCls = due === 0 ? "clear" : due > 0 ? "owed" : "owe";
    const netText = due === 0 ? "已結清" : due > 0 ? `應退 $${due}` : `應收 $${Math.abs(due)}`;
    const breakParts = [];
    if (extraBreakLabel) breakParts.push(`<span>${extraBreakLabel} <b>$${extraBreakValue}</b></span>`);
    if (split.scope === "season") {
      // Every season that isn't the one on screen, which may well be one
      // still to come — so not 上季.
      if (split.otherTotal !== 0) {
        breakParts.push(`<span>其他季別 <b>${split.otherTotal > 0 ? "+" : "−"}$${Math.abs(split.otherTotal)}</b></span>`);
      }
    } else if (split.earlierTotal !== 0) {
      // Next to 本季季費 the credit is what comes off it; on its own it
      // is just what the earlier seasons left.
      const credit = extraBreakLabel ? "上季餘額扣除" : "上季餘額";
      breakParts.push(
        `<span>${split.earlierTotal > 0 ? credit : "上季未繳"} <b>$${Math.abs(split.earlierTotal)}</b></span>`
      );
    }

    let actionHtml = "";
    if (due < 0) {
      const owe = Math.abs(due);
      actionHtml = `
        <div class="m-act">
          <button type="button" class="paid" onclick="recordFullPayment(this, ${playerId}, ${owe})">已收</button>
          <button type="button" class="later" onclick="showPartialInput(this)">部分收款</button>
          <input type="number" placeholder="金額">
          <button type="button" class="confirm-partial" onclick="recordPartialPayment(this, ${playerId})">確認</button>
        </div>
      `;
    } else if (due > 0) {
      actionHtml = `
        <div class="m-keep">
          <span>保留於餘額</span>
          <button type="button" class="mini-action" onclick="recordCashRefund(${playerId}, ${due})">退款</button>
        </div>
      `;
    } else {
      actionHtml = '<div class="m-done">✓ 已結清</div>';
    }

    // A guest's fee sits on their own ledger, but they have no account
    // and pay nothing — the member who brought them hands over the cash
    // — so without this the row says "小明 應收 $235" with no way to
    // know who to ask. Not the only place it appears any more: the
    // roster carries it too as of 2026-09-23, at the organizer's
    // request. This used to read "kept off the roster, where it would
    // be noise rather than an answer" — that decision is reversed, so
    // don't delete either copy as a duplicate of the other.
    const brought = balanceOf(playerId).brought_by;
    const broughtTag = brought
      ? `<span class="m-brought">${escapeHtml(brought)} 報名</span>`
      : "";

    return `
      <div class="m-row">
        <div class="m-top">
          <span class="avatar sm">${escapeHtml((name || "?").slice(0, 1))}</span>
          <span class="m-name">${escapeHtml(name)}${genderTag(gender)}${broughtTag}</span>
          <span class="m-net ${netCls}">${netText}</span>
          <button type="button" class="mini-action" onclick="openHistory(${playerId})">明細</button>
        </div>
        ${breakParts.length ? `<div class="m-break">${breakParts.join("")}</div>` : ""}
        ${actionHtml}
      </div>
    `;
  }


  // Scoped to the clicked button's own row (via closest), not a
  // page-wide id lookup — the same player can legitimately have a row
  // in more than one tab at once (a fixed member who also signed up as
  // a drop-in), and a global "[data-x=playerId]" selector would always
  // hit whichever tab's row comes first in the DOM, even a hidden one.
  function showPartialInput(btn) {
    btn.closest(".m-act").classList.add("partial");
  }

  async function recordFullPayment(btn, playerId, amount) {
    await submitPayment(playerId, amount);
  }

  async function recordPartialPayment(btn, playerId) {
    const input = btn.closest(".m-act").querySelector("input");
    const amount = input.value.trim();
    if (!amount) {
      toast("請先填金額");
      input.focus();
      return;
    }
    if (!(Number(amount) > 0)) {
      toast("金額要大於 0");
      input.focus();
      return;
    }
    await submitPayment(playerId, amount);
  }

  // Undoing adds an opposite entry; the original stays, marked 已復原.
  async function undoEntry(entryId) {
    try {
      await enqueueRequest(() => postJson(API_BASE, `/ledger-entries/${entryId}/reverse`, {}));
      bumpLocalRevision();
      refreshBalancesQuietly();
      toast("已復原", "good");
      if (!document.getElementById("history-backdrop").hidden) openHistory(historyPlayerId);
    } catch (e) {
      toast("復原失敗：" + e.message);
    }
  }

  let historyPlayerId = null;
  const ENTRY_LABELS = {
    season_fee_charged: "季費",
    drop_in_fee_charged: "臨打費",
    absence_refund: "請假退款",
    carried_over: "結轉",
  };

  async function openHistory(playerId) {
    historyPlayerId = playerId;
    const list = document.getElementById("history-list");
    list.innerHTML = '<div class="empty">載入中…</div>';
    document.getElementById("history-backdrop").hidden = false;
    try {
      const res = await fetch(`${API_BASE}/clubs/${currentClubId()}/players/${playerId}/ledger`, {
        headers: authHeader(),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const ledger = await res.json();
      if (historyPlayerId !== playerId) return;
      document.getElementById("history-title").textContent = `${ledger.player_name} 的明細`;
      list.innerHTML = historyHtml(ledger.entries);
    } catch (e) {
      list.innerHTML = `<div class="empty">讀取失敗：${escapeHtml(e.message)}</div>`;
    }
  }

  function closeHistory() {
    document.getElementById("history-backdrop").hidden = true;
  }

  function historyHtml(entries) {
    if (!entries.length) return '<div class="empty">還沒有任何紀錄</div>';
    const undone = new Set(entries.filter((e) => e.reverses_entry_id).map((e) => e.reverses_entry_id));
    return entries
      .slice()
      .reverse()
      .map((e) => {
        const amount = Number(e.amount);
        const label = e.reverses_entry_id
          ? "復原"
          : e.entry_type === "payment"
            ? amount > 0 ? "收款" : "退款"
            : ENTRY_LABELS[e.entry_type] || e.entry_type;
        const canUndo = e.entry_type === "payment" && !e.reverses_entry_id && !undone.has(e.id);
        const when = stampTime(e.recorded_at);
        return `
          <div class="set-row" data-entry="${e.id}">
            <span class="set-label">${label}${undone.has(e.id) ? " · 已復原" : ""}<span class="set-sub">${when}</span></span>
            <span>${amount > 0 ? "+" : "−"}$${Math.abs(amount)}</span>
            ${canUndo ? `<button type="button" class="mini-action" onclick="undoEntry(${e.id})">復原</button>` : ""}
          </div>`;
      })
      .join("");
  }

  document.getElementById("history-backdrop").addEventListener("click", (e) => {
    if (e.target.id === "history-backdrop") closeHistory();
  });

  async function recordCashRefund(playerId, amount) {
    if (!confirm(`確定要記錄退款 $${amount} 嗎？`)) return;
    await submitPayment(playerId, -amount);
  }

  /**
   * Records money, and shows it as recorded straight away.
   *
   * Two separate problems are being handled here. The tap used to wait
   * on a write and then a full reload of the page's data before
   * anything moved, which on a phone is a long, silent second or more.
   * And a tap that times out invites a second tap, which on money means
   * recording it twice — so each intended payment carries a token, and
   * the server returns the entry it already has rather than adding
   * another. Retrying is therefore always safe.
   */
  async function submitPayment(playerId, amount) {
    const token = `${currentSeason.id}-${playerId}-${amount}-${Date.now()}`;
    const row = balanceOf(playerId);
    const before = { ...row };
    balances[playerId] = {
      ...row,
      balance: String(Number(row.balance) + Number(amount)),
      season_total: String(Number(row.season_total) + Number(amount)),
      through_season: String(Number(row.through_season ?? row.balance) + Number(amount)),
    };
    // The screen now knows something the server hasn't been told yet, so
    // any balances read already in the air is out of date — same rule
    // the member screen follows. See refreshBalancesQuietly.
    bumpLocalRevision();
    renderTabsFromBalances();

    try {
      // Queued, like every other write in the app. This page had never
      // been: five taps on 已收 sent five requests at once and each one
      // asked for a re-read the moment it landed, so a read could be
      // answering the books as they were three payments ago while those
      // three sat unsent. That is what put rows back to 未收 for half a
      // second before they settled — the same 「切回原來的狀態又切回來」
      // as 請假, from the same cause, on a screen that had never been
      // given the fix.
      const entry = await enqueueRequest(() =>
        postJson(API_BASE, `/clubs/${currentClubId()}/players/${playerId}/payments`, {
          amount: String(amount),
          season_id: currentSeason.id,
          note: "帳務頁記錄",
          client_token: token,
        })
      );
      refreshBalancesQuietly();
      const what = Number(amount) > 0 ? `已記錄收款 $${amount}` : `已記錄退款 $${Math.abs(amount)}`;
      toast(what, "good", { label: "復原", onClick: () => undoEntry(entry.id) });
    } catch (e) {
      balances[playerId] = before;
      bumpLocalRevision();
      renderTabsFromBalances();
      toast("記錄失敗：" + e.message);
    }
  }

  /** Redraws the three tabs from the balances already in hand — no
   * network, so the screen keeps up with a tap. */
  function renderTabsFromBalances() {
    renderFeeTab();
    renderDropInList();
    renderClosingTab();
  }

  // --- 季費 tab --------------------------------------------------------

  function renderFeeTab() {
    const season = currentSeason;

    let collected = 0;
    let total = 0;
    const rowsHtml = season.members
      .map((member) => {
        // Up to this season: last season's kept balance comes off (or
        // goes on) here, and a season booked later never does. See
        // splitLedger.
        const split = splitLedger(balanceOf(member.id));
        const feeCharged = -Number(balanceOf(member.id).season_fee_charged);
        total += feeCharged;
        // The bar measures this season's fee, so what is still owed
        // counts against it only up to the fee itself.
        const outstanding = Math.min(feeCharged, Math.max(0, -split.due));
        collected += feeCharged - outstanding;
        return moneyRowHtml(member.id, member.name, member.gender, split, "本季季費", feeCharged);
      })
      .join("");

    document.getElementById("fee-list").innerHTML =
      rowsHtml || '<div class="empty">這一季尚無固定成員</div>';
    document.getElementById("fee-collected").textContent = `$${Math.round(collected)} / $${Math.round(total)}`;
    document.getElementById("fee-progress").style.width = total > 0 ? `${Math.min(100, (collected / total) * 100)}%` : "0%";
    // Counted the same way as the progress bar above it. These two used
    // to disagree: the bar was season-scoped and this was club-wide, so
    // the card could read "全部已收" over "3 人未收".
    const unpaidCount = season.members.filter(
      (m) => splitLedger(balanceOf(m.id)).due < 0
    ).length;
    document.getElementById("fee-hint").textContent =
      unpaidCount === 0
        ? "全部已收"
        : `${season.members.length - unpaidCount} 人已收・${unpaidCount} 人未收・季費於開季前收款`;
    // Summed per game, not share x count: a cooled night costs more, so
    // those two stopped being the same number.
    const games = seasonBillableGames(season);
    document.getElementById("fee-share-label").textContent =
      `每人 $${seasonFeeFor(season)} · ${games} 場`;
    renderFeeNotice(feeNoticeState(season, todayString()));
  }

  // --- 繳費通知 ---------------------------------------------------------

  /** Who this season's 繳費通知 would go to right now, and what the card
   * on the 季費 tab says. A pure function of the season and the
   * balances, so tests/frontend/fee_notice.test.js can state the rules.
   *
   * The only money message there is (2026-10-02): last season's kept
   * balance is folded in here rather than announced at settlement. The
   * server enforces every rule below again in send_fee_notice — these
   * exist so the card never offers a send that would be refused.
   *
   * - A season already over gets no card.
   * - Until the previous season is settled the figure is not final, so
   *   the button is shown but disabled, with the reason.
   * - A message cannot be taken back: each member at most once a
   *   season, so anyone already sent one is never a recipient again.
   * - Nobody who owes nothing; nobody without LINE, who cannot receive
   *   it (counted, so the organizer knows to tell them in person). */
  function feeNoticeState(season, today) {
    const last = season.games.reduce((max, g) => (g.date > max ? g.date : max), "");
    if (!last || last < today) return { kind: "none" };
    if (season.previous_season_settled === false) {
      return { kind: "blocked", text: "上一季結算後可發送繳費通知。" };
    }
    const owing = season.members.filter(
      (m) => !m.fee_notice_sent_at && splitLedger(balanceOf(m.id)).due < 0
    );
    const recipients = owing.filter((m) => m.linked);
    const sent = season.members.filter((m) => m.fee_notice_sent_at);
    const lastSent = sent.map((m) => m.fee_notice_sent_at).sort().pop();
    if (recipients.length === 0) {
      return sent.length
        ? { kind: "done", text: `已通知 <b>${sent.length}</b> 人・${sentTime(lastSent)}` }
        : { kind: "none" };
    }
    return {
      kind: "ready",
      text: `${sent.length ? `已通知 ${sent.length} 人・` : ""}未通知 <b>${recipients.length}</b> 人`,
      recipients,
      withoutLine: owing.length - recipients.length,
    };
  }

  function sentTime(iso) {
    const [day, time] = iso.split("T");
    return `${monthDay(day)} ${time.slice(0, 5)}`;
  }

  function renderFeeNotice(state) {
    const card = document.getElementById("fee-notice");
    card.hidden = state.kind === "none";
    if (card.hidden) return;
    document.getElementById("fee-notice-text").innerHTML = state.text;
    const btn = document.getElementById("fee-notice-btn");
    btn.hidden = state.kind === "done";
    btn.disabled = state.kind === "blocked";
  }

  /** The message exactly as the server words it (reminders.
   * _fee_notice_text), less the app link, so what the organizer
   * approves is what members read. */
  function feeNoticeText(season, member, clubName) {
    const row = balanceOf(member.id);
    const split = splitLedger(row);
    const dates = season.games.map((g) => g.date).sort();
    const label = dates.length ? `${monthDay(dates[0])}–${monthDay(dates[dates.length - 1])}` : "";
    const lines = [
      label ? `${clubName} 季費（${label}）` : `${clubName} 季費`,
      `季費 $${-Number(row.season_fee_charged)}`,
    ];
    if (split.earlierTotal > 0) lines.push(`上季餘額扣除 $${split.earlierTotal}`);
    else if (split.earlierTotal < 0) lines.push(`上季未繳 $${-split.earlierTotal}`);
    lines.push(`應繳 $${-split.due}`);
    return lines.join("\n");
  }

  function currentClubName() {
    const picker = document.getElementById("club-picker");
    const option = picker && picker.selectedOptions && picker.selectedOptions[0];
    return option ? option.textContent.trim() : "";
  }

  function openFeeNotice() {
    const state = feeNoticeState(currentSeason, todayString());
    if (state.kind !== "ready") return;
    document.getElementById("notice-list").innerHTML = state.recipients
      .map(
        (m) =>
          `<div><span>${escapeHtml(m.name)}</span><span>應繳 $${-splitLedger(balanceOf(m.id)).due}</span></div>`
      )
      .join("");
    const first = state.recipients[0];
    document.getElementById("notice-sample-name").textContent = first.name;
    document.getElementById("notice-sample").textContent = feeNoticeText(
      currentSeason,
      first,
      currentClubName()
    );
    const skipped = document.getElementById("notice-skipped");
    skipped.hidden = state.withoutLine === 0;
    skipped.textContent = `另有 ${state.withoutLine} 位未使用 LINE，不傳送。`;
    document.getElementById("notice-send").textContent = `傳送給 ${state.recipients.length} 人`;
    document.getElementById("notice-backdrop").hidden = false;
  }

  function closeFeeNotice() {
    document.getElementById("notice-backdrop").hidden = true;
  }

  async function sendFeeNotice(btn) {
    try {
      const result = await whileBusy(btn, async () =>
        postJson(API_BASE, `/seasons/${currentSeason.id}/fee-notice`, {})
      );
      closeFeeNotice();
      toast(
        result.unreachable
          ? `已通知 ${result.sent} 位成員。${result.unreachable} 位未能送達（尚未加入官方帳號）。`
          : `已通知 ${result.sent} 位成員。`,
        "good"
      );
      loadLedger(currentSeason.id);
    } catch (e) {
      toast("傳送失敗：" + translateApiError(e.message));
    }
  }

  document.getElementById("notice-backdrop").addEventListener("click", (e) => {
    if (e.target.id === "notice-backdrop") closeFeeNotice();
  });

  function seasonBillableGames(season) {
    return season.games.filter((g) => g.status !== "cancelled_refunded").length;
  }

  // --- 當天臨打 tab -----------------------------------------------------

  function renderDropInGamePicker() {
    const picker = document.getElementById("dropin-game-picker");
    const today = new Date().toISOString().slice(0, 10);
    const nearest = currentSeason.games.find((g) => g.date >= today) || currentSeason.games[currentSeason.games.length - 1];
    picker.innerHTML = currentSeason.games
      .map((g) => `<option value="${g.id}">${describeDate(g.date).label}（臨打 ${g.confirmed_drop_ins.length} 人）</option>`)
      .join("");
    if (nearest) picker.value = nearest.id;
    picker.onchange = renderDropInList;
  }

  async function renderDropInTab() {
    renderDropInGamePicker();
    await renderDropInList();
  }

  async function renderDropInList() {
    const gameId = Number(document.getElementById("dropin-game-picker").value);
    const game = currentSeason.games.find((g) => g.id === gameId);
    const list = document.getElementById("dropin-list");
    if (!game || game.confirmed_drop_ins.length === 0) {
      list.innerHTML = '<div class="empty">這一場沒有臨打</div>';
      return;
    }
    list.innerHTML = game.confirmed_drop_ins
      .map((d) =>
        moneyRowHtml(
          d.player_id,
          d.player_name,
          d.gender,
          // Tonight's fee is this season's money, collected on the
          // night — not a place to show another season's balance.
          splitLedger(balanceOf(d.player_id), "season"),
          null,
          null
        )
      )
      .join("");
  }

  // --- 季末結算 tab -----------------------------------------------------

  async function renderClosingTab() {
    const season = currentSeason;
    const settled = season.settled_at !== null;
    document.getElementById("closing-before").hidden = settled;
    document.getElementById("closing-after").hidden = !settled;

    if (!settled) {
      // Not offered before it can be done: the server refuses the same
      // cases (_why_not_settleable), and a button that only explains its
      // refusal after being pressed is the worse screen.
      const blocked = settleBlocker(season, todayString());
      document.getElementById("closing-blocked").hidden = !blocked;
      document.getElementById("closing-blocked").textContent = blocked || "";
      document.getElementById("closing-ready").hidden = !!blocked;
      if (!blocked) renderClosingChoices(season, settlementPreview);
      return;
    }

    document.getElementById("closing-settled-at").textContent = season.settled_at.slice(0, 16).replace("T", " ");
    // Up to this season, like everything on this tab: a season booked
    // for later is not something this one kept back.
    const kept = season.members.filter((m) => splitLedger(balanceOf(m.id)).due !== 0);
    document.getElementById("closing-all-clear").hidden = kept.length > 0;
    document.getElementById("closing-kept-hint").hidden = kept.length === 0;
    document.getElementById("closing-list").innerHTML = kept
      .map((m) => moneyRowHtml(m.id, m.name, m.gender, splitLedger(balanceOf(m.id)), null, null))
      .join("");
  }

  /* Settling in one pass.
   *
   * The list used to show only the people owed a refund, read-only, and
   * squaring up was a second errand afterwards: settle, then walk the
   * member list tapping 退款 or 已收 one at a time. Now every member
   * whose balance isn't zero gets a choice here, and 結算此季 writes the
   * refunds and the cash together.
   *
   * 保留至下一季 is the default and writes nothing: a balance is already
   * club-wide, so leaving it alone *is* carrying it forward. That is why
   * only the people actually handing money over end up in the request.
   */
  const closingCash = new Map();
  // What the block is currently showing. Held here rather than read from
  // currentSeason/settlementPreview so the functions below depend only
  // on what they were handed — they are the same objects in the page.
  let closingSeason = null;
  let closingPreview = null;

  /** When a season may be settled — the same rule the server enforces
   * in _why_not_settleable, stated here so the tab can say why instead
   * of offering a button that will be refused. From three weeks before
   * the last game, and only once no game still to come has an absence
   * nobody is filling. `today` is "YYYY-MM-DD", passed in for tests. */
  function settleBlocker(season, today) {
    const games = [...season.games].sort((a, b) => (a.date < b.date ? -1 : 1));
    if (!games.length) return null;
    const opens = shiftDate(games[games.length - 1].date, -21);
    if (today < opens) return `${monthDay(opens)} 起可結算（最後一場前 3 週）。`;
    const open = games.find(
      (g) => g.date >= today && g.status === "scheduled" && g.absences.some((a) => !a.filled_by)
    );
    return open ? `${monthDay(open.date)} 尚有缺額，補齊後可結算。` : null;
  }

  function shiftDate(iso, days) {
    const d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + days);
    return localIso(d);
  }

  function localIso(d) {
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function todayString() {
    return localIso(new Date());
  }

  function monthDay(iso) {
    const [, m, d] = iso.split("-");
    return `${Number(m)}/${Number(d)}`;
  }

  /** What this member's balance is, from the club's point of view:
   * positive means the club owes them. Up to this season — see
   * splitLedger. */
  function closingDue(playerId) {
    return Number(splitLedger(balanceOf(playerId)).due);
  }

  function renderClosingChoices(season, preview) {
    closingSeason = season || closingSeason;
    closingPreview = preview || closingPreview;
    season = closingSeason;
    // The settlement hasn't been written yet, so a member's balance
    // doesn't include the refund it is about to credit them. Add it in,
    // or someone owed exactly their refund reads as 已結清 and the
    // organizer is never offered the payout.
    const refundOf = new Map(
      closingPreview.members.map((m) => [m.player_id, Number(m.refund)])
    );
    const rows = season.members
      .map((m) => ({
        id: m.id,
        name: m.name,
        gender: m.gender,
        due: closingDue(m.id) + (refundOf.get(m.id) || 0),
      }))
      .filter((m) => m.due !== 0);

    document.getElementById("closing-preview").innerHTML = rows.length
      ? rows.map(closingRowHtml).join("")
      : '<div class="empty">所有成員均已結清。</div>';
    renderClosingCash(rows);
  }

  function closingRowHtml(m) {
    const owed = m.due > 0;
    const picked = closingCash.has(m.id) ? "cash" : "keep";
    const amount = Math.abs(m.due);
    return `
      <div class="m-row">
        <div class="m-top">
          <span class="avatar sm">${escapeHtml((m.name || "?").slice(0, 1))}</span>
          <span class="m-name">${escapeHtml(m.name)}${genderTag(m.gender)}</span>
          <span class="m-net ${owed ? "owed" : "owe"}">${owed ? "應退" : "應收"} $${amount}</span>
        </div>
        <div class="seg-pick" role="radiogroup" aria-label="${escapeHtml(m.name)} 結算方式">
          <button type="button" role="radio" aria-checked="${picked === "keep"}"
            class="${picked === "keep" ? "selected" : ""}"
            onclick="pickClosing(${m.id}, 'keep')">保留至下一季</button>
          <button type="button" role="radio" aria-checked="${picked === "cash"}"
            class="${picked === "cash" ? "selected" : ""}"
            onclick="pickClosing(${m.id}, 'cash')">${owed ? "退款" : "已收"}</button>
        </div>
      </div>`;
  }

  /** Cash in less cash out, so the organizer can count what should be in
   * their hand when the evening is over — and, under the list, what
   * 結算此季 is about to write. The choices above it are a selection,
   * not a record (styled as one: .seg-pick, never the solid 已收 that
   * records on the spot), so the line says when they take effect. */
  function renderClosingCash(rows) {
    let total = 0;
    let moves = 0;
    for (const m of rows) {
      if (!closingCash.has(m.id)) continue;
      total -= m.due;
      moves += 1;
    }
    const el = document.getElementById("closing-cash");
    el.textContent = moves === 0 ? "—" : (total > 0 ? "+" : total < 0 ? "−" : "") + "$" + Math.abs(total);
    el.className = "balance-value" + (moves === 0 ? " even" : total > 0 ? " owed" : " owe");
    const pending = document.getElementById("closing-pending");
    pending.hidden = rows.length === 0;
    pending.textContent = `結算時記錄：現金收付 ${moves} 筆，保留 ${rows.length - moves} 筆。`;
  }

  function pickClosing(playerId, how) {
    // The amount is read at settle time, not here: a preview refresh
    // between the tap and 結算此季 would otherwise write a stale figure.
    if (how === "cash") closingCash.set(playerId, true);
    else closingCash.delete(playerId);
    renderClosingChoices();
  }

  /** Undo a settlement.
   *
   * Every refund it wrote is cancelled by an opposite entry rather than
   * deleted — the books go on saying a settlement happened and was
   * undone. The one thing it cannot put right is cash already handed
   * over, so whoever was paid is named here by name rather than
   * counted: that money now reads as owed back, and the organizer is
   * the only one who can sort it out. See routes/seasons.py
   * unsettle_season.
   */
  async function unsettleSeason() {
    if (!confirm("確定復原結算？\n退費紀錄以沖銷方式保留。")) return;
    try {
      // postJson marks the pressed control busy and hands back a message
      // already in Chinese — see saveGameEdit on the settings page.
      const result = await postJson(API_BASE, `/seasons/${currentSeason.id}/unsettle`, {});
      const paid = (result && result.already_paid_out) || [];
      loadLedger(currentSeason.id);
      if (paid.length) {
        toast(
          `已復原結算。已退現金：${paid
            .map((p) => `${p.player_name} $${p.amount}`)
            .join("、")}，已改記為應收。`
        );
      } else {
        toast("已復原結算", "good");
      }
    } catch (e) {
      toast(e.message);
    }
  }

  async function settleSeason() {
    if (!confirm("確定結算此季？\n結算後名單與場地費鎖定，剩下的場次不能請假或報名臨打。")) return;
    const btn = document.getElementById("settle-btn");
    // Read now, from the same figures on screen: the refund each member
    // is about to be credited, plus whatever they already owed or were
    // owed. Anyone not in closingCash simply isn't sent.
    const refundOf = new Map(
      closingPreview.members.map((m) => [m.player_id, Number(m.refund)])
    );
    const cash = [...closingCash.keys()]
      .map((id) => ({
        player_id: id,
        amount: String(-(closingDue(id) + (refundOf.get(id) || 0))),
      }))
      .filter((entry) => entry.amount !== "0");
    try {
      await whileBusy(btn, async () => {
        await postJson(API_BASE, `/seasons/${currentSeason.id}/settle`, { cash });
      });
      closingCash.clear();
      loadLedger(currentSeason.id);
    } catch (e) {
      toast("結算失敗：" + e.message);
      btn.disabled = false;
      btn.textContent = "結算此季";
    }
  }
</script>
</body>
</html>
