<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolleyFlow 球隊管理 · 帳務</title>
<link rel="preconnect" href="https://volleyflow.onrender.com" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  .tab[hidden] { display: none; }
  .m-act input, .m-act .confirm-partial { display: none; }
  .m-act.partial input, .m-act.partial .confirm-partial { display: block; }
  .m-act.partial .paid, .m-act.partial .later { display: none; }
  .settle-hint { font-size: .78rem; color: var(--ink-soft); margin: 10px 0 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap wide">
  <div class="app-bar">
    <span class="app-bar-left">
      <button type="button" class="back-btn" onclick="location.href='member.html'">‹ 會員頁</button>
    </span>
    <button type="button" class="brand" onclick="location.href='member.html'">VolleyFlow</button>
    <span class="app-bar-right">
      <button type="button" class="avatar" id="avatar-btn" title="個人資料">?</button>
    </span>
  </div>

  <nav class="context-switch">
    <a href="member.html">會員</a>
    <a href="organizer.html" class="on">管理</a>
  </nav>

  <nav class="org-nav">
    <a href="organizer.html" class="org-nav-link">總覽</a>
    <a href="organizer-members.html" class="org-nav-link">名單</a>
    <a href="organizer-ledger.html" class="org-nav-link active">帳務</a>
    <a href="organizer-settings.html" class="org-nav-link">設定</a>
  </nav>

  <select id="club-picker" class="season-picker club-picker" hidden></select>
  <select id="season-picker" class="season-picker" hidden></select>
  <div id="error"></div>

  <div id="no-season"></div>

  <div class="seg" id="ledger-tabs" hidden>
    <span class="on" data-tab="fee">季費</span>
    <span data-tab="dropin">當天臨打</span>
    <span data-tab="closing">季末結算</span>
  </div>

  <div id="tab-fee" class="tab" hidden>
    <div class="balance">
      <span class="balance-label">季費已收</span>
      <span id="fee-collected" class="balance-value"></span>
    </div>
    <div class="progress"><i id="fee-progress" style="width:0%"></i></div>
    <p id="fee-hint" class="hint"></p>
    <div class="section-label" id="fee-share-label"></div>
    <div id="fee-list" class="money"></div>
  </div>

  <div id="tab-dropin" class="tab" hidden>
    <select id="dropin-game-picker" class="season-picker" style="margin-bottom: 12px"></select>
    <div id="dropin-list" class="money"></div>
  </div>

  <div id="tab-closing" class="tab" hidden>
    <div id="closing-before">
      <p class="hint">結算會計算每個人這一季的請假退費，寫進帳本，並鎖住這一季的名單與場地費。結算後不能重複結算。</p>
      <div class="section-label">本季退費</div>
      <div id="closing-preview" class="money"></div>
      <button type="button" class="btn btn-primary" id="settle-btn" onclick="settleSeason()">結算此季</button>
    </div>
    <div id="closing-after" hidden>
      <div class="balance" style="margin-bottom: 14px">
        <span class="balance-label">已結算</span>
        <span id="closing-settled-at" class="balance-value even"></span>
      </div>
      <div class="section-label">尚未結清的餘額</div>
      <div id="closing-list" class="money"></div>
      <p id="closing-all-clear" class="empty" hidden>大家都已經結清了</p>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
  // localhost -> the local API, anywhere else -> production. See apiBase.
  const API_BASE = apiBase();
  const LIFF_ID = "2011156233-6CouG6VI";
  let currentSeason = null;

  const identityReady = (async function initIdentity() {
    const identified = await initLiffIdentity(API_BASE, LIFF_ID);
    if (identified) {
      document.getElementById("avatar-btn").textContent = identified.name.slice(0, 1);
    }
    return identified;
  })();
  document.getElementById("avatar-btn").addEventListener("click", () => {
    location.href = "profile.html";
  });

  document.getElementById("ledger-tabs").addEventListener("click", (e) => {
    const tab = e.target.closest("[data-tab]");
    if (!tab) return;
    showTab(tab.dataset.tab);
  });

  function showTab(name) {
    document.querySelectorAll("#ledger-tabs [data-tab]").forEach((t) => {
      t.classList.toggle("on", t.dataset.tab === name);
    });
    document.querySelectorAll(".tab").forEach((el) => {
      el.hidden = el.id !== `tab-${name}`;
    });
  }
  if (location.hash === "#settle") showTab("closing");

  showPageLoading(document.getElementById("no-season"));
  document.getElementById("ledger-tabs").hidden = true;

  // Every club-scoped read carries the caller's token now, so nothing may
  // fetch before LIFF identity has resolved — otherwise authHeader() is
  // empty and the server correctly says 401.
  identityReady.then((identified) => {
    if (!identified) {
      stopLoadingEscalation();
      document.getElementById("no-season").innerHTML = signInFailureHtml(identified);
      return;
    }
    initClubAndSeasonPickers(
      API_BASE,
      document.getElementById("club-picker"),
      document.getElementById("season-picker"),
      "vf_org_season",
      (id) => {
        stopLoadingEscalation();
        document.getElementById("club-picker").hidden = !currentClubId();
        if (id) {
          // The tabs stay hidden until loadLedger has the numbers.
          // Revealing them here put an empty 季費已收 card on screen for
          // the length of the fetch, which reads as broken, not busy.
          document.getElementById("season-picker").hidden = false;
          loadLedger(id);
        } else {
          setHasSeason(false);
        }
      },
      (e) => showPageError(document.getElementById("no-season"), e.message),
      // Only the clubs this person actually organizes — see
      // initClubAndSeasonPickers. A club they merely belong to used to
      // appear here and open a management screen they cannot use.
      (c) => c.role === "organizer"
    );
  });

  /** The three tabs are meaningless without a season — there are no fees
   * to collect and nothing to settle — so hide them entirely rather than
   * showing three empty money screens. */
  function setHasSeason(hasSeason) {
    // #tab-fee starts hidden in the markup too, or its 季費已收 heading
    // and its empty white bar sit under the spinner while the numbers
    // are still on their way.
    document.getElementById("ledger-tabs").hidden = !hasSeason;
    document.getElementById("season-picker").hidden = !hasSeason;
    document.querySelectorAll(".tab").forEach((el) => {
      if (!hasSeason) el.hidden = true;
    });
    document.getElementById("no-season").innerHTML = hasSeason
      ? ""
      : emptyStateHtml(
          "這個球隊還沒有開季",
          "季費、當天臨打和季末結算都是跟著一季走的。建立第一季之後，每個人的應收金額就會出現在這裡。",
          { label: "建立第一季", href: "organizer-settings.html" }
        );
    if (hasSeason) showTab(location.hash === "#settle" ? "closing" : "fee");
  }

  const ledgerLoad = staleGuard();

  async function loadLedger(seasonId) {
    // Two of these run on nearly every page load — see staleGuard — and
    // whichever finishes last wins. Without the ticket the loser can be
    // the older one, repainting money figures from before the last
    // write.
    const ticket = ledgerLoad.take();
    const errorEl = document.getElementById("error");
    errorEl.textContent = "";
    try {
      const res = await fetch(`${API_BASE}/seasons/${seasonId}`, {
        headers: authHeader(),
      });
      if (!ledgerLoad.current(ticket)) return;
      if (!res.ok) {
        document.getElementById("no-season").innerHTML = "";
        errorEl.textContent = "找不到這一季";
        return;
      }
      const season = await res.json();
      if (!ledgerLoad.current(ticket)) return;
      currentSeason = season;
      // Started before the balances rather than after them: the two
      // don't depend on each other, and running them back to back made
      // this page wait out two round trips where one would do.
      const settlementReady = fetchSettlement(season);
      await loadBalances(currentSeason);
      if (!ledgerLoad.current(ticket)) return;
      settlementPreview = await settlementReady;
      if (!ledgerLoad.current(ticket)) return;
      await Promise.all([renderFeeTab(), renderDropInTab(), renderClosingTab()]);
      if (!ledgerLoad.current(ticket)) return;
      setHasSeason(true);
    } catch (e) {
      if (!ledgerLoad.current(ticket)) return;
      document.getElementById("no-season").innerHTML = "";
      errorEl.textContent = "連不上伺服器：" + e.message;
    }
  }

  // --- shared helpers -----------------------------------------------

  /** Everyone's balance in one request. This used to be one request per
   * member — around forty on a page load for a normal club, against a
   * browser that opens six connections at a time, which is why this
   * screen crawled. Cached on `balances` so switching tabs doesn't
   * re-ask. */
  let balances = {};

  let settlementPreview = { members: [] };

  /** What settling right now would refund. Fetched alongside the
   * balances, not after them. */
  async function fetchSettlement(season) {
    if (season.settled_at !== null) return { members: [] };
    try {
      const res = await fetch(`${API_BASE}/seasons/${season.id}/settlement`, {
        headers: authHeader(),
      });
      return res.ok ? await res.json() : { members: [] };
    } catch (e) {
      return { members: [] };
    }
  }

  async function loadBalances(season) {
    try {
      await getJsonSWR(
        `${API_BASE}/clubs/${currentClubId()}/balances?season_id=${season.id}`,
        (rows) => applyBalances(rows),
        { headers: authHeader() }
      );
    } catch (e) {
      applyBalances([]);
    }
  }

  /** Kept apart from the fetch above so the rows every money figure is
   * derived from can be set directly, without a network stub. */
  function applyBalances(rows) {
    balances = {};
    for (const row of rows) balances[row.player_id] = row;
  }

  /** The zero row for someone with no ledger entries at all — a member
   * added moments ago, a drop-in who hasn't been charged yet. */
  function balanceOf(playerId) {
    return (
      balances[playerId] || {
        player_id: playerId,
        balance: "0",
        season_total: "0",
        season_fee_charged: "0",
        brought_by: null,
      }
    );
  }

  /** This season's own entries vs. everything else on the player's club
   * ledger — the "本季季費" / "上季餘額" breakdown the fee and closing
   * tabs both show, computed from data already on hand instead of a
   * dedicated endpoint. */
  function splitLedger(row) {
    const balance = Number(row.balance);
    const seasonTotal = Number(row.season_total);
    return { seasonTotal, otherTotal: balance - seasonTotal, balance };
  }

  function moneyRowHtml(playerId, name, gender, split, extraBreakLabel, extraBreakValue) {
    const netCls = split.balance === 0 ? "clear" : split.balance > 0 ? "owed" : "owe";
    const netText = split.balance === 0 ? "已結清" : split.balance > 0 ? `應退 $${split.balance}` : `應收 $${Math.abs(split.balance)}`;
    const breakParts = [];
    if (extraBreakLabel) breakParts.push(`<span>${extraBreakLabel} <b>$${extraBreakValue}</b></span>`);
    if (split.otherTotal !== 0) {
      breakParts.push(`<span>上季餘額 <b>${split.otherTotal > 0 ? "+" : "−"}$${Math.abs(split.otherTotal)}</b></span>`);
    }

    let actionHtml = "";
    if (split.balance < 0) {
      const owe = Math.abs(split.balance);
      actionHtml = `
        <div class="m-act">
          <button type="button" class="paid" onclick="recordFullPayment(this, ${playerId}, ${owe})">已收</button>
          <button type="button" class="later" onclick="showPartialInput(this)">部分收款</button>
          <input type="number" placeholder="金額">
          <button type="button" class="confirm-partial" onclick="recordPartialPayment(this, ${playerId})">確認</button>
        </div>
      `;
    } else if (split.balance > 0) {
      actionHtml = `
        <div class="m-keep">
          <span>保留於餘額</span>
          <button type="button" class="mini-action" onclick="recordCashRefund(${playerId}, ${split.balance})">退款</button>
        </div>
      `;
    } else {
      actionHtml = '<div class="m-done">✓ 已結清</div>';
    }

    // The one place this is ever shown. A guest's fee sits on their own
    // ledger, but they have no account and pay nothing — the member who
    // brought them hands over the cash — so without this the row says
    // "小明 應收 $235" with no way to know who to ask. Kept off the
    // roster, where it would be noise rather than an answer.
    const brought = balanceOf(playerId).brought_by;
    const broughtTag = brought
      ? `<span class="m-brought">${escapeHtml(brought)} 帶</span>`
      : "";

    return `
      <div class="m-row">
        <div class="m-top">
          <span class="avatar sm">${escapeHtml((name || "?").slice(0, 1))}</span>
          <span class="m-name">${escapeHtml(name)}${genderTag(gender)}${broughtTag}</span>
          <span class="m-net ${netCls}">${netText}</span>
        </div>
        ${breakParts.length ? `<div class="m-break">${breakParts.join("")}</div>` : ""}
        ${actionHtml}
      </div>
    `;
  }


  // Scoped to the clicked button's own row (via closest), not a
  // page-wide id lookup — the same player can legitimately have a row
  // in more than one tab at once (a fixed member who also signed up as
  // a drop-in), and a global "[data-x=playerId]" selector would always
  // hit whichever tab's row comes first in the DOM, even a hidden one.
  function showPartialInput(btn) {
    btn.closest(".m-act").classList.add("partial");
  }

  async function recordFullPayment(btn, playerId, amount) {
    await submitPayment(playerId, amount);
  }

  async function recordPartialPayment(btn, playerId) {
    const input = btn.closest(".m-act").querySelector("input");
    const amount = input.value.trim();
    if (!amount) {
      toast("請先填金額");
      input.focus();
      return;
    }
    if (!(Number(amount) > 0)) {
      toast("金額要大於 0");
      input.focus();
      return;
    }
    await submitPayment(playerId, amount);
  }

  async function recordCashRefund(playerId, amount) {
    if (!confirm(`確定要記錄退款 $${amount} 嗎？`)) return;
    await submitPayment(playerId, -amount);
  }

  /**
   * Records money, and shows it as recorded straight away.
   *
   * Two separate problems are being handled here. The tap used to wait
   * on a write and then a full reload of the page's data before
   * anything moved, which on a phone is a long, silent second or more.
   * And a tap that times out invites a second tap, which on money means
   * recording it twice — so each intended payment carries a token, and
   * the server returns the entry it already has rather than adding
   * another. Retrying is therefore always safe.
   */
  async function submitPayment(playerId, amount) {
    const token = `${currentSeason.id}-${playerId}-${amount}-${Date.now()}`;
    const row = balanceOf(playerId);
    const before = { ...row };
    balances[playerId] = {
      ...row,
      balance: String(Number(row.balance) + Number(amount)),
      season_total: String(Number(row.season_total) + Number(amount)),
    };
    renderTabsFromBalances();

    try {
      await postJson(API_BASE, `/clubs/${currentClubId()}/players/${playerId}/payments`, {
        amount: String(amount),
        season_id: currentSeason.id,
        note: "帳務頁記錄",
        client_token: token,
      });
      const ticket = ledgerLoad.take();
      const optimistic = JSON.stringify(balances);
      await loadBalances(currentSeason);
      if (!ledgerLoad.current(ticket)) return;
      // Only repaint if the server disagreed with what's already on
      // screen — which after a payment it normally doesn't. Rebuilding
      // three tabs' worth of identical markup costs a frame and reads as
      // the stutter that made a working tap feel broken.
      if (JSON.stringify(balances) !== optimistic) renderTabsFromBalances();
    } catch (e) {
      balances[playerId] = before;
      renderTabsFromBalances();
      toast("記錄失敗：" + e.message);
    }
  }

  /** Redraws the three tabs from the balances already in hand — no
   * network, so the screen keeps up with a tap. */
  function renderTabsFromBalances() {
    renderFeeTab();
    renderDropInList();
    renderClosingTab();
  }

  // --- 季費 tab --------------------------------------------------------

  function renderFeeTab() {
    const season = currentSeason;

    let collected = 0;
    let total = 0;
    const rowsHtml = season.members
      .map((member) => {
        const split = splitLedger(balanceOf(member.id));
        const feeCharged = -Number(balanceOf(member.id).season_fee_charged);
        total += feeCharged;
        // How much of *this season's* fee is paid — driven only by
        // entries tagged to this season, never by a carried balance
        // from another season, which is a separate pool of money that
        // just happens to also net into the row's headline balance.
        const outstanding = Math.max(0, -split.seasonTotal);
        collected += feeCharged - outstanding;
        return moneyRowHtml(member.id, member.name, member.gender, split, "本季季費", feeCharged);
      })
      .join("");

    document.getElementById("fee-list").innerHTML =
      rowsHtml || '<div class="empty">這一季還沒有固定成員</div>';
    document.getElementById("fee-collected").textContent = `$${Math.round(collected)} / $${Math.round(total)}`;
    document.getElementById("fee-progress").style.width = total > 0 ? `${Math.min(100, (collected / total) * 100)}%` : "0%";
    const unpaidCount = season.members.filter(
      (m) => Number(balanceOf(m.id).balance) < 0
    ).length;
    document.getElementById("fee-hint").textContent =
      unpaidCount === 0
        ? "全部已收"
        : `${season.members.length - unpaidCount} 人已收・${unpaidCount} 人未收・季費於開季前收款`;
    // Summed per game, not share x count: a cooled night costs more, so
    // those two stopped being the same number.
    const games = seasonBillableGames(season);
    document.getElementById("fee-share-label").textContent =
      `每人 $${seasonFeeFor(season)} · ${games} 場`;
  }

  function seasonBillableGames(season) {
    return season.games.filter((g) => g.status !== "cancelled_refunded").length;
  }

  // --- 當天臨打 tab -----------------------------------------------------

  function renderDropInGamePicker() {
    const picker = document.getElementById("dropin-game-picker");
    const today = new Date().toISOString().slice(0, 10);
    const nearest = currentSeason.games.find((g) => g.date >= today) || currentSeason.games[currentSeason.games.length - 1];
    picker.innerHTML = currentSeason.games
      .map((g) => `<option value="${g.id}">${describeDate(g.date).label}（臨打 ${g.confirmed_drop_ins.length} 人）</option>`)
      .join("");
    if (nearest) picker.value = nearest.id;
    picker.onchange = renderDropInList;
  }

  async function renderDropInTab() {
    renderDropInGamePicker();
    await renderDropInList();
  }

  async function renderDropInList() {
    const gameId = Number(document.getElementById("dropin-game-picker").value);
    const game = currentSeason.games.find((g) => g.id === gameId);
    const list = document.getElementById("dropin-list");
    if (!game || game.confirmed_drop_ins.length === 0) {
      list.innerHTML = '<div class="empty">這一場沒有臨打</div>';
      return;
    }
    list.innerHTML = game.confirmed_drop_ins
      .map((d) =>
        moneyRowHtml(
          d.player_id,
          d.player_name,
          d.gender,
          splitLedger(balanceOf(d.player_id)),
          null,
          null
        )
      )
      .join("");
  }

  // --- 季末結算 tab -----------------------------------------------------

  async function renderClosingTab() {
    const season = currentSeason;
    const settled = season.settled_at !== null;
    document.getElementById("closing-before").hidden = settled;
    document.getElementById("closing-after").hidden = !settled;

    if (!settled) {
      const refunded = settlementPreview.members.filter((m) => Number(m.refund) > 0);
      document.getElementById("closing-preview").innerHTML = refunded.length
        ? refunded
            .map(
              (m) => `
                <div class="m-row">
                  <div class="m-top">
                    <span class="avatar sm">${escapeHtml((m.player_name || "?").slice(0, 1))}</span>
                    <span class="m-name">${escapeHtml(m.player_name)}</span>
                    <span class="m-net owed">退費 $${m.refund}</span>
                  </div>
                </div>
              `
            )
            .join("")
        : '<div class="empty">這一季沒有需要退費的請假</div>';
      return;
    }

    document.getElementById("closing-settled-at").textContent = season.settled_at.slice(0, 16).replace("T", " ");
    const unsettled = season.members.filter(
      (m) => Number(balanceOf(m.id).balance) !== 0
    );
    document.getElementById("closing-all-clear").hidden = unsettled.length > 0;
    document.getElementById("closing-list").innerHTML = unsettled
      .map((m) =>
        moneyRowHtml(m.id, m.name, m.gender, splitLedger(balanceOf(m.id)), null, null)
      )
      .join("");
  }

  async function settleSeason() {
    if (!confirm("確定要結算這一季嗎？結算後會鎖住名單與場地費，且無法重複結算。")) return;
    const btn = document.getElementById("settle-btn");
    try {
      await withButtonFeedback(btn, "結算中...", async () => {
        await postJson(API_BASE, `/seasons/${currentSeason.id}/settle`, {});
      });
      loadLedger(currentSeason.id);
    } catch (e) {
      toast("結算失敗：" + e.message);
      btn.disabled = false;
      btn.textContent = "結算此季";
    }
  }
</script>
</body>
</html>
