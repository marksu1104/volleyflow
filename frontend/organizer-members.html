<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolleyFlow 球隊管理 · 名單</title>
<link rel="preconnect" href="https://volleyflow.onrender.com" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  .member-list { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; }
  .member-row {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 12px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
  }
  .settled-note { font-size: .82rem; color: var(--ink-soft); padding: 16px 0; }
  .row-actions { display: flex; align-items: center; gap: 8px; }
  .mini-gender { display: inline-flex; gap: 3px; }
  .mini-gender button {
    border: 1px solid var(--rule); background: var(--surface); color: var(--ink-faint);
    font-size: .74rem; padding: 4px 9px; border-radius: 7px; cursor: pointer;
  }
  .mini-gender button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .request-tree { margin: 0 0 0 8px; padding: 10px; border-radius: 12px; background: var(--surface-2); }
  .request-tree.empty { padding-block: 9px; }
  .request-empty { color: var(--ink-faint); font-size: .74rem; }
  .request-group { padding: 0; }
  .request-group + .request-group { margin-top: 13px; }
  .request-title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 6px; margin-bottom: 5px; }
  .request-title strong { color: var(--ink-soft); font-size: .74rem; letter-spacing: .02em; }
  .request-title strong small { margin-left: 5px; color: var(--ink-faint); font-size: .74rem; font-weight: 500; letter-spacing: 0; }
  .request-title span { color: var(--ink-faint); font-size: .74rem; }
  .members-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .members-section-head .section-label { margin-bottom: 0; }
  .roster-edit {
    display: inline-flex; flex: none; min-height: 32px; padding: 6px 10px; align-items: center;
    gap: 5px; border: 1px solid var(--rule-strong); border-radius: 8px; background: var(--surface);
    color: var(--accent); font-size: .74rem; font-weight: 700; cursor: pointer;
  }
  .roster-edit[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .roster-groups { margin-top: 11px; padding: 10px; border-radius: 12px; background: var(--surface-2); }
  .roster-subsection-label { color: var(--ink-soft); font-size: .74rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .roster-subsection-label span { margin-left: 3px; color: var(--ink-faint); font-weight: 500; letter-spacing: 0; text-transform: none; }
  #pool-section { margin-top: 13px; }
  #pool-section .hint { margin: 4px 0 7px; }
  #pool-section .btn { margin-top: 11px; }
  .guest-sheet .hint { margin: 0 0 14px; }
  .guest-sheet .picker-manual { margin-top: 12px; }
  .guest-sheet .btn-row { margin-top: 14px; }
  .roster-write-state { display: inline-flex; width: 32px; height: 32px; align-items: center; justify-content: center; flex: none; }
</style>
</head>
<body>
<div class="wrap wide" id="members-page" data-picker-loading-root>
  <div class="app-bar">
    <span class="app-bar-left">
      <button type="button" class="back-btn" onclick="location.href='member.html'">‹ 會員頁</button>
    </span>
    <button type="button" class="brand" onclick="location.href='member.html'">VolleyFlow</button>
    <span class="app-bar-right">
      <button type="button" class="avatar" id="avatar-btn" title="個人資料">?</button>
    </span>
  </div>

  <nav class="context-switch">
    <a href="member.html">會員</a>
    <a href="organizer.html" class="on">管理</a>
  </nav>

  <nav class="org-nav">
    <a href="organizer.html" class="org-nav-link">總覽</a>
    <a href="organizer-members.html" class="org-nav-link active">名單</a>
    <a href="organizer-ledger.html" class="org-nav-link">帳務</a>
    <a href="organizer-settings.html" class="org-nav-link">設定</a>
  </nav>

  <div class="picker-row picker-row-labeled">
    <div id="club-picker-field" class="picker-field" hidden>
      <label for="club-picker">球隊</label>
      <select id="club-picker" class="season-picker club-picker" hidden></select>
    </div>
    <div id="season-picker-field" class="picker-field" hidden>
      <label for="season-picker">季別</label>
      <span class="picker-control">
        <select id="season-picker" class="season-picker" hidden></select>
        <i class="spinner sm picker-spinner" aria-hidden="true"></i>
      </span>
    </div>
  </div>
  <div id="error"></div>

  <div id="members-loader" class="page-state" role="status" aria-live="polite">
    <i class="spinner" aria-hidden="true"></i>
    <p id="members-loader-text">載入中…</p>
  </div>

  <div id="members-content" hidden>

  <!-- Back at the top, 2026-09-18. It was moved to the bottom the day
       before on the reasoning that a link you copy once a month should
       not lead the page — approved from a mockup, then reversed after a
       week of the real screen: 「加入連結我覺得還是放在最上面好像還是比較
       好比較順眼」. Using a thing beats looking at a picture of it. -->
  <div id="join-link-section" hidden>
    <div class="section-label">加入連結</div>
    <p class="hint">複製連結以分享給你的隊友加入隊伍。</p>
    <div id="join-link-body"></div>
  </div>

  <div id="settled-note" class="settled-note" hidden>
    這一季已經結算，成員名單不能再變動。
  </div>

  <div id="no-season"></div>

  <div id="requests-section" hidden>
    <div class="section-label">待核准 <span id="requests-count"></span></div>
    <div id="requests-list"></div>
  </div>

  <!-- 本季固定成員 is what the organizer opens this page to read, so it
       leads once nobody is waiting. Everyone else collapses behind a
       toggle, since most weeks there is nothing to do with them. -->
  <div id="roster-section" hidden>
    <div class="members-section-head">
      <div class="section-label">本季名單</div>
      <button type="button" id="roster-edit" class="roster-edit" aria-pressed="false" hidden>✎ 更正名單</button>
    </div>
    <p id="warn-note" class="hint" style="color: var(--warn)">
      更正會追溯整季，並改變該成員的季費。
    </p>
    <p id="roster-hint" class="hint">
      本季固定成員依整季計費；單場是否參加請在場次中設定。
    </p>

    <div class="roster-groups">
      <div class="roster-subsection">
        <div class="roster-subsection-label">固定成員 <span id="roster-count"></span></div>
        <div id="member-list" class="member-list"></div>
      </div>

      <div id="pool-section" hidden>
        <button type="button" class="collapse-toggle" id="pool-toggle" aria-expanded="false" aria-controls="pool-content">
          <span class="chev">▾</span> 其他成員 <span class="collapse-count" id="pool-count"></span>
        </button>
        <div id="pool-content" hidden>
          <p class="hint">在球隊裡，但不在本季固定名單上。</p>
          <div id="pool-list" class="member-list"></div>
          <button type="button" id="guest-button" class="btn btn-quiet" onclick="openGuestDialog()">＋ 新增訪客</button>
        </div>
      </div>
    </div>
  </div>

  <div id="dup-section" hidden>
    <div class="section-label">重複的名字</div>
    <p class="hint" style="margin-top:0">
      同一個人被輸入了不只一次。合併後，報名、請假和帳務都會算在同一個人身上。
    </p>
    <div id="dup-list" class="member-list"></div>
  </div>

  </div>
</div>

<div id="guest-backdrop" class="gsheet-backdrop" hidden>
  <section class="gsheet guest-sheet" role="dialog" aria-modal="true" aria-labelledby="guest-dialog-title">
    <button type="button" class="gsheet-close" aria-label="關閉" onclick="closeGuestDialog()">✕</button>
    <h3 id="guest-dialog-title">新增訪客</h3>
    <p class="hint">新增後只會加入球隊；需要固定出席時，再加入本季名單。</p>
    <div class="picker-manual">
      <input id="new-member-name" type="text" placeholder="輸入姓名" autocomplete="off">
      <select id="new-member-gender" aria-label="性別">
        <option value="">性別</option>
        <option value="male">男</option>
        <option value="female">女</option>
      </select>
    </div>
    <div class="btn-row">
      <button type="button" class="btn btn-quiet" onclick="closeGuestDialog()">取消</button>
      <button type="button" class="btn btn-primary" onclick="addGuest(this)">新增</button>
    </div>
  </section>
</div>

<script src="shared.js"></script>
<script>
  // localhost -> the local API, anywhere else -> production. See apiBase.
  const API_BASE = apiBase();
  const LIFF_ID = "2011156233-6CouG6VI";
  let currentSeason = null;

  const identityReady = (async function initIdentity() {
    const identified = await initLiffIdentity(API_BASE, LIFF_ID);
    if (identified) {
      document.getElementById("avatar-btn").textContent = identified.name.slice(0, 1);
    }
    return identified;
  })();
  document.getElementById("avatar-btn").addEventListener("click", () => {
    location.href = "profile.html";
  });

  let selectedContext = null;
  let loaderTimer = null;
  let rosterEditing = false;
  let movingPlayerId = null;
  let movingPlayerTimer = null;
  const rosterWrites = new Set();

  function setMembersLoading(loading) {
    const loader = document.getElementById("members-loader");
    const content = document.getElementById("members-content");
    const text = document.getElementById("members-loader-text");
    clearTimeout(loaderTimer);
    loaderTimer = null;
    loader.hidden = !loading;
    content.hidden = loading;
    if (!loading) return;
    text.textContent = "載入中…";
    loaderTimer = setTimeout(() => {
      text.textContent = "資料較多，仍在載入…";
    }, 4000);
  }

  function showMembersError(message) {
    setMembersLoading(false);
    document.getElementById("members-content").hidden = false;
    document.getElementById("join-link-section").hidden = true;
    document.getElementById("requests-section").hidden = true;
    document.getElementById("roster-section").hidden = true;
    document.getElementById("dup-section").hidden = true;
    showPageError(document.getElementById("no-season"), message);
  }

  async function readPageJson(path) {
    const response = await fetch(`${API_BASE}${path}`, {
      headers: authHeader(),
      cache: "no-store",
    });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) {
      if (identityLapsed(response.status, body.detail)) {
        restartLineSession(response.status === 401);
      }
      throw new Error(translateApiError(body.detail || response.statusText));
    }
    return body;
  }

  // The data below the pickers intentionally arrives as one page, rather
  // than as several independent sections with their own loading spinners.
  identityReady.then((identified) => {
    if (!identified) {
      setMembersLoading(false);
      document.getElementById("members-content").hidden = false;
      document.getElementById("no-season").innerHTML = signInFailureHtml(identified);
      return;
    }
    initClubAndSeasonPickers(
      API_BASE,
      document.getElementById("club-picker"),
      document.getElementById("season-picker"),
      "vf_org_season",
      (seasonId) => {
        const clubId = currentClubId();
        const context = `${clubId || "none"}:${seasonId || "none"}`;
        // Cached picker data is followed by a fresh copy. If it retained
        // the same selection, do not flash the already-current page.
        if (context === selectedContext) return;
        selectedContext = context;
        rosterEditing = false;
        const hasClub = !!clubId;
        document.getElementById("club-picker-field").hidden = !hasClub;
        document.getElementById("club-picker").hidden = !hasClub;
        document.getElementById("season-picker-field").hidden = !seasonId;
        document.getElementById("season-picker").hidden = !seasonId;
        loadPage(seasonId);
      },
      (error) => showMembersError(error.message),
      (club) => club.role === "organizer"
    );
  });

  function renderJoinLink(invite) {
    const section = document.getElementById("join-link-section");
    const body = document.getElementById("join-link-body");
    if (!invite) {
      body.innerHTML = "";
      section.hidden = true;
      return;
    }
    const url = `https://liff.line.me/${LIFF_ID}?invite=${invite.token}`;
    section.hidden = false;
    body.innerHTML =
      `<div class="link-box"><code id="join-link">${escapeHtml(url)}</code>` +
      '<button type="button" onclick="copyJoinLink()">複製</button></div>';
  }

  // A club switch first has to replace the season picker. Hide the old
  // club's roster at the start of that wait, rather than briefly letting
  // yesterday's selection look like it belongs to the newly chosen club.
  document.getElementById("club-picker").addEventListener("change", () => {
    rosterEditing = false;
    setMembersLoading(true);
  });

  function copyJoinLink() {
    const text = document.getElementById("join-link").textContent;
    if (!text) return;
    navigator.clipboard
      .writeText(text)
      .then(() => toast("已複製連結", "good"))
      .catch(() => toast("複製失敗，請手動選取文字"));
  }

  let joinRequests = [];
  let allClubMembers = [];
  let currentPool = [];
  const pageLoad = staleGuard();

  async function loadPage(seasonId) {
    const clubId = currentClubId();
    const ticket = pageLoad.take();
    document.getElementById("error").textContent = "";
    setPoolExpanded(false);
    setMembersLoading(true);
    try {
      if (!clubId) {
        if (!pageLoad.current(ticket)) return;
        currentSeason = null;
        currentPool = [];
        allClubMembers = [];
        joinRequests = [];
        renderJoinLink(null);
        document.getElementById("requests-section").hidden = true;
        document.getElementById("roster-section").hidden = true;
        document.getElementById("dup-section").hidden = true;
        document.getElementById("no-season").innerHTML = noClubYetHtml();
        setMembersLoading(false);
        return;
      }

      const requests = readPageJson(`/clubs/${clubId}/members?include=pending`);
      const invite = readPageJson(`/clubs/${clubId}/invite`);
      const season = seasonId ? readPageJson(`/seasons/${seasonId}`) : Promise.resolve(null);
      const pool = seasonId
        ? readPageJson(`/seasons/${seasonId}/join-pool`)
        : Promise.resolve([]);
      const [clubMembers, inviteData, seasonData, poolData] = await Promise.all([
        requests,
        invite,
        season,
        pool,
      ]);
      if (!pageLoad.current(ticket) || currentClubId() !== String(clubId)) return;

      allClubMembers = clubMembers.filter((member) => member.status === "active");
      joinRequests = clubMembers.filter((member) => member.status === "pending");
      currentSeason = seasonData;
      currentPool = poolData;
      document.getElementById("no-season").innerHTML = seasonData
        ? ""
        : emptyStateHtml(
            "這個球隊尚未開季",
            "固定成員名單是跟著一季走的。可以先分享加入連結，開季後再建立本季名單。",
            { label: "建立第一季", href: "organizer-settings.html" }
          );
      renderJoinLink(inviteData);
      renderRequests();
      document.getElementById("roster-section").hidden = !seasonData;
      if (seasonData) {
        renderMembers(seasonData);
        renderJoinPool();
        renderDuplicates();
      } else {
        document.getElementById("dup-section").hidden = true;
      }
      setMembersLoading(false);
    } catch (error) {
      if (!pageLoad.current(ticket)) return;
      showMembersError(error.message || "暫時無法載入資料");
    }
  }

  function reloadCurrentPage() {
    rosterEditing = false;
    loadPage(currentSeason ? currentSeason.id : null);
  }

  function requestGroups() {
    return [
      {
        rows: joinRequests.filter((person) => person.wants_fixed_membership === true),
        title: "申請固定成員",
        detail: "核准後加入本季名單並計入季費",
      },
      {
        rows: joinRequests.filter((person) => person.wants_fixed_membership === false),
        title: "申請臨打成員",
        detail: "核准後只加入球隊",
      },
      {
        rows: joinRequests.filter((person) => person.wants_fixed_membership == null),
        title: "申請加入球隊",
        detail: "尚未指定加入方式",
      },
    ].filter((group) => group.rows.length > 0);
  }

  function requestRowHtml(person) {
    return `
      <div class="pool-row">
        <span class="pool-who">
          <span class="avatar sm">${escapeHtml((person.name || "?").slice(0, 1))}</span>
          <span>${escapeHtml(person.name)}${genderTag(person.gender)}</span>
        </span>
        <button type="button" class="mini-action" onclick="approveRequest(${person.id}, true, this)">固定</button>
        <button type="button" class="mini-action" onclick="approveRequest(${person.id}, false, this)">臨打</button>
        <button type="button" class="icon-btn remove" title="拒絕" aria-label="拒絕 ${escapeHtml(person.name)}" onclick="declineRequest(${person.id})">−</button>
      </div>`;
  }

  function renderRequests() {
    const section = document.getElementById("requests-section");
    const count = document.getElementById("requests-count");
    const list = document.getElementById("requests-list");
    section.hidden = false;
    count.textContent = `${joinRequests.length} 人`;
    if (joinRequests.length === 0) {
      list.innerHTML = '<div class="request-tree empty"><span class="request-empty">目前沒有待核准的申請</span></div>';
      return;
    }
    const groups = requestGroups();
    list.innerHTML = `<div class="request-tree">${groups
      .map(
        (group) => `
          <section class="request-group">
            <div class="request-title"><strong>${group.title}<small>${group.rows.length} 人</small></strong><span>${group.detail}</span></div>
            <div class="member-list">${group.rows.map(requestRowHtml).join("")}</div>
          </section>`
      )
      .join("")}</div>`;
  }

  async function approveRequest(playerId, asFixed, btn) {
    const person = joinRequests.find((p) => p.id === playerId);
    if (!person) return;
    const originalName = person.name.replace(/ \(\d+\)$/, "");
    const accountlessMatches = allClubMembers.filter(
      (member) => member.id !== person.id && member.status === "active" && !member.linked &&
        (member.name === person.name || member.name === originalName)
    );
    // Never join identities by name automatically: two real people can
    // share one. Here the organizer knows who requested access, so offer an
    // explicit reconciliation before approving a second copy.
    if (accountlessMatches.length === 1) {
      const existing = accountlessMatches[0];
      if (confirm(`球隊名單已有「${existing.name}」。\n\n這個 LINE 帳號就是同一位成員嗎？確認後會沿用原有名單與帳務。`)) {
        const done = markBusy(btn);
        try {
          await postJson(
            API_BASE,
            `/clubs/${currentClubId()}/players/${existing.id}/link`,
            { line_player_id: person.id }
          );
          toast(`已將 ${existing.name} 的 LINE 帳號連結到原有名單`, "good");
          reloadCurrentPage();
        } catch (e) {
          done();
          toast("連結失敗：" + e.message);
        }
        return;
      }
      if (existing.name === person.name) {
        toast("兩位成員目前同名。請先請申請者在個人資料使用可辨識的名稱，再重新核准。");
        return;
      }
    }
    const toRoster = asFixed && currentSeason && currentSeason.settled_at === null;
    if (
      toRoster &&
      seasonHasStarted(currentSeason) &&
      !confirm(`把「${person.name}」加入本季固定名單後，會為他記入完整本季季費。確定要繼續嗎？`)
    ) {
      return;
    }
    const done = markBusy(btn);
    try {
      await postJson(API_BASE, `/clubs/${currentClubId()}/members/${playerId}/approve`, {
        as_fixed: asFixed,
      });
    } catch (e) {
      done();
      toast("核准失敗：" + e.message);
      return;
    }
    if (toRoster) {
      const attempt = () =>
        postJson(API_BASE, `/seasons/${currentSeason.id}/members`, { player_name: person.name });
      try {
        await attempt();
        toast(`已核准，${person.name} 加入本季固定名單`, "good");
      } catch (e) {
        await offerToRaiseCapacity(e, attempt);
      }
    } else {
      toast(`已核准 ${person.name}`, "good");
    }
    reloadCurrentPage();
  }

  async function declineRequest(playerId) {
    const person = joinRequests.find((p) => p.id === playerId);
    if (!person || !confirm(`確定要拒絕「${person.name}」加入球隊嗎？`)) return;
    try {
      await deleteJson(API_BASE, `/clubs/${currentClubId()}/members/${playerId}`);
      toast("已拒絕", "good");
    } catch (e) {
      toast("拒絕失敗：" + e.message);
    }
    reloadCurrentPage();
  }

  function renderDuplicates() {
    const section = document.getElementById("dup-section");
    if (!currentSeason) {
      section.hidden = true;
      return;
    }
    // Pending requests are reconciled by approveRequest. Merging one here
    // would move the existing roster onto a membership that is still pending.
    const activeMembers = allClubMembers.filter((m) => m.status === "active");
    const exactNames = new Set(activeMembers.map((m) => m.name.trim()));
    const byName = new Map();
    for (const m of activeMembers) {
      const name = m.name.trim();
      const numbered = name.match(/^(.*) \((\d+)\)$/);
      // Older versions added a global "(2)" suffix before the person had
      // even joined a club. Treat that as the original name only when the
      // unsuffixed row actually exists here; merging still requires the
      // organizer's confirmation below.
      const key = numbered && exactNames.has(numbered[1]) ? numbered[1] : name;
      byName.set(key, [...(byName.get(key) || []), m]);
    }
    const groups = [...byName.values()].filter((g) => g.length > 1);
    section.hidden = groups.length === 0;
    if (section.hidden) return;
    document.getElementById("dup-list").innerHTML = groups
      .map((g) => {
        const keep = keeperOf(g);
        const mergeable = g.filter((m) => m !== keep && !m.linked);
        const action =
          mergeable.length === g.length - 1
            ? `<button type="button" class="mini-action" onclick="mergeDuplicates(${keep.id}, [${mergeable.map((m) => m.id).join(",")}])">合併</button>`
            : '<span class="hint">不只一個有 LINE 帳號，無法合併</span>';
        return `
          <div class="pool-row">
            <span class="pool-who">
              <span class="avatar sm">${escapeHtml(g[0].name.slice(0, 1))}</span>
              <span>${escapeHtml(g[0].name)} ×${g.length}</span>
            </span>
            ${action}
          </div>`;
      })
      .join("");
  }

  // Kept: whoever has LINE, else whoever is on this season's roster, else the oldest.
  function keeperOf(group) {
    const onRoster = new Set(currentSeason.members.map((m) => m.id));
    return (
      group.find((m) => m.linked) ||
      group.find((m) => onRoster.has(m.id)) ||
      group.reduce((a, b) => (a.id < b.id ? a : b))
    );
  }

  async function mergeDuplicates(keepId, duplicateIds) {
    const keep = allClubMembers.find((m) => m.id === keepId);
    const question = `把 ${duplicateIds.length + 1} 個「${keep.name}」合併成一個人嗎？\n\n報名、請假和帳務都會算在同一個人身上，合併後無法分開。`;
    if (!confirm(question)) return;
    try {
      for (const id of duplicateIds) {
        await postJson(API_BASE, `/clubs/${currentClubId()}/players/${keepId}/merge`, {
          duplicate_id: id,
        });
      }
      toast("已合併", "good");
    } catch (e) {
      toast("合併失敗：" + e.message);
    }
    reloadCurrentPage();
  }


  // avatar_url is a plain <img src>, not interpolated as markup, so it
  // doesn't need escaping the way name does — but the name (and gender
  // label) do, since a LINE display name is attacker-supplied once
  // anyone can land in this pool via the join link.
  function poolRowHtml(p) {
    const controls = rosterWrites.has(p.id)
      ? '<span class="roster-write-state"><i class="spinner sm" aria-label="儲存中"></i></span>'
      : canEditRoster()
      ? `
        <button type="button" class="icon-btn add" title="加入本季固定名單" aria-label="加入本季固定名單" onclick="promoteFromPool(${p.id})">＋</button>
        <button type="button" class="icon-btn remove" title="移出球隊" aria-label="移出球隊" onclick="removeFromClub(${p.id})">−</button>`
      : "";
    return `
      <div class="pool-row${movingPlayerId === p.id ? " roster-row-entering" : ""}" data-player-id="${p.id}">
        <span class="pool-who">
          ${p.avatar_url
            ? `<img class="avatar sm" src="${escapeHtml(p.avatar_url)}" alt="">`
            : `<span class="avatar sm">${escapeHtml((p.name || "?").slice(0, 1))}</span>`}
          <span>${escapeHtml(p.name)}${genderTag(p.gender)}${guestTag(p)}</span>
        </span>
        ${controls}
      </div>
    `;
  }

  function renderJoinPool() {
    const poolSection = document.getElementById("pool-section");
    const list = document.getElementById("pool-list");
    const others = currentPool || [];
    // Before the first game, and while correcting an open season, retain
    // an empty "其他成員" group so there is an honest place to add a visitor.
    // In ordinary read-only mode an empty group adds no useful information.
    poolSection.hidden = !currentSeason || currentSeason.settled_at !== null ||
      (others.length === 0 && !canEditRoster());
    if (poolSection.hidden) return;
    document.getElementById("pool-count").textContent = `(${others.length})`;
    list.innerHTML = others.length ? others.map(poolRowHtml).join("") : '<div class="empty">尚無其他成員</div>';
    document.getElementById("guest-button").hidden = !canEditRoster();
  }

  const poolToggle = document.getElementById("pool-toggle");
  poolToggle.addEventListener("click", () => {
    setPoolExpanded(poolToggle.getAttribute("aria-expanded") !== "true");
  });

  function setPoolExpanded(expanded) {
    document.getElementById("pool-content").hidden = !expanded;
    poolToggle.setAttribute("aria-expanded", String(expanded));
  }

  /** Keep roster corrections in the current view. The server remains the
   * source of truth, but a successful write already returns enough data to
   * move the affected row without replacing the whole page and closing edit
   * mode. A later page visit still fetches a fresh copy as usual. */
  function renderRosterLists(enteringId = null) {
    movingPlayerId = enteringId;
    renderMembers(currentSeason);
    renderJoinPool();
    renderDuplicates();
    if (rosterEditing) setPoolExpanded(true);
    clearTimeout(movingPlayerTimer);
    if (enteringId === null) return;
    movingPlayerTimer = setTimeout(() => {
      movingPlayerId = null;
      document.querySelectorAll(".roster-row-entering").forEach((row) => {
        row.classList.remove("roster-row-entering");
      });
    }, 220);
  }

  function addToRosterLocally(member) {
    currentSeason.members = [
      ...currentSeason.members.filter((person) => person.id !== member.id),
      member,
    ];
    currentPool = currentPool.filter((person) => person.id !== member.id);
    renderRosterLists(member.id);
  }

  function returnToPoolLocally(member) {
    currentSeason.members = currentSeason.members.filter((person) => person.id !== member.id);
    if (!currentPool.some((person) => person.id === member.id)) {
      currentPool = [...currentPool, member];
    }
    renderRosterLists(member.id);
  }

  function addGuestToPoolLocally(member) {
    currentPool = [
      ...currentPool.filter((person) => person.id !== member.id),
      member,
    ];
    allClubMembers = [
      ...allClubMembers.filter((person) => person.id !== member.id),
      { ...member, role: "member", status: "active" },
    ];
    renderRosterLists(member.id);
  }

  async function promoteFromPool(playerId) {
    const player = currentPool.find((p) => p.id === playerId);
    if (!player || !canEditRoster() || rosterWrites.has(playerId)) return;
    if (
      seasonHasStarted(currentSeason) &&
      !confirm(
        `把「${player.name}」加入本季固定名單後，會為他記入完整本季季費。確定要更正嗎？`
      )
    ) {
      return;
    }
    rosterWrites.add(playerId);
    addToRosterLocally(player);
    bumpLocalRevision();
    try {
      const added = await enqueueRequest(() => postJson(
        API_BASE,
        `/seasons/${currentSeason.id}/members`,
        { player_name: player.name }
      ));
      currentSeason.members = currentSeason.members.map((member) =>
        member.id === playerId ? added : member
      );
      rosterWrites.delete(playerId);
      renderRosterLists();
      const displaced = added.displaced_drop_ins || [];
      const moved = displaced.map((dropIn) =>
        `${describeDate(dropIn.game_date).label}的 ${dropIn.player_name}`
      );
      toast(
        moved.length
          ? `已將 ${added.name} 加入固定名單；${moved.join("、")}已移至候補`
          : `已將 ${added.name} 加入本季固定名單`,
        "good"
      );
    } catch (e) {
      currentSeason.members = currentSeason.members.filter((member) => member.id !== playerId);
      if (!currentPool.some((member) => member.id === playerId)) currentPool = [...currentPool, player];
      rosterWrites.delete(playerId);
      bumpLocalRevision();
      renderRosterLists(playerId);
      toast(e.message);
    }
  }

  /** Someone with no LINE account can't open the app at all: they can't
   * take their own leave, sign themselves up, or set their own gender —
   * the organizer has to do all of it for them. Worth saying on the row,
   * because otherwise it looks like they're just not participating. */
  function guestTag(m) {
    return m.linked ? "" : '<span class="guest-tag">訪客</span>';
  }

  function genderButtons(m) {
    if (m.linked || !canEditRoster()) return "";
    return `
      <span class="mini-gender">
        <button type="button" class="${m.gender === "male" ? "on" : ""}" onclick="setGender(${m.id}, 'male')">男</button>
        <button type="button" class="${m.gender === "female" ? "on" : ""}" onclick="setGender(${m.id}, 'female')">女</button>
      </span>
    `;
  }

  /** Flips the button first and sends afterwards. Waiting on a round
   * trip to redraw a two-state toggle is the difference between a
   * control that feels like a switch and one that feels broken. */
  async function setGender(playerId, gender) {
    if (!canEditRoster()) return;
    const member = (currentSeason.members || []).find((m) => m.id === playerId);
    const previous = member ? member.gender : null;
    // Already set that way: the button is showing the state it sets, so
    // there is nothing to draw and nothing to send. It used to send
    // anyway, which meant tapping 男 on somebody already marked 男 sat
    // silent for half a second and then changed nothing — the one control
    // in the app that tests/visual/feedback.js still caught doing that.
    if (previous === gender) return;
    if (member) member.gender = gender;
    bumpLocalRevision();
    renderMembers(currentSeason);
    try {
      await postJson(API_BASE, `/players/${playerId}/gender`, { gender }, "PUT");
      renderRosterLists();
    } catch (e) {
      if (member) member.gender = previous;
      bumpLocalRevision();
      renderRosterLists();
      toast("設定性別失敗：" + e.message);
    }
  }

  /** "This LINE account is really that person you typed in earlier."
   *
   * When the organizer writes a name into the roster before that person
   * has ever opened the app, and they then log in, the server creates a
   * second row for them on purpose — it will not guess identity from a
   * name, because guessing wrong would hand someone else's ledger to a
   * stranger. So the roster entry stays marked 訪客 and a duplicate sits
   * in the pool. This is the organizer making that call by hand.
   */
  async function linkToRosterEntry(linePlayerId) {
    const guests = (currentSeason.members || []).filter((m) => !m.linked);
    if (guests.length === 0) {
      toast("本季名單上沒有標示訪客的人可以對應。");
      return;
    }
    const options = guests.map((m, i) => (i + 1) + ". " + m.name).join("\n");
    const choice = prompt("這個 LINE 帳號其實是名單上的誰？輸入編號：\n\n" + options);
    if (!choice) return;
    const picked = guests[Number(choice) - 1];
    if (!picked) {
      toast("沒有這個編號");
      return;
    }
    if (!confirm(`確定「${picked.name}」就是這個 LINE 帳號嗎？

合併後這個人的帳務紀錄會保留，之後他就能自己請假和報名。`)) {
      return;
    }
    try {
      await postJson(API_BASE, `/clubs/${currentClubId()}/players/${picked.id}/link`, {
        line_player_id: linePlayerId,
      });
      reloadCurrentPage();
    } catch (e) {
      toast("合併失敗：" + e.message);
    }
  }

  async function removeFromClub(playerId) {
    const member = currentPool.find((person) => person.id === playerId);
    if (!member || !canEditRoster() || rosterWrites.has(playerId)) return;
    const name = member.name;
    if (!confirm(`要把「${name}」移出球隊嗎？

他們之後可以再用邀請連結加入。`)) return;
    rosterWrites.add(playerId);
    currentPool = currentPool.filter((person) => person.id !== playerId);
    allClubMembers = allClubMembers.filter((person) => person.id !== playerId);
    bumpLocalRevision();
    renderRosterLists();
    try {
      await enqueueRequest(() => deleteJson(
        API_BASE,
        `/clubs/${currentClubId()}/members/${playerId}`
      ));
      rosterWrites.delete(playerId);
      renderRosterLists();
      toast(`已將 ${name} 移出球隊`, "good");
    } catch (e) {
      if (!currentPool.some((person) => person.id === playerId)) currentPool = [...currentPool, member];
      if (!allClubMembers.some((person) => person.id === playerId)) allClubMembers = [...allClubMembers, member];
      rosterWrites.delete(playerId);
      bumpLocalRevision();
      renderRosterLists(playerId);
      toast("移出球隊失敗：" + e.message);
    }
  }


  function canEditRoster() {
    return !!currentSeason && currentSeason.settled_at === null &&
      (!seasonHasStarted(currentSeason) || rosterEditing);
  }

  function renderMembers(season) {
    const settled = season.settled_at !== null;
    const started = seasonHasStarted(season);
    const editButton = document.getElementById("roster-edit");
    document.getElementById("settled-note").hidden = !settled;
    editButton.hidden = settled || !started;
    editButton.setAttribute("aria-pressed", String(rosterEditing));
    editButton.textContent = rosterEditing ? "完成" : "✎ 更正名單";
    document.getElementById("warn-note").hidden = !started || !rosterEditing || settled;
    document.getElementById("roster-hint").textContent =
      "本季固定成員依整季計費；單場是否參加請在場次中設定。";
    document.getElementById("roster-count").textContent = `${season.members.length} 人`;

    const list = document.getElementById("member-list");
    if (season.members.length === 0) {
      list.innerHTML = '<div class="empty">尚無固定成員</div>';
      return;
    }
    list.innerHTML = season.members
      .map(
        (member) => {
          const actions = rosterWrites.has(member.id)
            ? '<span class="roster-write-state"><i class="spinner sm" aria-label="儲存中"></i></span>'
            : `${genderButtons(member)}
               ${canEditRoster() ? `<button type="button" class="icon-btn remove" title="從本季固定名單移除" aria-label="從本季固定名單移除 ${escapeHtml(member.name)}" onclick="removeMember(${member.id})">−</button>` : ""}`;
          return `
          <div class="member-row${movingPlayerId === member.id ? " roster-row-entering" : ""}" data-player-id="${member.id}">
            <span>${escapeHtml(member.name)}${genderTag(member.gender)}${guestTag(member)}</span>
            <span class="row-actions">
              ${actions}
            </span>
          </div>
        `;
        }
      )
      .join("");
  }

  document.getElementById("roster-edit").addEventListener("click", () => {
    rosterEditing = !rosterEditing;
    if (rosterEditing) setPoolExpanded(true);
    else setPoolExpanded(false);
    renderMembers(currentSeason);
    renderJoinPool();
  });

  function openGuestDialog() {
    if (!canEditRoster()) return;
    const input = document.getElementById("new-member-name");
    input.value = "";
    document.getElementById("new-member-gender").value = "";
    document.getElementById("guest-backdrop").hidden = false;
    input.focus();
  }

  function closeGuestDialog() {
    document.getElementById("guest-backdrop").hidden = true;
  }

  document.getElementById("guest-backdrop").addEventListener("click", (event) => {
    if (event.target === event.currentTarget) closeGuestDialog();
  });

  async function addGuest() {
    if (!canEditRoster()) return;
    const input = document.getElementById("new-member-name");
    const genderInput = document.getElementById("new-member-gender");
    const name = input.value.trim();
    // Checked here rather than left to the server: an empty name got a
    // 400 back, which reaches the reader as nothing at all happening.
    if (!name) {
      toast("請先輸入訪客的名字");
      input.focus();
      return;
    }
    try {
      const added = await postJson(API_BASE, `/clubs/${currentClubId()}/guests`, {
        name,
        gender: genderInput.value || null,
      });
      input.value = "";
      genderInput.value = "";
      closeGuestDialog();
      addGuestToPoolLocally(added);
      toast(`已將 ${added.name} 加入其他成員`, "good");
    } catch (e) {
      toast("新增訪客失敗：" + e.message);
    }
  }

  async function removeMember(playerId) {
    const member = currentSeason.members.find((m) => m.id === playerId);
    if (!member || !canEditRoster() || rosterWrites.has(playerId)) return;
    if (
      seasonHasStarted(currentSeason) &&
      !confirm(
        `把「${member.name}」從本季固定名單移除後，會沖銷他的本季季費。確定要更正嗎？`
      )
    ) {
      return;
    }
    rosterWrites.add(playerId);
    returnToPoolLocally(member);
    bumpLocalRevision();
    try {
      await enqueueRequest(() => deleteJson(
        API_BASE,
        `/seasons/${currentSeason.id}/members/${playerId}`
      ));
      rosterWrites.delete(playerId);
      renderRosterLists();
      toast(`已將 ${member.name} 移回其他成員`, "good");
    } catch (e) {
      currentPool = currentPool.filter((person) => person.id !== playerId);
      if (!currentSeason.members.some((person) => person.id === playerId)) {
        currentSeason.members = [...currentSeason.members, member];
      }
      rosterWrites.delete(playerId);
      bumpLocalRevision();
      renderRosterLists(playerId);
      toast("移除失敗：" + e.message);
    }
  }
</script>
</body>
</html>
