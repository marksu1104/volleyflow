<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolleyFlow 球隊管理 · 名單</title>
<link rel="preconnect" href="https://volleyflow.onrender.com" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap">
<link rel="stylesheet" href="css/shared.css">
<style>
  .member-list { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; }
  .member-row {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 12px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
  }
  .settled-note { font-size: .82rem; color: var(--ink-soft); padding: 16px 0; }
  .row-actions { display: flex; align-items: center; gap: 8px; }
  .mini-gender { display: inline-flex; gap: 3px; }
  .mini-gender button {
    border: 1px solid var(--rule); background: var(--surface); color: var(--ink-faint);
    font-size: .74rem; padding: 4px 9px; border-radius: 7px; cursor: pointer;
  }
  .mini-gender button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .request-tree { margin: 0 0 0 8px; padding: 10px; border-radius: 12px; background: var(--surface-2); }
  .request-tree.empty { padding-block: 9px; }
  .request-empty { color: var(--ink-faint); font-size: .74rem; }
  .request-group { padding: 0; }
  .request-group + .request-group { margin-top: 13px; }
  .request-title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 6px; margin-bottom: 5px; }
  .request-title strong { color: var(--ink-soft); font-size: .74rem; letter-spacing: .02em; }
  .request-title strong small { margin-left: 5px; color: var(--ink-faint); font-size: .74rem; font-weight: 500; letter-spacing: 0; }
  .request-title span { color: var(--ink-faint); font-size: .74rem; }
  .members-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .members-section-head .section-label { margin-bottom: 0; }
  .roster-edit {
    display: inline-flex; flex: none; min-height: 32px; padding: 6px 10px; align-items: center;
    gap: 5px; border: 1px solid var(--rule-strong); border-radius: 8px; background: var(--surface);
    color: var(--accent); font-size: .74rem; font-weight: 700; cursor: pointer;
  }
  .roster-edit[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .roster-groups { margin-top: 11px; padding: 10px; border-radius: 12px; background: var(--surface-2); }
  .roster-subsection-label { color: var(--ink-soft); font-size: .74rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .roster-subsection-label span { margin-left: 3px; color: var(--ink-faint); font-weight: 500; letter-spacing: 0; text-transform: none; }
  #pool-section { margin-top: 13px; }
  #pool-section .hint { margin: 4px 0 7px; }
  #pool-section .btn { margin-top: 11px; }
  .guest-sheet .hint { margin: 0 0 14px; }
  .guest-sheet .picker-manual { margin-top: 12px; }
  .guest-sheet .btn-row { margin-top: 14px; }
  .roster-write-state { display: inline-flex; width: 32px; height: 32px; align-items: center; justify-content: center; flex: none; }
</style>
</head>
<body>
<div class="wrap wide" id="members-page" data-picker-loading-root>
  <div class="app-bar">
    <span class="app-bar-left">
      <button type="button" id="club-chip" class="club-chip">
        <i class="club-dot" id="club-dot">-</i><span id="club-chip-name" class="club-chip-name">選擇球隊</span><span class="caret">▾</span>
      </button>
      <select id="club-picker" class="club-picker" hidden aria-hidden="true" tabindex="-1"></select>
    </span>
    <button type="button" class="brand" onclick="location.href='member.html'">VolleyFlow</button>
    <span class="app-bar-right">
      <button type="button" class="avatar" id="avatar-btn" title="個人資料">?</button>
    </span>
  </div>

  <nav class="context-switch">
    <a href="member.html">會員</a>
    <a href="organizer.html" class="on">管理</a>
  </nav>

  <nav class="org-nav">
    <a href="organizer.html" class="org-nav-link">總覽</a>
    <a href="organizer-members.html" class="org-nav-link active">名單</a>
    <a href="organizer-ledger.html" class="org-nav-link">帳務</a>
    <a href="organizer-settings.html" class="org-nav-link">設定</a>
  </nav>

  <div class="picker-row picker-row-labeled">
    <div id="season-picker-field" class="picker-field" hidden>
      <label for="season-picker">季別</label>
      <span class="picker-control">
        <select id="season-picker" class="season-picker" hidden></select>
        <i class="spinner sm picker-spinner" aria-hidden="true"></i>
      </span>
    </div>
  </div>
  <div id="error"></div>

  <div id="members-loader" class="page-state" role="status" aria-live="polite">
    <i class="spinner" aria-hidden="true"></i>
    <p id="members-loader-text">載入中…</p>
  </div>

  <div id="members-content" hidden>

  <!-- The join link leads the page: it is how a club gets its members. -->
  <div id="join-link-section" hidden>
    <div class="section-label">加入連結</div>
    <p class="hint">分享此連結，邀請隊友加入球隊。</p>
    <div id="join-link-body"></div>
  </div>

  <div id="settled-note" class="settled-note" hidden>
    本季已結算，成員名單無法再變更。
  </div>

  <div id="no-season"></div>

  <div id="requests-section" hidden>
    <div class="section-label">待核准 <span id="requests-count"></span></div>
    <div id="requests-list"></div>
  </div>

  <!-- 本季固定成員 is what the organizer opens this page to read, so it
       leads once nobody is waiting. Everyone else collapses behind a
       toggle, since most weeks there is nothing to do with them. -->
  <div id="roster-section" hidden>
    <div class="members-section-head">
      <div class="section-label">本季名單</div>
      <button type="button" id="roster-edit" class="roster-edit" aria-pressed="false" hidden>✎ 更正名單</button>
    </div>
    <p id="warn-note" class="hint" style="color: var(--warn)">
      更正會追溯整季，並改變該成員的季費。
    </p>
    <p id="roster-hint" class="hint">
      本季固定成員依整季計費；單場是否參加請在場次中設定。
    </p>

    <div class="roster-groups">
      <div class="roster-subsection">
        <div class="roster-subsection-label">固定成員 <span id="roster-count"></span></div>
        <div id="member-list" class="member-list"></div>
      </div>

      <div id="pool-section" hidden>
        <button type="button" class="collapse-toggle" id="pool-toggle" aria-expanded="false" aria-controls="pool-content">
          <span class="chev">▾</span> 其他成員 <span class="collapse-count" id="pool-count"></span>
        </button>
        <div id="pool-content" hidden>
          <p class="hint">在球隊裡，但不在本季固定名單上。</p>
          <div id="pool-list" class="member-list"></div>
          <button type="button" id="guest-button" class="btn btn-quiet" onclick="openGuestDialog()">＋ 新增訪客</button>
        </div>
      </div>
    </div>
  </div>

  <div id="dup-section" hidden>
    <div class="section-label">重複的名字</div>
    <p class="hint" style="margin-top:0">
      同一個人被輸入了不只一次。合併後，報名、請假和帳務都會算在同一個人身上。
    </p>
    <div id="dup-list" class="member-list"></div>
  </div>

  </div>
</div>

<div id="guest-backdrop" class="gsheet-backdrop" hidden>
  <section class="gsheet guest-sheet" role="dialog" aria-modal="true" aria-labelledby="guest-dialog-title">
    <button type="button" class="gsheet-close" aria-label="關閉" onclick="closeGuestDialog()">✕</button>
    <h3 id="guest-dialog-title">新增訪客</h3>
    <p class="hint">新增後只會加入球隊；需要固定出席時，再加入本季名單。</p>
    <div class="picker-manual">
      <input id="new-member-name" type="text" placeholder="輸入姓名" autocomplete="off">
      <select id="new-member-gender" aria-label="性別">
        <option value="">性別</option>
        <option value="male">男</option>
        <option value="female">女</option>
      </select>
    </div>
    <div class="btn-row">
      <button type="button" class="btn btn-quiet" onclick="closeGuestDialog()">取消</button>
      <button type="button" class="btn btn-primary" onclick="addGuest(this)">新增</button>
    </div>
  </section>
</div>

<script src="js/common/format.js"></script>
<script src="js/common/api.js"></script>
<script src="js/common/errors.js"></script>
<script src="js/common/feedback.js"></script>
<script src="js/common/clubs.js"></script>
<script src="js/common/season.js"></script>
<script src="js/common/game-sheet.js"></script>
<script src="js/pages/organizer-members.js"></script>
</body>
</html>
