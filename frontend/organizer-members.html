<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolleyFlow 球隊管理 · 名單</title>
<link rel="preconnect" href="https://volleyflow.onrender.com" crossorigin>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  .add-member-row { display: flex; gap: 6px; margin: 12px 0; }
  .add-member-row[hidden] { display: none; }
  .add-member-row input { flex: 1; }
  .add-member-row button {
    padding: 0 16px; border: none; border-radius: 9px; background: var(--accent); color: var(--surface);
    font-size: .86rem; font-weight: 700; cursor: pointer; white-space: nowrap; font-family: var(--font-cjk);
  }
  .member-list { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; }
  .member-row {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 12px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
  }
  .member-remove {
    border: none; background: var(--bad-soft); color: var(--bad); font-size: .78rem;
    font-weight: 700; padding: 5px 10px; border-radius: 7px; cursor: pointer;
  }
  .settled-note { font-size: .82rem; color: var(--ink-soft); padding: 16px 0; }
  .row-actions { display: flex; align-items: center; gap: 8px; }
  .mini-gender { display: inline-flex; gap: 3px; }
  .mini-gender button {
    border: 1px solid var(--rule); background: var(--surface); color: var(--ink-faint);
    font-size: .74rem; padding: 4px 9px; border-radius: 7px; cursor: pointer;
  }
  .mini-gender button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .link-btn {
    border: none; background: var(--accent-soft); color: var(--accent); font-size: .76rem;
    font-weight: 700; padding: 6px 11px; border-radius: 8px; cursor: pointer; white-space: nowrap;
  }
  .waiting-tag {
    font-size: .68rem; font-weight: 700; padding: 2px 7px; border-radius: 999px;
    background: var(--warn-soft); color: var(--warn); margin-left: 6px; white-space: nowrap;
  }
  .guest-tag {
    font-size: .68rem; font-weight: 700; padding: 2px 7px; border-radius: 999px;
    background: var(--surface-2); color: var(--ink-faint); margin-left: 6px; white-space: nowrap;
  }
</style>
</head>
<body>
<div class="wrap wide">
  <div class="app-bar">
    <span class="app-bar-left">
      <button type="button" class="back-btn" onclick="location.href='member.html'">‹ 會員頁</button>
    </span>
    <button type="button" class="brand" onclick="location.href='member.html'">VolleyFlow</button>
    <span class="app-bar-right">
      <button type="button" class="avatar" id="avatar-btn" title="個人資料">?</button>
    </span>
  </div>

  <nav class="context-switch">
    <a href="member.html">會員</a>
    <a href="organizer.html" class="on">管理</a>
  </nav>

  <nav class="org-nav">
    <a href="organizer.html" class="org-nav-link">總覽</a>
    <a href="organizer-members.html" class="org-nav-link active">名單</a>
    <a href="organizer-ledger.html" class="org-nav-link">帳務</a>
    <a href="organizer-settings.html" class="org-nav-link">設定</a>
  </nav>

  <select id="club-picker" class="season-picker club-picker" hidden></select>
  <select id="season-picker" class="season-picker" hidden></select>
  <div id="error"></div>

  <div class="section-label">加入連結</div>
  <div class="link-box">
    <code id="join-link"></code>
    <button type="button" onclick="copyJoinLink()">複製</button>
  </div>
  <p class="hint">用 LINE 開啟這個連結，會自動選到這個球隊並提示加入。</p>

  <div id="settled-note" class="settled-note" hidden>
    這一季已經結算，成員名單不能再變動。
  </div>

  <div id="pool-section" hidden>
    <div class="section-label">球隊成員・未加入本季</div>
    <div id="pool-list" class="member-list"></div>
  </div>

  <div id="no-season"></div>

  <div id="guest-section">
    <div class="section-label">新增訪客</div>
    <p class="hint" style="margin-top:0">
      沒有 LINE、或不想自己操作的人。他們沒辦法自己請假或報名，都要由你代為處理。
      加進來之後一樣算本季固定成員，季費照算。
    </p>
    <div class="add-member-row">
      <input id="new-member-name" class="control" type="text" placeholder="訪客姓名">
      <select id="new-member-gender" class="control" style="flex:0 0 84px">
        <option value="">性別</option>
        <option value="male">男</option>
        <option value="female">女</option>
      </select>
      <button type="button" onclick="addGuest()">新增</button>
    </div>
  </div>

  <div id="roster-section">
    <div class="section-label">本季固定成員</div>
    <p id="warn-note" class="hint" style="color: var(--warn)">
      新增或移除成員會重新計算整季每人每場的金額，包含已經打過的場次。
    </p>
    <p class="hint">
      用 LINE 加入過的人從上面的「球隊成員」挑，他們可以自己請假；沒有帳號的人用上面的「新增訪客」。
      只來單場的人不必加進這裡，在該場次直接新增臨打即可。
    </p>

    <div id="member-list" class="member-list"></div>
  </div>
</div>

<script src="shared.js"></script>
<script>
  const API_BASE = "https://volleyflow.onrender.com";
  const LIFF_ID = "2011156233-6CouG6VI";
  let currentSeason = null;

  const identityReady = (async function initIdentity() {
    const identified = await initLiffIdentity(API_BASE, LIFF_ID);
    if (identified) {
      document.getElementById("avatar-btn").textContent = identified.name.slice(0, 1);
    }
    return identified;
  })();
  document.getElementById("avatar-btn").addEventListener("click", () => {
    location.href = "profile.html";
  });

  showPageLoading(document.getElementById("no-season"));
  document.getElementById("roster-section").hidden = true;

  // Every club-scoped read carries the caller's token now, so nothing may
  // fetch before LIFF identity has resolved — otherwise authHeader() is
  // empty and the server correctly says 401.
  identityReady.then((identified) => {
    if (!identified) {
      stopLoadingEscalation();
      document.getElementById("no-season").innerHTML = emptyStateHtml(
        "請用 LINE 開啟",
        "名單和帳務只有球隊成員看得到，所以需要先用 LINE 登入。請從 LINE 裡的連結開啟這一頁。"
      );
      return;
    }
    initClubAndSeasonPickers(
      API_BASE,
      document.getElementById("club-picker"),
      document.getElementById("season-picker"),
      "vf_org_season",
      (id) => {
      stopLoadingEscalation();
      document.getElementById("club-picker").hidden = !currentClubId();
      renderJoinLink();
      // The join link stays useful with no season (people can join the club
      // and wait in the pool), so only the season roster half is swapped
      // out for the empty state here.
      document.getElementById("roster-section").hidden = !id;
      document.getElementById("guest-section").hidden = !id;
      document.getElementById("season-picker").hidden = !id;
      document.getElementById("no-season").innerHTML = id
        ? ""
        : emptyStateHtml(
            "這個球隊還沒有開季",
            "固定成員名單是跟著一季走的。可以先把上面的連結分享出去讓大家加入球隊，等開季時再從待加入名單挑人。",
            { label: "建立第一季", href: "organizer-settings.html" }
          );
        if (id) loadMembers(id);
      },
      (e) => showPageError(document.getElementById("no-season"), e.message)
    );
  });

  function renderJoinLink() {
    const clubId = currentClubId();
    document.getElementById("join-link").textContent = clubId
      ? `https://liff.line.me/${LIFF_ID}?club=${clubId}`
      : "";
  }

  function copyJoinLink() {
    const text = document.getElementById("join-link").textContent;
    if (!text) return;
    navigator.clipboard
      .writeText(text)
      .then(() => alert("已複製連結"))
      .catch(() => alert("複製失敗，請手動選取文字"));
  }

  async function loadMembers(seasonId) {
    const errorEl = document.getElementById("error");
    errorEl.textContent = "";
    try {
      const res = await fetch(`${API_BASE}/seasons/${seasonId}`, {
        headers: authHeader(),
      });
      if (!res.ok) {
        errorEl.textContent = "找不到這一季";
        return;
      }
      currentSeason = await res.json();
      renderMembers(currentSeason);
      await loadJoinPool(seasonId);
    } catch (e) {
      errorEl.textContent = "連不上伺服器：" + e.message;
    }
  }

  let currentPool = [];

  async function loadJoinPool(seasonId) {
    const res = await fetch(`${API_BASE}/seasons/${seasonId}/join-pool`, {
      headers: authHeader(),
    });
    currentPool = res.ok ? await res.json() : [];
    renderJoinPool();
  }

  function renderJoinPool() {
    const section = document.getElementById("pool-section");
    if (currentPool.length === 0 || currentSeason.settled_at !== null) {
      section.hidden = true;
      return;
    }
    section.hidden = false;
    // avatar_url is a plain <img src>, not interpolated as markup, so it
    // doesn't need escaping the way name does — but the name (and
    // gender label) do, since a LINE display name is attacker-supplied
    // once anyone can land in this pool via the join link.
    document.getElementById("pool-list").innerHTML = currentPool
      .map(
        (p) => `
          <div class="pool-row">
            <span class="pool-who">
              ${p.avatar_url
                ? `<img class="avatar sm" src="${escapeHtml(p.avatar_url)}" alt="">`
                : `<span class="avatar sm">${escapeHtml((p.name || "?").slice(0, 1))}</span>`}
              <span>${escapeHtml(p.name)}${genderLabel(p.gender)}${guestTag(p)}${waitingTag(p)}</span>
            </span>
            <button type="button" class="pool-promote" onclick="promoteFromPool(${p.id})">加入本季</button>
            ${p.linked ? `<button type="button" class="link-btn" onclick="linkToRosterEntry(${p.id})">已在名單上</button>` : ""}
            <button type="button" class="member-remove" onclick="removeFromClub(${p.id}, '${p.name.replace(/'/g, "\'")}')">移出球隊</button>
          </div>
        `
      )
      .join("");
  }

  async function promoteFromPool(playerId) {
    const player = currentPool.find((p) => p.id === playerId);
    if (!player) return;
    if (
      !confirm(
        `把「${player.name}」加入固定名單會重新計算整季每人每場的金額，包含已經打過的場次，確定要加入嗎？`
      )
    ) {
      return;
    }
    try {
      await postJson(API_BASE, `/seasons/${currentSeason.id}/members`, {
        player_name: player.name,
      });
      loadMembers(currentSeason.id);
    } catch (e) {
      alert("加入失敗：" + e.message);
    }
  }

  /** Someone the organizer typed in by hand has no LINE account, so they
   * can't open the app and set this themselves — and without it the
   * roster's 男/女 count is permanently incomplete. Only offered for
   * those players; anyone with their own login sets it in 個人資料. */
  /** Someone with no LINE account can't open the app at all: they can't
   * take their own leave, sign themselves up, or set their own gender —
   * the organizer has to do all of it for them. Worth saying on the row,
   * because otherwise it looks like they're just not participating. */
  /** Someone who said "I'm a fixed member" and is waiting on you. They
   * can't sign up or take leave until you put them on the roster, so an
   * unanswered request leaves a real person stuck. */
  function waitingTag(m) {
    return m.wants_fixed_membership === true
      ? '<span class="waiting-tag">要求加入本季</span>'
      : "";
  }

  function guestTag(m) {
    return m.linked ? "" : '<span class="guest-tag">訪客</span>';
  }

  function genderButtons(m) {
    if (m.linked) return "";  // has a LINE account -> theirs to set
    return `
      <span class="mini-gender">
        <button type="button" class="${m.gender === "male" ? "on" : ""}" onclick="setGender(${m.id}, 'male')">男</button>
        <button type="button" class="${m.gender === "female" ? "on" : ""}" onclick="setGender(${m.id}, 'female')">女</button>
      </span>
    `;
  }

  /** Flips the button first and sends afterwards. Waiting on a round
   * trip to redraw a two-state toggle is the difference between a
   * control that feels like a switch and one that feels broken. */
  async function setGender(playerId, gender) {
    const member = (currentSeason.members || []).find((m) => m.id === playerId);
    const previous = member ? member.gender : null;
    if (member) member.gender = gender;
    renderMembers(currentSeason);
    try {
      await postJson(API_BASE, `/players/${playerId}/gender`, { gender }, "PUT");
      loadMembers(currentSeason.id);
    } catch (e) {
      if (member) member.gender = previous;
      renderMembers(currentSeason);
      alert("設定性別失敗：" + e.message);
    }
  }

  /** "This LINE account is really that person you typed in earlier."
   *
   * When the organizer writes a name into the roster before that person
   * has ever opened the app, and they then log in, the server creates a
   * second row for them on purpose — it will not guess identity from a
   * name, because guessing wrong would hand someone else's ledger to a
   * stranger. So the roster entry stays marked 訪客 and a duplicate sits
   * in the pool. This is the organizer making that call by hand.
   */
  async function linkToRosterEntry(linePlayerId) {
    const guests = (currentSeason.members || []).filter((m) => !m.linked);
    if (guests.length === 0) {
      alert("本季名單上沒有標示訪客的人可以對應。");
      return;
    }
    const options = guests.map((m, i) => (i + 1) + ". " + m.name).join("\n");
    const choice = prompt("這個 LINE 帳號其實是名單上的誰？輸入編號：\n\n" + options);
    if (!choice) return;
    const picked = guests[Number(choice) - 1];
    if (!picked) {
      alert("沒有這個編號");
      return;
    }
    if (!confirm(`確定「${picked.name}」就是這個 LINE 帳號嗎？

合併後這個人的帳務紀錄會保留，之後他就能自己請假和報名。`)) {
      return;
    }
    try {
      await postJson(API_BASE, `/clubs/${currentClubId()}/players/${picked.id}/link`, {
        line_player_id: linePlayerId,
      });
      loadMembers(currentSeason.id);
    } catch (e) {
      alert("合併失敗：" + e.message);
    }
  }

  async function removeFromClub(playerId, name) {
    if (!confirm(`要把「${name}」移出球隊嗎？

他們之後可以再用邀請連結加入。`)) return;
    try {
      await deleteJson(API_BASE, `/clubs/${currentClubId()}/members/${playerId}`);
      loadMembers(currentSeason.id);
    } catch (e) {
      alert("移出球隊失敗：" + e.message);
    }
  }

  function genderLabel(g) {
    if (g === "male") return '<span class="gender-tag male">男</span>';
    if (g === "female") return '<span class="gender-tag female">女</span>';
    return "";
  }

  function renderMembers(season) {
    const settled = season.settled_at !== null;
    document.getElementById("settled-note").hidden = !settled;
    document.getElementById("guest-section").hidden = settled;
    document.getElementById("warn-note").hidden = settled;

    const list = document.getElementById("member-list");
    if (season.members.length === 0) {
      list.innerHTML = '<div class="empty">還沒有成員</div>';
      return;
    }
    list.innerHTML = season.members
      .map(
        (m) => `
          <div class="member-row">
            <span>${escapeHtml(m.name)}${genderLabel(m.gender)}${guestTag(m)}</span>
            <span class="row-actions">
              ${settled ? "" : genderButtons(m)}
              ${settled ? "" : `<button type="button" class="member-remove" onclick="removeMember(${m.id})">移除</button>`}
            </span>
          </div>
        `
      )
      .join("");
  }


  async function addGuest() {
    const input = document.getElementById("new-member-name");
    const genderSelect = document.getElementById("new-member-gender");
    const name = input.value.trim();
    if (!name) return;
    if (!confirm(`新增「${name}」會重新計算整季每人每場的金額，包含已經打過的場次。要繼續嗎？`)) {
      return;
    }
    try {
      await postJson(API_BASE, `/seasons/${currentSeason.id}/members`, {
        player_name: name,
        gender: genderSelect.value || null,
      });
      input.value = "";
      genderSelect.value = "";
      loadMembers(currentSeason.id);
    } catch (e) {
      alert("新增失敗：" + e.message);
    }
  }

  async function removeMember(playerId) {
    const member = currentSeason.members.find((m) => m.id === playerId);
    if (
      !member ||
      !confirm(
        `移除「${member.name}」會重新計算整季每人每場的金額，包含已經打過的場次，確定要移除嗎？`
      )
    ) {
      return;
    }
    const res = await fetch(
      `${API_BASE}/seasons/${currentSeason.id}/members/${playerId}`,
      { method: "DELETE", headers: authHeader() }
    );
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      alert("移除失敗：" + (data.detail || res.statusText));
      return;
    }
    loadMembers(currentSeason.id);
  }
</script>
</body>
</html>
