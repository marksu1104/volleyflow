<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolleyFlow 球隊管理</title>
<link rel="preconnect" href="https://volleyflow.onrender.com" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap">
<link rel="stylesheet" href="css/shared.css">
</head>
<body>
<div class="wrap wide">
  <div class="app-bar">
    <span class="app-bar-left">
      <button type="button" id="club-chip" class="club-chip">
        <i class="club-dot" id="club-dot">-</i><span id="club-chip-name" class="club-chip-name">選擇球隊</span><span class="caret">▾</span>
      </button>
      <select id="club-picker" class="club-picker" hidden aria-hidden="true" tabindex="-1"></select>
    </span>
    <button type="button" class="brand" onclick="location.href='member.html'">VolleyFlow</button>
    <span class="app-bar-right">
      <button type="button" class="avatar" id="avatar-btn" title="個人資料">?</button>
    </span>
  </div>

  <nav class="context-switch">
    <a href="member.html">會員</a>
    <a href="organizer.html" class="on">管理</a>
  </nav>

  <nav class="org-nav">
    <a href="organizer.html" class="org-nav-link active">總覽</a>
    <a href="organizer-members.html" class="org-nav-link">名單</a>
    <a href="organizer-ledger.html" class="org-nav-link">帳務</a>
    <a href="organizer-settings.html" class="org-nav-link">設定</a>
  </nav>

  <div class="picker-row picker-row-labeled">
    <div id="season-picker-field" class="picker-field" hidden>
      <label for="season-picker">季別</label>
      <span class="picker-control">
        <select id="season-picker" class="season-picker" hidden></select>
        <i class="spinner sm picker-spinner" aria-hidden="true"></i>
      </span>
    </div>
  </div>
  <div id="error"></div>
  <button type="button" class="todo-line" id="todo-line" hidden onclick="openTodos()">
    <i class="todo-dot" id="todo-dot"></i>
    <span class="t-main" id="todo-main"></span>
    <span class="t-more" id="todo-more"></span>
    <span class="t-go">›</span>
  </button>

  <div id="hero-wrap" style="margin-top: 10px" data-season-content></div>

  <div id="month-cal" class="mcal" hidden style="margin-top: 12px" data-season-content></div>

  <div class="section-label" id="meta-label" hidden>本季設定</div>
  <div id="season-meta" data-season-content></div>
</div>

<div id="todo-backdrop" class="gsheet-backdrop" hidden>
  <div class="gsheet">
    <button class="gsheet-close" aria-label="關閉" onclick="closeTodos()">✕</button>
    <h3>待辦</h3>
    <div id="todo-list"></div>
  </div>
</div>

<div id="game-sheet-backdrop" class="gsheet-backdrop" hidden>
  <div class="gsheet">
    <button class="gsheet-close" aria-label="關閉">✕</button>
    <div id="game-detail"></div>
  </div>
</div>

<script src="js/common/format.js"></script>
<script src="js/common/api.js"></script>
<script src="js/common/errors.js"></script>
<script src="js/common/feedback.js"></script>
<script src="js/common/clubs.js"></script>
<script src="js/common/season.js"></script>
<script src="js/common/game-sheet.js"></script>
<script src="js/pages/organizer.js"></script>
</body>
</html>
