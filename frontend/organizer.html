<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolleyFlow 主揪儀表板</title>
<link rel="stylesheet" href="shared.css">
<style>
  .season-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .pill {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 20px;
    padding: 5px 12px; font-size: .78rem; color: var(--ink-soft);
  }
  .pill strong { color: var(--ink); font-weight: 600; }
  .pill.settled { background: var(--good-soft); color: var(--good); border-color: transparent; }

  .tbl-scroll { overflow-x: auto; border-radius: 12px; border: 1px solid var(--rule); }
  table { width: 100%; border-collapse: collapse; background: var(--surface); font-size: .86rem; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  th { font-size: .72rem; color: var(--ink-soft); font-weight: 600; background: var(--paper); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .amt-positive { color: var(--good); }
  .amt-negative { color: var(--bad); }

  .pay-form { display: flex; gap: 4px; align-items: center; }
  .pay-form input { width: 70px; padding: 5px 6px; border: 1px solid var(--rule); border-radius: 6px; font-size: .82rem; }
  .pay-form button {
    padding: 5px 8px; border: none; border-radius: 6px; background: var(--accent-soft);
    color: var(--accent); font-size: .78rem; font-weight: 600; cursor: pointer; white-space: nowrap;
  }

  .settle-row { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  .settle-btn { padding: 10px 18px; border: none; border-radius: 8px; background: var(--ink); color: white; font-size: .88rem; font-weight: 600; cursor: pointer; }
  .settle-btn:disabled { background: var(--rule); color: var(--ink-soft); cursor: default; }
  .settle-note { font-size: .78rem; color: var(--ink-soft); }
  .empty { color: var(--ink-soft); font-size: .85rem; padding: 20px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap wide">
  <h1>主揪儀表板</h1>
  <p class="sub">出席狀況與收支，一頁看完</p>

  <select id="season-picker" class="season-picker"></select>
  <div id="error"></div>
  <div id="season-meta" class="season-meta"></div>

  <div id="glance" class="glance" style="display:none">
    <div class="glance-label">下一場</div>
    <div id="glance-main" class="glance-main"></div>
    <div id="glance-sub" class="glance-sub"></div>
  </div>

  <div id="month-cal" class="mcal"></div>

  <h2>結算與收款</h2>
  <div class="tbl-scroll">
    <table>
      <thead>
        <tr>
          <th>成員</th>
          <th class="num">季費</th>
          <th class="num">退費</th>
          <th class="num">應收 / 應退</th>
          <th class="num">已結算餘額</th>
          <th>記錄收款</th>
        </tr>
      </thead>
      <tbody id="settlement-body"></tbody>
    </table>
  </div>

  <div class="settle-row">
    <span id="settle-note" class="settle-note"></span>
    <button id="settle-btn" class="settle-btn" onclick="settleSeason()">結算此季</button>
  </div>
</div>

<div id="game-sheet-backdrop" class="gsheet-backdrop" hidden>
  <div class="gsheet">
    <button class="gsheet-close" aria-label="關閉">✕</button>
    <div id="game-detail"></div>
  </div>
</div>

<script src="shared.js"></script>
<script>
  const API_BASE = "https://volleyflow.onrender.com";
  let currentSeason = null;
  let selectedGameId = null;

  initSeasonPicker(API_BASE, document.getElementById("season-picker"), "vf_org_season", (id) => {
    if (id) loadDashboard(id);
  });

  async function loadDashboard(seasonId) {
    const errorEl = document.getElementById("error");
    errorEl.textContent = "";
    try {
      const [seasonRes, settlementRes] = await Promise.all([
        fetch(`${API_BASE}/seasons/${seasonId}`),
        fetch(`${API_BASE}/seasons/${seasonId}/settlement`),
      ]);
      if (!seasonRes.ok || !settlementRes.ok) {
        errorEl.textContent = "找不到這一季";
        return;
      }
      const season = await seasonRes.json();
      const settlement = await settlementRes.json();
      const isNewSeason = !currentSeason || currentSeason.id !== season.id;
      currentSeason = season;
      // Keep whatever game was selected across a reload — only reset to
      // the next upcoming game when switching seasons, or on first load.
      if (isNewSeason || !season.games.some((g) => g.id === selectedGameId)) {
        const upcoming = season.games.find((g) => !describeDate(g.date).isPast) || season.games[season.games.length - 1];
        selectedGameId = upcoming ? upcoming.id : null;
      }

      renderMeta(season);
      renderGlance(season);
      renderMonthCalendar(document.getElementById("month-cal"), season.games, selectGame);
      renderSelectedGameDetail();
      await renderSettlement(season, settlement);
    } catch (e) {
      errorEl.textContent = "連不上伺服器：" + e.message;
    }
  }

  function renderMeta(season) {
    const el = document.getElementById("season-meta");
    const settled = season.settled_at !== null;
    const timePill = season.game_start_time && season.game_end_time
      ? `<span class="pill">球局時間 <strong>${season.game_start_time.slice(0, 5)}-${season.game_end_time.slice(0, 5)}</strong></span>`
      : "";
    const locationPill = season.location
      ? `<span class="pill">地點 <strong>${season.location}</strong></span>`
      : "";
    el.innerHTML = `
      <span class="pill">場地費 <strong>$${season.total_venue_cost}</strong></span>
      <span class="pill">人數上限 <strong>${season.capacity}</strong></span>
      <span class="pill">最低人數門檻 <strong>${season.minimum_roster}</strong></span>
      ${timePill}
      ${locationPill}
      <span class="pill ${settled ? "settled" : ""}">${settled ? "已結算" : "尚未結算"}</span>
    `;
    document.getElementById("settle-btn").disabled = settled;
    document.getElementById("settle-note").textContent = settled
      ? `已於 ${season.settled_at.slice(0, 16).replace("T", " ")} 結算`
      : "結算後會把每人季費／退費寫進帳本，且不能重複結算";
  }

  function renderGlance(season) {
    const box = document.getElementById("glance");
    const upcoming = season.games.find((g) => !describeDate(g.date).isPast) || season.games[season.games.length - 1];
    if (!upcoming) { box.style.display = "none"; return; }
    const info = describeDate(upcoming.date);
    document.getElementById("glance-main").textContent = `${info.label}${info.relative ? "・" + info.relative : ""}`;
    const expected = expectedAttendance(season, upcoming);
    document.getElementById("glance-sub").textContent =
      `預計出席 ${expected} 人${upcoming.waitlist_entries.length ? `・候補 ${upcoming.waitlist_entries.length} 人` : ""}` +
      (expected < season.minimum_roster ? "・低於人數門檻" : "");
    box.style.display = "block";
  }

  function selectGame(gameId) {
    selectedGameId = gameId;
    renderSelectedGameDetail();
    openGameSheet();
  }

  function renderSelectedGameDetail() {
    const el = document.getElementById("game-detail");
    const game = currentSeason && currentSeason.games.find((g) => g.id === selectedGameId);
    if (!currentSeason || !game) {
      el.innerHTML = '<div class="empty">這一季還沒有場次</div>';
      return;
    }
    const statusHtml = game.status === "scheduled"
      ? ""
      : `<div class="gdetail-mystatus absent">${statusLabel(game.status)}</div>`;
    renderGameDetail(el, currentSeason, game, {
      extraHtml: statusHtml,
      onAssignSubstitute: (absenceId, name, gender) => assignSubstitute(absenceId, name, gender),
      // No canAssignSubstitute restriction — the organizer can arrange
      // a substitute for anyone's absence, not just their own.
    });
  }

  function openGameSheet() {
    document.getElementById("game-sheet-backdrop").hidden = false;
  }

  function closeGameSheet() {
    document.getElementById("game-sheet-backdrop").hidden = true;
  }

  const gameSheetBackdrop = document.getElementById("game-sheet-backdrop");
  gameSheetBackdrop.addEventListener("click", (e) => {
    if (e.target === gameSheetBackdrop) closeGameSheet();
  });
  document.querySelector(".gsheet-close").addEventListener("click", closeGameSheet);

  async function assignSubstitute(absenceId, name, gender) {
    try {
      await postJson(API_BASE, `/absences/${absenceId}/substitute`, {
        player_name: name,
        gender,
      });
      loadDashboard(currentSeason.id);
    } catch (e) {
      alert("設定代打失敗：" + e.message);
    }
  }

  function statusLabel(status) {
    if (status === "cancelled_unrefunded") return "取消・場地費不退";
    if (status === "cancelled_refunded") return "取消・場地費已退";
    return status;
  }

  async function renderSettlement(season, settlement) {
    const body = document.getElementById("settlement-body");
    const settled = season.settled_at !== null;

    // Every member's ledger is an independent request — fire them all
    // at once instead of awaiting one at a time in the loop. Awaiting
    // sequentially here was the same class of mistake as the N+1 query
    // bug fixed earlier, just moved to the browser: for N members it
    // took N round trips back-to-back instead of one round trip's worth.
    const rows = settlement.members.map((member) => {
      const memberInfo = season.members.find((m) => m.name === member.player_name);
      return { member, playerId: memberInfo ? memberInfo.id : null };
    });
    const ledgers = await Promise.all(
      rows.map(({ playerId }) =>
        settled && playerId
          ? fetch(`${API_BASE}/players/${playerId}/ledger`).then((r) => r.json())
          : Promise.resolve(null)
      )
    );

    body.innerHTML = rows
      .map(({ member, playerId }, i) => {
        const balanceCell = ledgers[i] ? amountSpan(ledgers[i].balance) : "—";
        return `
          <tr>
            <td>${member.player_name}</td>
            <td class="num">$${member.season_fee}</td>
            <td class="num">$${member.refund}</td>
            <td class="num">${amountSpan(member.net)}</td>
            <td class="num">${balanceCell}</td>
            <td>
              ${playerId ? `
                <div class="pay-form">
                  <input type="number" id="pay-${playerId}" placeholder="金額">
                  <button onclick="recordPayment(${playerId}, this)">記收款</button>
                </div>
              ` : "-"}
            </td>
          </tr>
        `;
      })
      .join("");
  }

  function amountSpan(value) {
    const n = Number(value);
    const cls = n >= 0 ? "amt-positive" : "amt-negative";
    return `<span class="${cls}">$${value}</span>`;
  }

  async function settleSeason() {
    if (!currentSeason) return;
    if (!confirm("確定要結算這一季嗎？結算後每人的季費與退費會寫進帳本，且無法重複結算。")) return;
    const btn = document.getElementById("settle-btn");
    let res;
    await withButtonFeedback(btn, "結算中...", async () => {
      res = await fetch(`${API_BASE}/seasons/${currentSeason.id}/settle`, { method: "POST" });
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      alert("結算失敗：" + (data.detail || res.statusText));
      btn.disabled = false;
      btn.textContent = "結算此季";
      return;
    }
    loadDashboard(currentSeason.id);
  }

  async function recordPayment(playerId, btn) {
    const input = document.getElementById(`pay-${playerId}`);
    const amount = input.value.trim();
    if (!amount) return;
    let res;
    await withButtonFeedback(btn, "記錄中...", async () => {
      res = await fetch(`${API_BASE}/players/${playerId}/payments`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          amount,
          season_id: currentSeason ? currentSeason.id : null,
          note: "主揪儀表板手動記錄",
        }),
      });
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      alert("記錄失敗：" + (data.detail || res.statusText));
      return;
    }
    loadDashboard(currentSeason.id);
  }
</script>
</body>
</html>
