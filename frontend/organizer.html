<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolleyFlow 球隊管理</title>
<link rel="preconnect" href="https://volleyflow.onrender.com" crossorigin>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="wrap wide">
  <div class="app-bar">
    <span class="app-bar-left">
      <button type="button" class="back-btn" onclick="location.href='member.html'">‹ 會員頁</button>
    </span>
    <button type="button" class="brand" onclick="location.href='member.html'">VolleyFlow</button>
    <span class="app-bar-right">
      <button type="button" class="avatar" id="avatar-btn" title="個人資料">?</button>
    </span>
  </div>

  <nav class="context-switch">
    <a href="member.html">會員</a>
    <a href="organizer.html" class="on">管理</a>
  </nav>

  <nav class="org-nav">
    <a href="organizer.html" class="org-nav-link active">總覽</a>
    <a href="organizer-members.html" class="org-nav-link">名單</a>
    <a href="organizer-ledger.html" class="org-nav-link">帳務</a>
    <a href="organizer-settings.html" class="org-nav-link">設定</a>
  </nav>

  <select id="club-picker" class="season-picker club-picker" hidden></select>
  <select id="season-picker" class="season-picker" hidden></select>
  <div id="error"></div>
  <div id="season-meta"></div>

  <div id="hero-wrap" style="margin-top: 14px"></div>

  <div class="section-label" id="cal-label" hidden>本季場次</div>
  <div id="month-cal" class="mcal" hidden></div>
</div>

<div id="game-sheet-backdrop" class="gsheet-backdrop" hidden>
  <div class="gsheet">
    <button class="gsheet-close" aria-label="關閉">✕</button>
    <div id="game-detail"></div>
  </div>
</div>

<script src="shared.js"></script>
<script>
  // localhost -> the local API, anywhere else -> production. See apiBase.
  const API_BASE = apiBase();
  const LIFF_ID = "2011156233-6CouG6VI";
  let currentSeason = null;
  let selectedGameId = null;
  let clubMembers = [];
  let myName = "";

  // Every organizer-only action here (settle, edit season settings,
  // manage members) is enforced server-side against this identity —
  // this just resolves it once so postJson's authHeader() has a LIFF
  // session to read from.
  const identityReady = (async function initIdentity() {
    const identified = await initLiffIdentity(API_BASE, LIFF_ID);
    if (identified) {
      myName = identified.name;
      document.getElementById("avatar-btn").textContent = identified.name.slice(0, 1);
    }
    return identified;
  })();
  document.getElementById("avatar-btn").addEventListener("click", () => {
    location.href = "profile.html";
  });

  showPageLoading(document.getElementById("hero-wrap"));

  // Every club-scoped read carries the caller's token now, so nothing may
  // fetch before LIFF identity has resolved — otherwise authHeader() is
  // empty and the server correctly says 401.
  identityReady.then((identified) => {
    if (!identified) {
      stopLoadingEscalation();
      document.getElementById("hero-wrap").innerHTML = signInFailureHtml(identified);
      return;
    }
    initClubAndSeasonPickers(
      API_BASE,
      document.getElementById("club-picker"),
      document.getElementById("season-picker"),
      "vf_org_season",
      (id) => {
        stopLoadingEscalation();
        document.getElementById("club-picker").hidden = !currentClubId();
        if (id) loadDashboard(id);
        else renderNoSeason();
      },
      (e) => showPageError(document.getElementById("hero-wrap"), e.message),
      // Only the clubs this person actually organizes — see
      // initClubAndSeasonPickers. A club they merely belong to used to
      // appear here and open a management screen they cannot use.
      (c) => c.role === "organizer"
    );
  });

  function renderNoSeason() {
    currentSeason = null;
    document.getElementById("season-meta").innerHTML = "";
    document.getElementById("cal-label").hidden = true;
    document.getElementById("month-cal").hidden = true;
    document.getElementById("season-picker").hidden = true;
    document.getElementById("hero-wrap").innerHTML = currentClubId()
      ? emptyStateHtml(
          "這個球隊還沒有開季",
          "建立第一季之後，這裡會顯示下一場的出席人數、男女比，以及需要你處理的事情。",
          { label: "建立第一季", href: "organizer-settings.html" }
        )
      : emptyStateHtml("還沒有球隊", "請先到會員頁用 LINE 開啟，建立或加入一個球隊。", {
          label: "前往會員頁",
          href: "member.html",
        });
    document.getElementById("hero-wrap").onclick = null;
  }

  const dashboardLoad = staleGuard();

  async function loadDashboard(seasonId) {
    const ticket = dashboardLoad.take();
    const errorEl = document.getElementById("error");
    errorEl.textContent = "";
    try {
      // Cached copy first, network second — see getJsonSWR.
      await getJsonSWR(`${API_BASE}/seasons/${seasonId}`, (season) => render(season), {
        headers: authHeader(),
      });
    } catch (e) {
      errorEl.textContent = "連不上伺服器：" + e.message;
    }

    function render(season) {
      if (!dashboardLoad.current(ticket)) return;
      // Same reasoning as the member page: every action here ends in a
      // reload, and redrawing data that hasn't changed costs a frame and
      // reads as a stutter a second after the tap already worked.
      if (currentSeason && JSON.stringify(season) === JSON.stringify(currentSeason)) return;
      const isNewSeason = !currentSeason || currentSeason.id !== season.id;
      currentSeason = season;
      // Keep whatever game was selected across a reload — only reset to
      // the next upcoming game when switching seasons, or on first load.
      if (isNewSeason || !season.games.some((g) => g.id === selectedGameId)) {
        const upcoming = season.games.find((g) => !describeDate(g.date).isPast) || season.games[season.games.length - 1];
        selectedGameId = upcoming ? upcoming.id : null;
      }

      document.getElementById("season-picker").hidden = false;
      document.getElementById("cal-label").hidden = false;
      document.getElementById("month-cal").hidden = false;
        renderMeta(season);
      renderHero(season);
      renderCalendar();
      renderSelectedGameDetail();
      // Only the substitute picker needs the club roster, so it loads
      // alongside the paint instead of delaying it — and only repaints
      // if it actually brought something new. It used to repaint every
      // time, so every tap drew the sheet, waited out a round trip, and
      // drew the identical sheet again: the visible flicker reported as
      // 瞬間跳針.
      fetchClubMembers(API_BASE, currentClubId()).then((m) => {
        if (JSON.stringify(m) === JSON.stringify(clubMembers)) return;
        clubMembers = m;
        renderSelectedGameDetail();
      });
    }
  }

  /** This season's terms, as figures rather than a row of small pills.
   *
   * They were five grey pills of the same size — the venue cost, the
   * minimum roster, the times, the location and the settled state all
   * weighted identically and all looking like footnotes. The two that
   * are money and the two that are logistics are not the same kind of
   * fact, so they no longer look the same: the numbers lead, the
   * arrangements sit under them as a line of text, and 已結算 is a
   * state so it reads as a state.
   */
  function renderMeta(season) {
    const el = document.getElementById("season-meta");
    const settled = season.settled_at !== null;
    const games = season.games.length;
    const when = [
      season.game_start_time && season.game_end_time
        ? `${escapeHtml(season.game_start_time.slice(0, 5))}–${escapeHtml(season.game_end_time.slice(0, 5))}`
        : null,
      season.location ? escapeHtml(season.location) : null,
      `${games} 場・${season.members.length} 人`,
    ].filter(Boolean);

    el.innerHTML = `
      <div class="sm-figures">
        <div class="sm-figure">
          <span class="sm-label">場地費總額</span>
          <span class="sm-value">$${season.total_venue_cost}</span>
        </div>
        <div class="sm-figure">
          <span class="sm-label">每人每場</span>
          <span class="sm-value">$${season.share_per_game}</span>
        </div>
        <div class="sm-figure">
          <span class="sm-label">最低人數</span>
          <span class="sm-value">${season.minimum_roster}</span>
        </div>
      </div>
      <div class="sm-line">
        <span>${when.join(" · ")}</span>
        ${settled ? '<span class="sm-state done">已結算</span>' : '<span class="sm-state">尚未結算</span>'}
      </div>
    `;
  }

  function renderHero(season) {
    const wrap = document.getElementById("hero-wrap");
    const game =
      season.games.find((g) => g.id === selectedGameId) ||
      season.games.find((g) => !describeDate(g.date).isPast) ||
      season.games[season.games.length - 1];
    if (!game) { wrap.innerHTML = '<div class="empty">這一季還沒有場次</div>'; return; }
    selectedGameId = game.id;
    const expected = expectedAttendance(season, game);
    const shortPill = expected < season.minimum_roster
      ? `<span class="meta-pill" style="color:var(--warn)">低於最低門檻 <strong>${season.minimum_roster}</strong></span>`
      : `<span class="meta-pill">最低門檻 <strong>${season.minimum_roster}</strong> 人</span>`;
    const cancelled = game.status !== "scheduled";
    // Same card as the member page, so the two halves of the app read as
    // one app — the difference is what the buttons do, not how a game
    // looks. 名單 is where the organizer actually works, so it leads.
    wrap.innerHTML = renderGameHero(season, game, {
      metaPills: [shortPill],
      statusHtml: cancelled
        ? `<div class="hero-status absent">${statusLabel(game.status)}</div>`
        : "",
      actionsHtml: cancelled
        ? ""
        : `<button type="button" class="hact" onclick="openGameSheet()">名單與請假</button>
           <button type="button" class="hact quiet" onclick="location.href='organizer-settings.html'">場次設定</button>`,
      moreHtml: cancelled ? "" : acSwitch(season, game),
    });
    wrap.onclick = null;
  }

  /** Whether the air conditioning ran is a forecast when the season is
   * booked and a fact on the evening, so this is the one thing about a
   * game the organizer is expected to correct afterwards. It moves what
   * the club owes the venue and re-prices every member's share, so it
   * says so before doing it. */
  /** The state, not the action. A button would say what you can do; this
   * says what the game currently is, which is the thing worth being able
   * to check at a glance — the organizer opens this card for the roster
   * anyway, so a wrong setting catches the eye without needing a
   * separate "did you confirm?" flag. Absent entirely when the club
   * doesn't pay for air conditioning. */
  function acSwitch(season, game) {
    if (!(Number(season.ac_surcharge) > 0)) return "";
    const on = game.air_conditioned;
    const each = Math.round(Number(season.ac_surcharge) / season.members.length);
    return `
      <div class="ac-switch">
        <span class="lbl">冷氣</span>
        <span class="ac-seg">
          <button type="button" aria-pressed="${on}"
            onclick="toggleAirConditioning(${game.id}, true)">開</button>
          <button type="button" class="off" aria-pressed="${!on}"
            onclick="toggleAirConditioning(${game.id}, false)">關</button>
        </span>
        <span class="ac-cost">${on ? `每人 +$${each}` : "每人不加收"}</span>
      </div>`;
  }

  async function toggleAirConditioning(gameId, on) {
    if (on === currentSeason.games.find((g) => g.id === gameId).air_conditioned) return;
    const each = Math.round(Number(currentSeason.ac_surcharge) / currentSeason.members.length);
    const wording = on
      ? `要把這場改成「有開冷氣」嗎？每位成員這一場會多 $${each}。`
      : `要把這場改成「沒開冷氣」嗎？每位成員這一場會退 $${each}。`;
    if (!confirm(wording)) return;
    try {
      await postJson(API_BASE, `/games/${gameId}/air-conditioning`, { air_conditioned: on }, "PUT");
      loadDashboard(currentSeason.id);
    } catch (e) {
      toast("改冷氣設定失敗：" + e.message);
    }
  }

  function calendarState(game) {
    if (game.status !== "scheduled") return "away";
    const expected = expectedAttendance(currentSeason, game);
    if (expected >= currentSeason.capacity) return "full";
    if (expected < currentSeason.minimum_roster) return "short";
    return "";
  }

  function renderCalendar() {
    if (!currentSeason) return;
    renderMonthCalendar(
      document.getElementById("month-cal"),
      currentSeason.games,
      selectGame,
      { stateOf: calendarState, selectedId: selectedGameId, awayLabel: "已取消" }
    );
  }

  function selectGame(gameId) {
    selectedGameId = gameId;
    // Switches the card above the calendar rather than opening a modal —
    // the organizer scans dates far more often than they open a roster.
    renderHero(currentSeason);
    renderCalendar();
    renderSelectedGameDetail();
    const card = document.querySelector("#hero-wrap .hero");
    if (card) {
      card.classList.remove("card-swap");
      void card.offsetWidth;
      card.classList.add("card-swap");
    }
  }

  function renderSelectedGameDetail() {
    const el = document.getElementById("game-detail");
    const game = currentSeason && currentSeason.games.find((g) => g.id === selectedGameId);
    if (!currentSeason || !game) {
      el.innerHTML = '<div class="empty">這一季還沒有場次</div>';
      return;
    }
    renderGameDetail(el, currentSeason, game, {
      // The same pills the member sees on the same game. They were
      // missing here, so opening one game from the two pages showed two
      // different sets of facts about it — the price and whether the air
      // conditioning is on are exactly what gets asked about on the
      // night, and the organizer is the one being asked.
      heroMetaPills: [acPill(currentSeason, game)],
      statusHtml: game.status === "scheduled"
        ? ""
        : `<div class="hero-status absent">${statusLabel(game.status)}</div>`,
      clubMembers,
      viewerName: myName,
      onAssignSubstitute: (absenceId, name, gender) => assignSubstitute(absenceId, name, gender),
      onLeaveWaitlist: (entryId, btn) => leaveWaitlistFor(entryId, btn),
      onPromoteFromWaitlist: (entryId, btn) => promoteFromWaitlist(entryId, btn),
      onCancelSubstitute: (dropInId, btn) => cancelSubstitute(dropInId, btn),
      // The organizer arranges all of this for other people: half the
      // club tells them in person or in the group chat, and members with
      // no LINE account can't do any of it themselves.
      onRecordAbsence: (playerName, btn) => recordAbsenceFor(playerName, btn),
      onCancelAbsence: (absenceId, btn) => cancelAbsenceFor(absenceId, btn),
      onRemoveDropIn: (dropInId, btn) => cancelSubstitute(dropInId, btn),
      onAddDropIn: (name, gender, btn) => addDropIn(name, gender, btn),
      // No canAssignSubstitute restriction — the organizer can arrange
      // a substitute for anyone's absence, not just their own.
    });
  }

  function openGameSheet() {
    document.getElementById("game-sheet-backdrop").hidden = false;
  }

  function closeGameSheet() {
    document.getElementById("game-sheet-backdrop").hidden = true;
  }

  const gameSheetBackdrop = document.getElementById("game-sheet-backdrop");
  gameSheetBackdrop.addEventListener("click", (e) => {
    if (e.target === gameSheetBackdrop) closeGameSheet();
  });
  document.querySelector(".gsheet-close").addEventListener("click", closeGameSheet);

  async function assignSubstitute(absenceId, name, gender) {
    try {
      await postJson(
        API_BASE,
        `/absences/${absenceId}/substitute`,
        { player_name: name, gender },
        "PUT"
      );
      loadDashboard(currentSeason.id);
    } catch (e) {
      toast("設定代打失敗：" + e.message);
    }
  }

  async function recordAbsenceFor(playerName, btn) {
    try {
      await withButtonFeedback(btn, "處理中...", async () => {
        await postJson(API_BASE, "/absences", {
          player_name: playerName,
          game_id: selectedGameId,
        });
      });
      loadDashboard(currentSeason.id);
    } catch (e) {
      toast("代為請假失敗：" + e.message);
    }
  }

  async function cancelAbsenceFor(absenceId, btn) {
    try {
      await withButtonFeedback(btn, "處理中...", async () => {
        await postJson(API_BASE, `/absences/${absenceId}/cancel`, {});
      });
      loadDashboard(currentSeason.id);
    } catch (e) {
      toast("取消請假失敗：" + e.message);
    }
  }

  async function addDropIn(name, gender, btn) {
    try {
      await withButtonFeedback(btn, "新增中...", async () => {
        const created = await postJson(API_BASE, "/drop-ins", {
          player_name: name,
          game_id: selectedGameId,
        });
        // A drop-in is often someone with no account, so their gender —
        // which the roster's male/female count needs — has to be set for
        // them, and only right after they exist.
        if (gender && created.player_id) {
          await postJson(API_BASE, `/players/${created.player_id}/gender`, { gender }, "PUT")
            .catch(() => {});
        }
      });
      loadDashboard(currentSeason.id);
    } catch (e) {
      toast("新增臨打失敗：" + e.message);
    }
  }

  /** Removing someone from the queue. Its own endpoint because a queue
   * place is a different table from a confirmed signup and the two id
   * sequences overlap — see routes.leave_waitlist. */
  async function leaveWaitlistFor(entryId, btn) {
    try {
      await withButtonFeedback(btn, "移除中...", async () => {
        await postJson(API_BASE, `/waitlist/${entryId}/cancel`, {});
      });
      loadDashboard(currentSeason.id);
    } catch (e) {
      toast("移除候補失敗：" + e.message);
    }
  }

  /** Putting a queued person on the court, in the order you decide
   * rather than the order they arrived — the first in line is often the
   * one who can't make it tonight.
   *
   * When the game is full the server refuses rather than overfilling
   * (the capacity cap is a rule — decided 2026-09-10), so the only way
   * in is to name who comes out. Asking here and sending both in one
   * request is deliberate: cancelling first would let the automatic
   * first-in-line rule take the slot before this person could, and each
   * of those promotions is a real charge and refund on somebody's
   * ledger. */
  async function promoteFromWaitlist(entryId, btn) {
    const game = currentSeason.games.find((g) => g.id === selectedGameId);
    const entry = game.waitlist_entries.find((w) => w.id === entryId);
    const playing = game.confirmed_drop_ins;
    let replacing = null;

    if (isGameFull(currentSeason, game)) {
      if (playing.length === 0) {
        toast(`這一場已滿 ${currentSeason.capacity} 人，且全是固定成員 —— 請先讓某位請假，或到設定調高上限。`);
        return;
      }
      const choice = prompt(
        `這一場已滿 ${currentSeason.capacity} 人。要讓「${entry.player_name}」上場，` +
          `請輸入要換下來的臨打編號：\n\n` +
          playing.map((d, i) => `${i + 1}. ${d.player_name}`).join("\n"),
        ""
      );
      if (choice === null) return;
      const picked = playing[Number(choice) - 1];
      if (!picked) {
        toast("沒有這個編號，沒有做任何更動。");
        return;
      }
      replacing = picked;
    }

    try {
      await withButtonFeedback(btn, "遞補中...", async () => {
        await postJson(API_BASE, `/waitlist/${entryId}/promote`, {
          replacing_drop_in_id: replacing ? replacing.id : null,
        });
      });
      toast(
        replacing
          ? `${entry.player_name} 上場，${replacing.player_name} 換下。`
          : `${entry.player_name} 已遞補上場。`
      );
      loadDashboard(currentSeason.id);
    } catch (e) {
      toast("遞補失敗：" + e.message);
    }
  }

  async function cancelSubstitute(dropInId, btn) {
    try {
      await withButtonFeedback(btn, "取消中...", async () => {
        await postJson(API_BASE, `/drop-ins/${dropInId}/cancel`, {});
      });
      loadDashboard(currentSeason.id);
    } catch (e) {
      toast("取消代打失敗：" + e.message);
    }
  }

  function statusLabel(status) {
    if (status === "cancelled_unrefunded") return "取消・場地費不退";
    if (status === "cancelled_refunded") return "取消・場地費已退";
    return status;
  }

</script>
</body>
</html>
