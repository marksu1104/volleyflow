<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolleyFlow 個人資料</title>
<link rel="preconnect" href="https://volleyflow.onrender.com" crossorigin>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  .name-save-row { display: flex; gap: 8px; }
  .name-save-row input { flex: 1; }
  .name-save-row button {
    flex: none; padding: 0 16px; border: none; border-radius: 9px; background: var(--accent);
    color: var(--surface); font-weight: 700; font-size: .86rem; cursor: pointer; font-family: var(--font-cjk);
  }
  .no-liff { color: var(--ink-soft); font-size: .85rem; padding: 30px 0; text-align: center; }
  #report-preview {
    display: block; margin-top: 8px; max-width: 160px; border-radius: 8px;
    border: 1px solid var(--rule);
  }
  #report-preview[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-bar">
    <span class="app-bar-left">
      <button type="button" class="back-btn" onclick="location.href='member.html'">‹ 返回</button>
    </span>
    <button type="button" class="brand" onclick="location.href='member.html'">VolleyFlow</button>
    <span class="app-bar-right"></span>
  </div>

  <h1>個人資料</h1>
  <div id="identity" class="identity"></div>

  <div id="content" hidden>
    <div class="prof">
      <div class="avatar lg" id="avatar-lg">?</div>
      <div>
        <div class="prof-name" id="prof-name"></div>
        <div class="prof-sub">LINE 已連結・名字取自 LINE 個人檔案</div>
      </div>
    </div>

    <div class="field">
      <label for="name-input">名單上顯示的名字</label>
      <div class="name-save-row">
        <input id="name-input" class="control" type="text">
        <button type="button" onclick="saveName()">儲存</button>
      </div>
      <p class="hint">主揪和其他人在名單上看到的就是這個名字。</p>
    </div>

    <div class="field">
      <label>性別</label>
      <div class="seg-pick" id="gender-pick">
        <button type="button" data-gender="male">男</button>
        <button type="button" data-gender="female">女</button>
      </div>
      <p class="hint">只用來統計每場的男女人數，不影響帳務。</p>
    </div>

    <div class="section-label" id="clubs-label"></div>
    <div id="clubs-list"></div>
    <p class="hint">餘額分球隊各自計算，不會互相流用。</p>

    <div class="section-label">回報問題</div>
    <div class="field">
      <textarea id="report-text" class="control" rows="4"
        placeholder="哪個畫面、按了什麼、發生什麼事？例如：帳務頁按「已收」之後金額沒有變。"></textarea>
      <p class="hint">
        你是誰、在哪一頁、用什麼裝置會自動附上，不用自己打。送出後會直接傳到開發者的 LINE。
      </p>
    </div>
    <div class="field">
      <label for="report-shot">截圖（選填）</label>
      <input id="report-shot" class="control" type="file" accept="image/*">
      <img id="report-preview" alt="" hidden>
    </div>
    <button type="button" class="btn btn-primary" id="report-btn" onclick="sendReport()">送出回報</button>
  </div>

  <div id="no-liff" class="no-liff" hidden></div>
</div>

<script src="shared.js"></script>
<script>
  const API_BASE = "https://volleyflow.onrender.com";
  const LIFF_ID = "2011156233-6CouG6VI";
  let me = null;

  (async function init() {
    const identityEl = document.getElementById("identity");
    const identified = await initLiffIdentity(API_BASE, LIFF_ID);
    if (!identified) {
      identityEl.textContent = "";
      const notice = document.getElementById("no-liff");
      notice.innerHTML = signInFailureHtml(identified);
      notice.hidden = false;
      return;
    }
    me = identified;
    identityEl.textContent = `已用 LINE 身分登入：${identified.name}`;
    document.getElementById("content").hidden = false;
    renderProfile();
    await renderClubs();
  })();

  function renderProfile() {
    document.getElementById("avatar-lg").textContent = me.name.slice(0, 1);
    document.getElementById("prof-name").textContent = me.name;
    document.getElementById("name-input").value = me.name;
    for (const btn of document.querySelectorAll("#gender-pick [data-gender]")) {
      btn.classList.toggle("selected", me.gender === btn.dataset.gender);
    }
  }

  async function saveName() {
    const name = document.getElementById("name-input").value.trim();
    if (!name) { toast("名字不能是空的"); return; }
    if (name === me.name) return;
    try {
      const updated = await postJson(API_BASE, `/players/${me.id}/name`, { name }, "PUT");
      // initLiffIdentity caches "who am I" for the session; the name in
      // it is now wrong.
      sessionStorage.removeItem("vf_identity");
      me.name = updated.name;
      renderProfile();
      if (updated.name !== name) {
        toast(`「${name}」已經有人使用，改成了「${updated.name}」`);
      }
    } catch (e) {
      toast("儲存失敗：" + e.message);
    }
  }

  document.getElementById("gender-pick").addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-gender]");
    if (!btn) return;
    const previous = me.gender;
    me.gender = btn.dataset.gender;  // flip now, confirm after
    renderProfile();
    try {
      const updated = await postJson(API_BASE, `/players/${me.id}/gender`, { gender: btn.dataset.gender }, "PUT");
      sessionStorage.removeItem("vf_identity");
      me.gender = updated.gender;
      renderProfile();
    } catch (e) {
      me.gender = previous;
      renderProfile();
      toast("設定失敗：" + e.message);
    }
  });

  let screenshot = null;

  /**
   * Shrinks the picture before it goes anywhere. A phone screenshot is
   * several megabytes, and the person sending it is by definition having
   * a bad time with this app already — quite possibly on the same weak
   * connection that caused whatever they're reporting. 1280px of JPEG is
   * more than enough to read a UI bug from.
   */
  document.getElementById("report-shot").addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    const preview = document.getElementById("report-preview");
    if (!file) {
      screenshot = null;
      preview.hidden = true;
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        screenshot = canvas.toDataURL("image/jpeg", 0.7);
        preview.src = screenshot;
        preview.hidden = false;
      };
      img.onerror = () => {
        screenshot = null;
        preview.hidden = true;
        toast("讀不到這張圖片，請換一張試試。");
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

  async function sendReport() {
    const box = document.getElementById("report-text");
    const text = box.value.trim();
    if (!text) {
      toast("請先描述一下遇到的問題");
      return;
    }
    const btn = document.getElementById("report-btn");
    try {
      await withButtonFeedback(btn, "送出中…", async () => {
        await postJson(API_BASE, "/reports", {
          message: text,
          // Sent rather than asked for: "it broke" is only actionable
          // with the where, and nobody types a user agent by hand.
          page: location.pathname.split("/").pop() || "profile.html",
          user_agent: navigator.userAgent,
          club_id: currentClubId() ? Number(currentClubId()) : null,
          screenshot,
        });
      });
      box.value = "";
      screenshot = null;
      document.getElementById("report-shot").value = "";
      document.getElementById("report-preview").hidden = true;
      btn.disabled = false;
      btn.textContent = "送出回報";
      toast("已送出，謝謝你的回報。");
    } catch (e) {
      btn.disabled = false;
      btn.textContent = "送出回報";
      toast("送出失敗：" + e.message);
    }
  }

  async function renderClubs() {
    const res = await fetch(`${API_BASE}/players/${me.id}/clubs`, { headers: authHeader() });
    const clubs = res.ok ? await res.json() : [];
    document.getElementById("clubs-label").textContent = `我的球隊 ${clubs.length} 個`;

    const balances = await Promise.all(
      clubs.map((c) =>
        fetch(`${API_BASE}/clubs/${c.id}/players/${me.id}/ledger`, { headers: authHeader() })
          .then((r) => (r.ok ? r.json() : null))
          .catch(() => null)
      )
    );

    document.getElementById("clubs-list").innerHTML = clubs
      .map((c, i) => {
        const ledger = balances[i];
        const roleTag = c.role === "organizer" ? '<span class="role-tag">主揪</span>' : "";
        let balHtml = "";
        if (ledger) {
          const n = Number(ledger.balance);
          const cls = n === 0 ? "" : n > 0 ? "bal plus" : "bal minus";
          const text = n === 0 ? "已結清" : n > 0 ? `餘額 $${ledger.balance}` : `應繳 $${Math.abs(n)}`;
          balHtml = n === 0 ? "" : `<span class="${cls}">${text}</span>`;
        }
        return `
          <div class="club-row display">
            <i class="club-dot">${escapeHtml(c.name.slice(0, 1))}</i>
            <span class="cr-name">${escapeHtml(c.name)}</span>
            ${roleTag}${balHtml}
          </div>
        `;
      })
      .join("") || '<div class="empty">還沒有加入任何球隊</div>';
  }
</script>
</body>
</html>
