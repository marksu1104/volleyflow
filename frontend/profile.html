<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolleyFlow 個人資料</title>
<link rel="preconnect" href="https://volleyflow.onrender.com" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap">
<link rel="stylesheet" href="css/shared.css">
<style>
  .no-liff { color: var(--ink-soft); font-size: .85rem; padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-bar">
    <span class="app-bar-left">
      <button type="button" class="back-btn" onclick="location.href='member.html'">‹ 返回</button>
    </span>
    <button type="button" class="brand" onclick="location.href='member.html'">VolleyFlow</button>
    <span class="app-bar-right"></span>
  </div>

  <!-- Grouped one-line rows, values on the right: lighter to read than a
       heading and a full-width button for every item. -->
  <div id="boot"></div>
  <div id="content" hidden>
    <div class="me-head">
      <div class="avatar" id="avatar-lg">?</div>
      <div class="me-name" id="prof-name"></div>
      <span class="state-pill ok">LINE 已連結</span>
    </div>

    <div class="lgroup">個人設定</div>
    <div class="lcard">
      <button type="button" class="lrow" id="name-row" aria-expanded="false" aria-controls="name-edit">
        <span class="lrow-k">顯示名稱</span><span class="lrow-v" id="name-value"></span><span class="lrow-go" aria-hidden="true"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </button>
      <div class="lrow-edit" id="name-edit" hidden>
        <input id="name-input" class="control" type="text" aria-label="顯示名稱">
        <button type="button" onclick="saveName()">儲存</button>
      </div>
      <div class="lrow static">
        <span class="lrow-k">性別</span>
        <span class="seg-mini" id="gender-pick">
          <button type="button" data-gender="male">男</button>
          <button type="button" data-gender="female">女</button>
        </span>
      </div>
    </div>

    <div class="lgroup">我的球隊</div>
    <div class="lcard" id="clubs-list"></div>

    <div class="lgroup">通知與說明</div>
    <div class="lcard">
      <a class="lrow" id="oa-link"><span class="lrow-k">LINE 官方帳號</span><span id="oa-state"></span><span class="lrow-go" aria-hidden="true"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>
      <a class="lrow" href="report.html"><span class="lrow-k">回報問題</span><span class="lrow-go" aria-hidden="true"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>
    </div>

    <div id="dev-reports" hidden>
      <div class="lgroup">開發者</div>
      <div class="lcard">
        <a class="lrow" href="developer.html" id="dev-console-link"><span class="lrow-k">後台總覽</span><span class="lrow-go" aria-hidden="true"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>
        <a class="lrow" href="reports.html" id="dev-reports-link"><span class="lrow-k">問題回報</span><span class="lrow-v" id="dev-unread"></span><span class="lrow-go" aria-hidden="true"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>
      </div>
    </div>
  </div>

  <div id="no-liff" class="no-liff" hidden></div>
</div>

<script src="js/common/format.js"></script>
<script src="js/common/api.js"></script>
<script src="js/common/errors.js"></script>
<script src="js/common/feedback.js"></script>
<script src="js/common/clubs.js"></script>
<script src="js/common/season.js"></script>
<script src="js/common/game-sheet.js"></script>
<script src="js/pages/profile.js"></script>
</body>
</html>
