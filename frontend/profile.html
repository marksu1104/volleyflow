<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolleyFlow 個人資料</title>
<link rel="preconnect" href="https://volleyflow.onrender.com" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  .name-save-row { display: flex; gap: 8px; }
  .name-save-row input { flex: 1; }
  .name-save-row button {
    flex: none; padding: 0 16px; border: none; border-radius: 9px; background: var(--accent);
    color: var(--surface); font-weight: 700; font-size: .86rem; cursor: pointer; font-family: var(--font-cjk);
  }
  .no-liff { color: var(--ink-soft); font-size: .85rem; padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-bar">
    <span class="app-bar-left">
      <button type="button" class="back-btn" onclick="location.href='member.html'">‹ 返回</button>
    </span>
    <button type="button" class="brand" onclick="location.href='member.html'">VolleyFlow</button>
    <span class="app-bar-right"></span>
  </div>

  <h1>個人資料</h1>
  <div id="identity" class="identity"></div>

  <div id="content" hidden>
    <div class="prof">
      <div class="avatar lg" id="avatar-lg">?</div>
      <div>
        <div class="prof-name" id="prof-name"></div>
        <div class="prof-sub">LINE 已連結・名字取自 LINE 個人檔案</div>
      </div>
    </div>

    <div class="field">
      <label for="name-input">名單上顯示的名字</label>
      <div class="name-save-row">
        <input id="name-input" class="control" type="text">
        <button type="button" onclick="saveName()">儲存</button>
      </div>
      <p class="hint">管理員和其他人在名單上看到的就是這個名字。</p>
    </div>

    <div class="field">
      <label>性別</label>
      <div class="seg-pick" id="gender-pick">
        <button type="button" data-gender="male">男</button>
        <button type="button" data-gender="female">女</button>
      </div>
      <p class="hint">只用來統計每場的男女人數，不影響帳務。</p>
    </div>

    <div class="section-label" id="clubs-label"></div>
    <div id="clubs-list"></div>
    <p class="hint">餘額分球隊各自計算，不會互相流用。</p>
    <!-- The rows above carry each club's balance; this is the way to the
         breakdown behind those figures. A link rather than making the
         rows tappable: this page is about the reader, and a club row
         here is a fact about them, not a control. -->
    <a class="btn btn-quiet" href="ledger.html">查看各隊明細</a>

    <!-- A link, not the form. Reporting a problem is not a profile
         setting, and the form used to sit below the name field, the
         gender picker and the club list — three things nobody scrolls
         past on their way to say something is broken. It has its own
         page now, which is also where the LINE rich menu's third button
         lands. Moved 2026-09-18. -->
    <!-- The permanent home for this. The join screen asks once, but it
         disappears on approval, and LINE will not push to anyone who has
         not added the account — so there has to be somewhere to do it
         afterwards. -->
    <div class="section-label">官方帳號</div>
    <a class="btn btn-quiet" id="oa-link">加入官方帳號</a>
    <p class="hint">通知只會發給已加入官方帳號的人。</p>

    <div class="section-label">回報問題</div>
    <a class="btn btn-quiet" href="report.html">回報問題</a>

    <div id="dev-reports" hidden>
      <div class="section-label">開發者</div>
      <a class="btn btn-quiet" href="reports.html" id="dev-reports-link">查看問題回報</a>
      <a class="btn btn-quiet" href="developer.html" id="dev-console-link">後台總覽</a>
    </div>
  </div>

  <div id="no-liff" class="no-liff" hidden></div>
</div>

<script src="shared.js"></script>
<script>
  // localhost -> the local API, anywhere else -> production. See apiBase.
  const API_BASE = apiBase();
  const LIFF_ID = "2011156233-6CouG6VI";
  let me = null;

  (async function init() {
    const identityEl = document.getElementById("identity");
    const identified = await initLiffIdentity(API_BASE, LIFF_ID);
    if (!identified) {
      identityEl.textContent = "";
      const notice = document.getElementById("no-liff");
      notice.innerHTML = signInFailureHtml(identified);
      notice.hidden = false;
      return;
    }
    me = identified;
    identityEl.textContent = `已用 LINE 身分登入：${identified.name}`;
    document.getElementById("content").hidden = false;
    // Wired here rather than hardcoded in the markup so the address
    // lives in exactly one place (shared.js) — member.html's join screen
    // offers the same link.
    document.getElementById("oa-link").href = OFFICIAL_ACCOUNT_URL;
    renderProfile();
    if (me.is_developer) showDeveloperReports();
    await renderClubs();
  })();

  /** The way in to the problem reports, for the developer only — the
   * server names them in identify, and checks again on every report
   * request, so this only decides whether a link is drawn.
   *
   * The unread count is the whole signal now: reports stopped being
   * pushed over LINE on 2026-09-15, to keep the free tier's 200 monthly
   * messages for the short-roster alert. */
  async function showDeveloperReports() {
    document.getElementById("dev-reports").hidden = false;
    try {
      const res = await fetch(`${API_BASE}/reports`, { headers: authHeader() });
      if (!res.ok) return;
      const unread = (await res.json()).filter((r) => !r.read).length;
      if (unread) {
        document.getElementById("dev-reports-link").textContent = `查看問題回報（${unread} 則未讀）`;
      }
    } catch (e) {
      // The link still works without a count.
    }
  }

  function renderProfile() {
    document.getElementById("avatar-lg").textContent = me.name.slice(0, 1);
    document.getElementById("prof-name").textContent = me.name;
    document.getElementById("name-input").value = me.name;
    for (const btn of document.querySelectorAll("#gender-pick [data-gender]")) {
      btn.classList.toggle("selected", me.gender === btn.dataset.gender);
    }
  }

  async function saveName() {
    const name = document.getElementById("name-input").value.trim();
    if (!name) { toast("名稱不得為空白"); return; }
    // Both of these used to be silent: pressing 儲存 with the name
    // unchanged returned without a word, and a successful save said
    // nothing unless the name had been taken. A button that does
    // nothing visible is indistinguishable from a broken one.
    if (name === me.name) { toast("名稱未變更"); return; }
    try {
      const updated = await postJson(API_BASE, `/players/${me.id}/name`, { name }, "PUT");
      // initLiffIdentity caches "who am I" for the session; the name in
      // it is now wrong.
      sessionStorage.removeItem("vf_identity");
      me.name = updated.name;
      renderProfile();
      toast(
        updated.name !== name
          ? `「${name}」已經有人使用，改成了「${updated.name}」`
          : "已儲存"
      );
    } catch (e) {
      toast("儲存失敗：" + e.message);
    }
  }

  document.getElementById("gender-pick").addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-gender]");
    if (!btn) return;
    const previous = me.gender;
    me.gender = btn.dataset.gender;  // flip now, confirm after
    renderProfile();
    try {
      const updated = await postJson(API_BASE, `/players/${me.id}/gender`, { gender: btn.dataset.gender }, "PUT");
      sessionStorage.removeItem("vf_identity");
      me.gender = updated.gender;
      renderProfile();
    } catch (e) {
      me.gender = previous;
      renderProfile();
      toast("設定失敗：" + e.message);
    }
  });

  // The report form, its screenshot downscaler and sendReport all moved
  // to report.html on 2026-09-18 — deleted here rather than left behind
  // as dead code, so there is exactly one place that can send a report.

  function clubRowHtml(club) {
    const roleTag = club.role === "organizer" ? '<span class="role-tag">管理員</span>' : "";
    /* The balance rides on the club row itself now — see GET
     * /players/{id}/clubs. It used to be fetched per club and passed in
     * separately, which is what made this card slow.
     *
     * The badge, its NaN guard and its wording live in shared.js; see
     * balanceBadgeHtml. No `settled` label here: this page is about the
     * reader, and "you are square with this club" is not news on it. */
    const balHtml = balanceBadgeHtml(club.balance);
    return `
      <div class="club-row display">
        <i class="club-dot">${escapeHtml(club.name.slice(0, 1))}</i>
        <span class="cr-name">${escapeHtml(club.name)}</span>
        ${roleTag}${balHtml}
      </div>
    `;
  }

  /** 我的球隊.
   *
   * Reported as 「每次都會進入網頁後過很久才載入出現」. Measured at 824ms to
   * the heading and 1,085ms to the rows — not slow against the rest of
   * the app, which is why it took three goes to see what was actually
   * wrong: this card had no loading state at all, so that second was a
   * blank space rather than a visibly busy one, and a blank space reads
   * as a page that has finished and found nothing.
   *
   * Something is on screen immediately, and the club names paint from
   * the last visit's copy without waiting for the network (see
   * getJsonSWR).
   *
   * The balances used to arrive separately, one request per club,
   * painted over the rows once they landed. That was the N+1 behind the
   * original complaint, and it also meant the list rendered twice —
   * names, then names-with-figures — so the row content shifted under
   * the reader a moment after appearing. One request now carries both,
   * and the rows paint once. */
  async function renderClubs() {
    const list = document.getElementById("clubs-list");
    showPageLoading(list);
    try {
      await getJsonSWR(
        `${API_BASE}/players/${me.id}/clubs`,
        (clubs) => {
          stopLoadingEscalation();
          document.getElementById("clubs-label").textContent = `我的球隊 ${clubs.length} 個`;
          list.innerHTML =
            clubs.map((c) => clubRowHtml(c)).join("") ||
            '<div class="empty">尚未加入任何球隊</div>';
        },
        { headers: authHeader() }
      );
    } catch (e) {
      stopLoadingEscalation();
      showPageError(list, e.message);
    }
  }
</script>
</body>
</html>
