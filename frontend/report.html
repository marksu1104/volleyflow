<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolleyFlow 回報問題</title>
<link rel="preconnect" href="https://volleyflow.onrender.com" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap">
<link rel="stylesheet" href="css/shared.css">
<style>
  /* Same preview as the form had on the profile page — a thumbnail, not
     the full picture: a phone screenshot at full width pushes the send
     button off the screen, which is a poor thing to do to somebody who
     is already reporting that something is broken. */
  #report-preview {
    display: block; margin-top: 8px; max-width: 160px; border-radius: 8px;
    border: 1px solid var(--rule);
  }
  #report-preview[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-bar">
    <span class="app-bar-left">
      <button type="button" class="back-btn" onclick="goBack()">‹ 返回</button>
    </span>
    <button type="button" class="brand" onclick="location.href='member.html'">VolleyFlow</button>
    <span class="app-bar-right"></span>
  </div>

  <h1>回報問題</h1>

  <div id="page-state"></div>

  <div id="content" hidden>
    <div class="field">
      <label for="report-text">問題描述</label>
      <textarea id="report-text" class="control" rows="5"
        placeholder="請說明發生問題的頁面、操作步驟與結果。例如：帳務頁按「已收」後金額未更新。"></textarea>
      <p class="hint">
        身分、頁面與裝置資訊會自動附上，無須自行填寫。回報會保存在網站上，由開發者查看。
      </p>
    </div>

    <div class="field">
      <label for="report-shot">截圖（選填）</label>
      <input id="report-shot" class="control" type="file" accept="image/*">
      <img id="report-preview" alt="" hidden>
      <p class="hint">附上截圖有助於判斷問題。</p>
    </div>

    <button type="button" class="btn btn-primary" id="report-btn" onclick="sendReport()">送出回報</button>
  </div>
</div>

<script src="js/common/format.js"></script>
<script src="js/common/api.js"></script>
<script src="js/common/errors.js"></script>
<script src="js/common/feedback.js"></script>
<script src="js/common/clubs.js"></script>
<script src="js/common/season.js"></script>
<script src="js/common/game-sheet.js"></script>
<script src="js/pages/report.js"></script>
</body>
</html>
