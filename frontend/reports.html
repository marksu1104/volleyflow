<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VolleyFlow 問題回報</title>
<link rel="preconnect" href="https://volleyflow.onrender.com" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@600;700;800&display=swap">
<link rel="stylesheet" href="css/shared.css">
<style>
  .report { padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .report-head {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
    font-size: .8rem; color: var(--ink-soft);
  }
  .report-head strong { color: var(--ink); font-size: .9rem; }
  .report-new {
    padding: 1px 7px; border-radius: 99px; background: var(--accent);
    color: var(--surface); font-size: .7rem; font-weight: 700;
  }
  /* A report is whatever somebody typed — line breaks included, and
     sometimes one long unbroken string pasted from somewhere. */
  .report-body { margin: 6px 0 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .report-meta { font-size: .74rem; color: var(--ink-soft); overflow-wrap: anywhere; }
  .report-shot {
    display: block; max-width: 220px; max-height: 320px; margin-top: 8px;
    border-radius: 8px; border: 1px solid var(--rule);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="app-bar">
    <span class="app-bar-left">
      <button type="button" class="back-btn" onclick="location.href='profile.html'">‹ 返回</button>
    </span>
    <button type="button" class="brand" onclick="location.href='member.html'">VolleyFlow</button>
    <span class="app-bar-right"></span>
  </div>

  <h1>問題回報</h1>
  <p class="hint" id="reports-sub"></p>
  <div id="reports"></div>
</div>

<script src="js/common/format.js"></script>
<script src="js/common/api.js"></script>
<script src="js/common/errors.js"></script>
<script src="js/common/feedback.js"></script>
<script src="js/common/clubs.js"></script>
<script src="js/common/season.js"></script>
<script src="js/common/game-sheet.js"></script>
<script src="js/pages/reports.js"></script>
</body>
</html>
