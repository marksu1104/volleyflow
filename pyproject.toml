[project]
name = "volleyflow"
version = "0.1.0"
description = "Signup, waitlist, and billing engine for a weekly volleyball game"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.14",
    "ruff>=0.9",
    "pre-commit>=4.0",
    "import-linter>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volleyflow"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern requires calling Depends() as a
# default argument value — that's the API, not the mutable-default trap
# B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not postgres'"
markers = [
    "postgres: hits the real Neon database instead of in-memory SQLite; excluded by default, run explicitly with -m postgres",
]

[tool.coverage.run]
source = ["src/volleyflow"]

[tool.coverage.report]
fail_under = 0
show_missing = true

[tool.importlinter]
root_package = "volleyflow"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain modules must not depend on the db layer"
type = "forbidden"
source_modules = [
    "volleyflow.players",
    "volleyflow.schedule",
    "volleyflow.attendance",
    "volleyflow.pricing",
    "volleyflow.settlement",
    "volleyflow.ledger",
]
forbidden_modules = [
    "volleyflow.db",
    "sqlalchemy",
]
