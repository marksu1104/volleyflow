<title>VolleyFlow rich menu</title>
<style>
  /* LINE's compact rich menu is exactly 2500x843. Rendered at that size
     and screenshotted, so the artwork is regenerable from source rather
     than being a binary nobody can edit.

     Colours are VolleyFlow's own tokens copied from frontend/shared.css
     — this panel sits directly under the chat that opens the app, so it
     has to look like the app rather than like a separate product. Light
     palette only: a rich menu image is static, LINE does not theme it. */
  @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Outfit:wght@700;800&display=swap");

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 2500px; height: 843px;
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: #ffffff;
    font-family: "Noto Sans TC", system-ui, sans-serif;
  }
  .cell {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 58px;
    border-right: 3px solid #dde2ea;
    background: #ffffff;
  }
  .cell:last-child { border-right: none; }

  /* No accent cell, deliberately. One of the three was tinted at first,
     to give the panel a focal point — but a rich menu is a row of peers,
     not a page: the three destinations rank equally, and tapping one
     opens a page rather than selecting anything, so there is no state
     for an accent to express. It was decoration wearing hierarchy's
     clothes, and it made the strip visibly lopsided. Removed 2026-09-18
     when the organizer asked whether it was needed at all — the same
     principle as the 帳務 tabs holding their width: a row of peer
     controls should look like peers. Colour lives in the icons. */

  /* Enlarged 2026-09-22: 「字跟圖案都要大一點」. The first version used
     190px tiles holding a 104px icon — the icon filled barely half its
     own tile, so the strip read as small even where it wasn't, and the
     grey rounded square looked like a mistake rather than a frame. The
     icon now fills ~60% of the tile, which is what a tile is for.

     Room left over at this size: the tallest column uses about 60% of
     the 843px height, and 場次與報名 — the longest label — takes 76% of
     a 833px column, leaving roughly 100px of air each side. There is
     one more step available if it is ever wanted; past that the labels
     start crowding the dividers. */
  .glyph {
    width: 290px; height: 290px; border-radius: 70px;
    display: flex; align-items: center; justify-content: center;
    background: #f6f8fa;
  }
  .glyph svg { width: 176px; height: 176px; }

  /* One label per cell, and nothing under it. There was an English
     sub-label — GAMES / BALANCE / REPORT — which carried no information
     the Chinese did not already carry, and 「不要太多可以按的功能都用文字」
     was said about precisely that kind of decoration. */
  .label {
    font-size: 126px; font-weight: 700; color: #151b26; letter-spacing: .02em;
  }
</style>

<div class="cell">
  <div class="glyph">
    <!-- A calendar: the season's games -->
    <svg viewBox="0 0 24 24" fill="none" stroke="#15618f" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="16" rx="3" fill="none"></rect>
      <path d="M3 10h18"></path>
      <path d="M8 3v4M16 3v4"></path>
      <circle cx="8.5" cy="14.5" r="1.3" fill="#15618f" stroke="none"></circle>
      <circle cx="12" cy="14.5" r="1.3" fill="#15618f" stroke="none"></circle>
      <circle cx="15.5" cy="14.5" r="1.3" fill="#15618f" stroke="none"></circle>
    </svg>
  </div>
  <div class="label">場次與報名</div>
</div>

<div class="cell">
  <div class="glyph">
    <!-- A receipt: what you owe, what you have been refunded -->
    <svg viewBox="0 0 24 24" fill="none" stroke="#15618f" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z" fill="none"></path>
      <path d="M9.5 8h5M9.5 12h5M9.5 16h3"></path>
    </svg>
  </div>
  <div class="label">我的帳務</div>
</div>

<div class="cell">
  <div class="glyph">
    <!-- A speech bubble: tell the organizer something is wrong -->
    <svg viewBox="0 0 24 24" fill="none" stroke="#15618f" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 5h16v11H9l-5 4V5z" fill="none"></path>
      <path d="M12 8v3.5"></path>
      <circle cx="12" cy="13.6" r="1" fill="#15618f" stroke="none"></circle>
    </svg>
  </div>
  <div class="label">問題回報</div>
</div>
